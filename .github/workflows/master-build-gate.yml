name: Verify five certified cross-corpus chapter contributions
run-name: Verify five certified cross-corpus staging chapters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SOURCE: 1edbdaa39f72787362d0d0974519f819a8c05f2f
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Verify exact staged chapter extraction and chronology
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          start="$RUNNER_TEMP/cross-qualified"
          mkdir "$start"
          for scope in qingshigao/027; do
            book="${scope%/*}"
            chapter="${scope#*/}"
            npm run people:validate -- --book "$book" --chapter "$chapter" | tee "$start/$book-$chapter-validation.txt"
            npm run people:dates:verify -- --book "$book" --chapter "$chapter" --out "$start/$book-$chapter-chronology.json"
            jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$start/$book-$chapter-chronology.json"
            sha256sum "data/people/identity-reviews/$scope.json" > "$start/$book-$chapter-identity.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-qing027-witness-staging
          path: ${{ runner.temp }}/cross-qualified/
          if-no-files-found: error
          retention-days: 7
