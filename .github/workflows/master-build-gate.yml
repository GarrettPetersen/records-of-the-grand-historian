name: Master build gate

# Run on the proposed PR merge commit, not just the topic branch. Keep this
# workflow unfiltered so its required check is always reported for master PRs.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  master-build:
    name: master-build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test people date-hint normalization
        run: npm run people:hints:self-test

      - name: Prevent duplicate storage and local corpus builds
        run: |
          node --test scripts/test-people-generation-policy.mjs scripts/test-people-storage-policy.mjs scripts/test-people-git-storage.mjs scripts/test-people-recovery-checkpoint.mjs scripts/test-people-registry-deduplication.mjs
          python3 scripts/test-people-recovery-archive.py

      - name: Test unresolved people-date holds
        run: node scripts/test-people-unresolved-hold.mjs

      - name: Test Cursor date-worker recovery
        run: node --test scripts/test-people-date-worker.mjs scripts/test-people-date-send-recovery.mjs scripts/test-people-date-workflow.mjs scripts/test-people-date-ownership.mjs scripts/test-people-date-preflight-diagnostics.mjs scripts/test-openrouter-free.mjs

      - name: Test chapter-owner isolation and combined publication
        run: node --test --test-concurrency=1 scripts/test-people-chapter-owner.mjs scripts/test-people-chapter-editorial-preparation.mjs scripts/test-people-chapter-repair-reasons.mjs scripts/test-people-remote-admission.mjs scripts/test-people-combined-curation.mjs scripts/test-people-footnote-preparation.mjs scripts/test-people-private-identity-inputs.mjs scripts/test-people-source-only-chronology.mjs scripts/test-people-current-curation-provenance.mjs scripts/test-people-identity-proof-composition.mjs test/people-name-claim-correction.test.mjs scripts/people-owner-repair-chain.test.mjs

      - name: Test shared-host master synchronization
        run: npm run people:master:self-test

      - name: Install ebook publication verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils imagemagick zip unzip

      - name: Test certified ebook people provenance and publication gates
        run: node --test scripts/test-people-pinned-identity-source.mjs scripts/test-people-identity-dossier-delta.mjs scripts/test-people-product-inputs.mjs scripts/test-people-inferred-source-references.mjs scripts/test-people-identity-seal.mjs scripts/test-ebook-certified-people.mjs scripts/test-ebook-certified-cli.mjs scripts/test-ebook-people-readiness.mjs scripts/test-ebook-current-date-audits.mjs scripts/test-people-date-audit.mjs scripts/test-people-editorial-rejections.mjs

      - name: Test bounded canonical-person dossiers and chapter proofs
        run: |
          node --test scripts/test-people-identity-dossiers.mjs scripts/test-people-identity-dossier-store.mjs scripts/test-people-chapter-identity.mjs scripts/test-people-progress-ui.mjs scripts/test-people-corpus-reader.mjs
          npm run people:catalog:self-test
          npm run people:generated-data:self-test

      - name: Test certified website people publication
        run: node --test scripts/test-people-qualified-site.mjs scripts/test-people-site.mjs scripts/test-people-html-link-detection.mjs

      - name: Test reviewed name spans and translation repairs
        run: |
          node scripts/test-people-reviewed-name-spans.mjs
          node scripts/apply-people-translation-repairs.mjs --self-test

      - name: Build and validate the full site
        run: npm run build

      - name: Verify real Jinshu 053 qualification and ebook contribution
        run: node scripts/verify-people-chapter-release.mjs --book jinshu --chapter 053 --out data/people/generated/jinshu053-release-acceptance

      - name: Preserve nonempty chapter acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: jinshu053-qualified-contribution
          path: data/people/generated/jinshu053-release-acceptance/
          retention-days: 30

      - name: Verify real Jinshu 119 qualification and ebook contribution
        run: node scripts/verify-people-chapter-release.mjs --book jinshu --chapter 119 --out data/people/generated/jinshu119-release-acceptance

      - name: Preserve Jinshu 119 nonempty acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: jinshu119-qualified-contribution
          path: data/people/generated/jinshu119-release-acceptance/
          retention-days: 30

      - name: Verify approved chapter qualification and ebook contributions
        run: |
          for chapter in 117 120 129 130; do
            node scripts/verify-people-chapter-release.mjs --book jinshu --chapter "$chapter" --out "data/people/generated/jinshu${chapter}-release-acceptance"
          done

      - name: Preserve approved chapter nonempty acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: qualified-chapter-contributions
          path: |
            data/people/generated/jinshu117-release-acceptance/
            data/people/generated/jinshu120-release-acceptance/
            data/people/generated/jinshu129-release-acceptance/
            data/people/generated/jinshu130-release-acceptance/
          retention-days: 30
