name: Verify a Pages-ready deployment bundle in GitHub
run-name: Retain a checked deployment bundle as a GitHub draft
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SOURCE: a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
      RELEASE_TAG: pages-archive-a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
      INPUT_RUN: "45367426260"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the exact tested hosted archive build
        timeout-minutes: 19
        run: gh run watch "$INPUT_RUN" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: pages-ready-tested-master-site
          run-id: 45367426260
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/transport
      - name: Check exact site and Functions contents, then retain one private draft release bundle
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/transport"
          sha256sum -c SHA256SUMS
          test "$(cat revision.txt)" = "$SOURCE"
          count="$(python3 - website.tar.gz <<'PY'
          import os, posixpath, sys, tarfile
          root, seen = sys.argv[1], set()
          required = {'public/index.html', 'public/people/index.html', 'functions/people/[slug].js', 'wrangler.toml'}
          count = 0
          with tarfile.open(root, mode='r|gz') as archive:
           for member in archive:
            name = member.name.rstrip('/')
            if name.startswith('/') or posixpath.normpath(name) != name or name in seen or not (name in {'public','functions','wrangler.toml'} or name.startswith(('public/','functions/'))): raise ValueError('Unexpected archive member')
            if not (member.isdir() or member.isfile()) or member.size > 25*1024*1024 or any(x in {'.env','.git','node_modules'} for x in name.split('/')) or name.lower().endswith(('.epub','.mobi','.azw','.azw3')): raise ValueError('Unpublishable archive member')
            seen.add(name)
            count += member.isfile() and name.startswith('public/')
          if not required.issubset(seen) or not 1 <= count <= 20000: raise ValueError('Archive is missing required site/runtime files or exceeds Pages free file quota')
          print(count)
          PY
          )"
          test "$count" -eq "$(cat public-file-count.txt)"
          test "$(stat -c %s website.tar.gz)" -lt 2000000000
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "An exact release tag already exists; reconcile it before trying again"; exit 1; fi
          gh release create "$RELEASE_TAG" website.tar.gz SHA256SUMS revision.txt public-file-count.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --draft --prerelease --latest=false --title "Pages deployment archive for ${SOURCE:0:12}" --notes "Verified web publication files and Pages Functions for the recorded protected master revision."
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,targetCommitish,assets,url > "$RUNNER_TEMP/release-receipt.json"
          jq -e --arg sha "$SOURCE" --arg tag "$RELEASE_TAG" '(.targetCommitish==$sha) and (.tagName==$tag) and (.isDraft==true) and (.assets|length==4)' "$RUNNER_TEMP/release-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pages-fallback-draft-release-receipt
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
          retention-days: 3
