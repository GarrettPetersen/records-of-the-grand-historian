name: Certify partitioned glossary owner reviews
run-name: Certify exact independently reviewed partitioned glossary chapters
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      SHARD: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: retained-split-glossary-shard-${{ matrix.shard }}
          run-id: 45356094482
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify captures and run the native identity recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          const expected=[{"key":"liangshu/042","shard":1,"actor":"bc-ff12d8cf-ddcf-4efc-95b6-2453af6c7baf","run":"run-9e487aa6-bbb8-492c-9f10-e3e4583f2aee","owner":"bc-57d78b4f-f75f-42da-927e-a8e87fa358e5","packetSha256":"effccee7ae542a248f0bef48d1d907b5e6af1b09aff44c2e9ecf6f678bb626f4","planFingerprint":"sha256:2fbafe8fefce3b66541bce6b411d1ac43c1b8efc46d3a817ef14e2276ed970bc","cases":37,"parts":[{"file":"transport-part-001.json","sha256":"567280b7a4bc2c499839825b88f7679ba5e40faf92bdbadaed3d7c450b3eb09c"},{"file":"transport-part-002.json","sha256":"ea905c6ba755a93bf90d9488a9b90ae0e0488b32faaf6abe8e4076a3f685c2e7"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/liangshu-042/independent-identity-report-part-001.json","blob":"6a9f9e13f892a334f6fa661397b09e3ec7dd2aee","sha256":"e5e8a2c414a3a4869f774828c1a4113ab29d55f2ced82ab482b30e6bb15cd874","cases":18,"holds":[],"runId":"run-9e487aa6-bbb8-492c-9f10-e3e4583f2aee","evidenceHead":"17f982352d4496044ce8ab8c90ba7ed12be9227c","changedWitnesses":2,"scope":[{"caseId":"sha256:003b33ff8afc1daba56039d8a6cb692b0423961e14e407efc625f16439394cf2","affectedMembers":["liangshu:025:p004"],"verdict":"approve"},{"caseId":"sha256:6e2e091d5aceb0936f26bd194af9fd2a0c4346f7680410d5aea7039dd89e8b57","affectedMembers":["liangshu:042:p002"],"verdict":"approve"}]},{"path":"research/people/checkpoints/campaign-nov24-split-transport/liangshu-042/independent-identity-report-part-002.json","blob":"554c5ced3b8e264a7aeb3a60b8a5512010e70eee","sha256":"50f3ecdcef8eb8841c15e2bce5a4e0335b6390763fdc866114e382962e7e728b","cases":19,"holds":[],"runId":"run-9e487aa6-bbb8-492c-9f10-e3e4583f2aee","evidenceHead":"17f982352d4496044ce8ab8c90ba7ed12be9227c","changedWitnesses":2,"scope":[{"caseId":"sha256:15faa31dc9f68e807101b484b50548b52c3da2936d473e015510a0cc87d3add2","affectedMembers":["liangshu:042:p009"],"verdict":"approve"},{"caseId":"sha256:1181f82d194490943d54b3d3cd35e90b4cce4b607d7a43cfdba41bef274ce10f","affectedMembers":["liangshu:042:p010"],"verdict":"approve"}]}],"reviewHead":"17f982352d4496044ce8ab8c90ba7ed12be9227c"},{"key":"liangshu/055","shard":1,"actor":"bc-bab52765-08ef-40ab-a6a1-837818d184c1","run":"run-45bdd552-c4a4-489c-8c14-36712a3d71e4","owner":"bc-57d78b4f-f75f-42da-927e-a8e87fa358e5","packetSha256":"7a7e3e9790e4be140ed1677fdf920f7450ec4b55dd29fadb5d0e8e4fb18b3916","planFingerprint":"sha256:9abf95742fd35e6bf59464bca0185e0cfbfd1373e89b5ab67c99ea7321d970a5","cases":57,"parts":[{"file":"transport-part-001.json","sha256":"33cd26ba5d2f74a338aec5ac20ba08ef7d6b8c174193b8ce86cabc48a4e9039c"},{"file":"transport-part-002.json","sha256":"c5aba1dec95dbd06e3c34de7abd48335495ef6b7825cd113b6f049246a2bbfb9"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/liangshu-055/independent-identity-report-part-001.json","blob":"0f0d5b1a7eb5a8e3c632a8aa376bb7c7c468e54c","sha256":"d18b13f72d062b01bc8b851ebb67d66c6583b805854ee40efa2816eee33bb06c","cases":28,"holds":[],"runId":"run-45bdd552-c4a4-489c-8c14-36712a3d71e4","evidenceHead":"cdd69ea29c3ff69d2c6bb1ff39148ab0f4d5cd4c","changedWitnesses":4,"scope":[{"caseId":"sha256:0aee8c31fa8347237a30c121d05262dbb59bdbdbef279e195fc69c32f6fb9498","affectedMembers":["beiqishu:032:p018"],"verdict":"approve"},{"caseId":"sha256:440fb786d1c7a4fc2930ee72fdb9a923ee7935a7271c7e4f1588ab80febdba0f","affectedMembers":["liangshu:055:p056"],"verdict":"approve"},{"caseId":"sha256:5a8278d546c2154bd83be74d99535509af4ffa65a1c5ef155dc3e1450efea490","affectedMembers":["liangshu:055:p047"],"verdict":"approve"},{"caseId":"sha256:84bd6fc6b655b95154ffd35a8b0dcf65e46b6c34b4b07cb222b1997a828c19a6","affectedMembers":["chenshu:024:p002"],"verdict":"approve"}]},{"path":"research/people/checkpoints/campaign-nov24-split-transport/liangshu-055/independent-identity-report-part-002.json","blob":"b93af432a460b1a6881d463fd6b8439cd83ca99f","sha256":"965c29952663d44ab11478d7feee54bd18270bbb3a960a25bc230011dcbc439e","cases":29,"holds":[],"runId":"run-45bdd552-c4a4-489c-8c14-36712a3d71e4","evidenceHead":"cdd69ea29c3ff69d2c6bb1ff39148ab0f4d5cd4c","changedWitnesses":3,"scope":[{"caseId":"sha256:ec06311ae5d6dd7f82cad3c8a1b09c03f2e5aa89cf45ee89b54bb7d1c6a8c392","affectedMembers":["liangshu:055:p057","hanshu:070:p065"],"verdict":"approve"},{"caseId":"sha256:4b6b3038b3d3958f4b102c63a4a74e4c037ee38df364ce03d5ab2660ddcb1b80","affectedMembers":["liangshu:055:p050"],"verdict":"approve"},{"caseId":"sha256:fd2081f223fc68354ada9753b654bad77576b1c7d5f057f5dbfbc3607443914a","affectedMembers":["liangshu:055:p026"],"verdict":"approve"}]}],"reviewHead":"cdd69ea29c3ff69d2c6bb1ff39148ab0f4d5cd4c"},{"key":"houhanshu/119","shard":0,"actor":"bc-1aa35479-363a-4cfe-8004-2e6cd2766567","run":"run-ed1082c7-5d5f-499b-8ac0-3f07c58f3c94","owner":"bc-23529211-836c-4588-b3ee-a1d4918b098f","packetSha256":"b22ef670e98fe3bf759a77c608cfeffe5e222c66dab2722ff3b35907e2296a65","planFingerprint":"sha256:7b3ca225fa6938caf5608b7bbb0c9835f7d7eaaf34faec1f365b96906c0b9660","cases":44,"parts":[{"file":"transport-part-001.json","sha256":"de4a63bdd12d7044f30bf2be31ac9f14e95f53fcd75e4700cc9574f90a20d11d"},{"file":"transport-part-002.json","sha256":"10b3d3286d2c0e6bde4fcdc60b507fe2fea28f1f2f7306da59d79002c210bf90"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/houhanshu-119/independent-identity-report-part-001.json","blob":"17422770a8a29e7031137a08e74138191afc703c","sha256":"e5849781e151ab8d147dfc4304dd77a5daa02c75f63b531817d3d8f1ff76055d","cases":22,"approvals":22,"holds":[],"runId":"run-63513a1a-b1f5-4f0a-a34d-a159093328a6","evidenceHead":"83b7c54299c01afab0475de500511de1ec25f619","changedWitnesses":0},{"path":"research/people/checkpoints/campaign-nov24-split-transport/houhanshu-119/independent-identity-report-part-002.json","blob":"a4bdca450fca3221e6438333e62e302de0fdcef4","sha256":"930d7b1fe429927f9b34ac06ab88df624da4b08c007429d825f2203f19682f23","cases":22,"holds":[],"runId":"run-ed1082c7-5d5f-499b-8ac0-3f07c58f3c94","evidenceHead":"f58a079da2282484e5ebdc41a6d41e8eddf1ed94","changedWitnesses":1,"scope":[{"caseId":"sha256:8df57ce0dc8162fb341f64f33c9dd3f732500ee85c4335203c22d18d0f4adf45","affectedMembers":["houhanshu:119:p035"],"verdict":"approve"}]}],"reviewHead":"f58a079da2282484e5ebdc41a6d41e8eddf1ed94"}];
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {identityArtifactHash,recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          import {assembleChapterIdentityReviewParts,identityReviewTransportPolicy} from './scripts/lib/people-identity-review-transport.mjs';
          import {assertDossierPrimaryWitness,validateDossierIdentityEvidence,memberContract} from './scripts/lib/people-identity-dossiers.mjs';
          import {localNameKeys} from './scripts/lib/people-resolution.mjs';
          import {peopleDigest} from './scripts/lib/people-identity-seal.mjs';
          import {readIdentityDossierRegistry} from './scripts/lib/people-identity-dossier-delta.mjs';
          import {loadProperNounMatcher} from './scripts/lib/people-candidates.mjs';
          import {loadValidatedPeopleChapter} from './scripts/lib/people-validated-chapter.mjs';
          import {loadCurrentIdentityEvidence} from './scripts/lib/people-identity-evidence.mjs';
          const matcher=loadProperNounMatcher();
          async function diagnoseExactCases(j,data,aggregated,registry){
              const [book,chapter]=j.key.split('/');
              const index=await readIdentityDossierRegistry(registry,new Map());
              try{
                const own=loadValidatedPeopleChapter(book,chapter,{properNounMatcher:matcher});
                const covered=loadCurrentIdentityEvidence({plan:data.plan,report:aggregated,kind:'chapter-identity-review'},own,matcher);
                const people=new Map(), units=new Map(), memberVersions=new Map();
                for(const [key,source] of covered){
                  for(const person of source.localPeople.values()){
                    people.set(person.localId,person);
                    memberVersions.set(person.localId,peopleDigest(memberContract(person,localNameKeys(person))));
                  }
                  for(const unit of source.packet.units)units.set(key+':'+unit.id,unit.zh);
                }
                const byCase=new Map(data.plan.cases.map(x=>[x.id,x])), nameEvidence=new Map();
                const witnessIssues=[], caseIssues=[];
                for(const row of aggregated.reviews){
                  const item=byCase.get(row.caseId);
                  assert(item,'The sealed report contains an unknown case');
                  const anchor=item.canonicalMembership.anchorLocalId;
                  for(const witness of row.sourceWitnesses??[]){
                    try{
                      const person=people.get(witness.localId);
                      assert(person,'Source person not found');
                      assertDossierPrimaryWitness(witness,person,units,localNameKeys,nameEvidence,people,index.localPersonMap);
                    }catch(e){witnessIssues.push({caseId:item.id,anchor,witness,reason:e.message});}
                  }
                  const {fingerprint,...contract}=data.plan, single={...contract,cases:[item]};
                  const plan={...single,fingerprint:peopleDigest(single)};
                  const projected={...aggregated,planFingerprint:plan.fingerprint,reviews:[row]};
                  const view={localPeople:people,memberVersions,localPersonMap:index.localPersonMap,canonicalByKnownId:index.canonicalByKnownId,chapters:new Map([[book+':'+chapter,new Map([[item.canonicalPersonId,item.localPeople]])]])};
                  try{validateDossierIdentityEvidence(view,plan,projected,units,j.actor,[...data.authorAgentIds,j.owner],localNameKeys);}
                  catch(e){caseIssues.push({caseId:item.id,anchor,localPeople:item.localPeople,reason:e.message});}
                }
                return {cases:aggregated.reviews.length,witnessIssues,caseIssues,approvalGranted:false};
              }finally{index.close();}
          }
          const tmp=process.env.RUNNER_TEMP, registry=path.join(tmp,'registry',process.env.SOURCE);
          const output=path.join(process.cwd(),'data/people/generated/nov24-partitioned-validation');
          fs.mkdirSync(output,{recursive:true});
          const readRemote=(file,revision)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+file+'?ref='+revision],{maxBuffer:3e6,timeout:20000});
          const results=[];
          for(const j of expected.filter(y=>y.shard===Number(process.env.SHARD))){
            try{
              const id=j.key.replace('/','-'), dir=path.join(tmp,'packets',id);
              const packet=path.join(dir,'source-review-packet.json'), p=fs.readFileSync(packet), data=JSON.parse(p);
              const hash=b=>identityArtifactHash(b).replace(/^sha256:/u,'');
              assert.equal(hash(p),j.packetSha256.replace(/^sha256:/u,''));
              assert.equal(data.plan.fingerprint,j.planFingerprint);
              assert.equal(data.registryReuse.sourceRevision,process.env.SOURCE);
              assert(!data.authorAgentIds.includes(j.actor)&&j.owner!==j.actor);
              const parts=[],transports=[],reports=[];
              for(const [i,part] of j.parts.entries()){
                const transportFile=path.join(dir,part.file),b=fs.readFileSync(transportFile);
                const report=j.reports[i], reportFile=path.join(dir,'actual-report-'+(i+1)+'.json'), d=readRemote(report.path,report.evidenceHead??j.reviewHead);
                assert.equal(hash(b),part.sha256.replace(/^sha256:/u,''));
                assert.equal(hash(d),report.sha256);
                const rawReport=JSON.parse(d);
                assert.equal(rawReport.reviewer.agentId,j.actor);
                assert(rawReport.reviews.every(x=>x.verdict==='approve'));
                fs.writeFileSync(reportFile,d,{flag:'wx'});
                transports.push(JSON.parse(b));reports.push(rawReport);
                parts.push({schemaVersion:1,kind:'captured-independent-identity-review-part',phase:'report-recorded',agentId:j.actor,runId:report.runId??j.run,sourcePacketSha256:identityArtifactHash(p),transportSha256:identityArtifactHash(b),reportSha256:identityArtifactHash(d),transportFile,reportFile});
              }
              const aggregated=assembleChapterIdentityReviewParts(data.plan,transports,reports,parts.map(x=>x.agentId),data.authorAgentIds,data.reviewCaseIds);
              assert.equal(aggregated.reviews.length,j.cases);
              const report=path.join(dir,'actual-aggregate.json'), job=path.join(dir,'actual-job.json');
              const aggregateBytes=Buffer.from(JSON.stringify(aggregated)+'\n');
              fs.writeFileSync(report,aggregateBytes,{flag:'wx'});
              fs.writeFileSync(job,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review-parts',phase:'report-recorded',scope:data.scope,agentId:j.actor,runId:parts[0].runId,authorAgentIds:[j.owner],sourcePacketSha256:identityArtifactHash(p),reportSha256:identityArtifactHash(aggregateBytes),transportPolicy:identityReviewTransportPolicy(384*1024),parts})+'\n',{flag:'wx'});
              try{
               const receipt=await recordChapterIdentityReview({packet,report,job,registry,out:path.join(output,id+'.json')});
               results.push({key:j.key,receipt});
              }catch(validationError){
               try{
                const diagnostics=await diagnoseExactCases(j,data,aggregated,registry);
                results.push({key:j.key,error:validationError.message,diagnostics});
               }catch(diagnosticError){
                results.push({key:j.key,error:validationError.message,diagnosticError:diagnosticError.message});
               }
              }
            }catch(e){results.push({key:j.key,error:e.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results.map(x=>({key:x.key,native:x.receipt?.nativeIdentityProofAccepted,error:x.error}))));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-consolidated-corrected-witness-native-proof-${{ matrix.shard }}
          path: data/people/generated/nov24-partitioned-validation/
          if-no-files-found: error
          retention-days: 7
