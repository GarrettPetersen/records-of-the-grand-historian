name: Certify cross-corpus identity reports
run-name: retrospective-native-certify-current
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 32d461ef5297344e103a040cf9ee28fb05837535
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: retrospective-three-native-identity-evidence
          run-id: 45340849712
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify review bytes and apply the canonical recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const expected=[{"key":"liaoshi/106","agentId":"bc-92537d3b-6e49-4933-90f4-4fbc629d5090","runId":"run-48bbc1b6-38dd-41a6-83bd-a489706f1b57","owner":"bc-c4ccc606-4e91-4f57-8419-94b8fb4d3a0e","packetSha256":"5ff8fcae158682bbf7bc2be43e675c4d2e0996f8ca876b5a20371ac7cb55ca5e","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liaoshi-106/independent-identity-report.json","evidenceHead":"5b136325d724ea94a4905c3e30b5a4f8802d009e","reportSha256":"f0ebcb67d6a8fb5fb72b912bd099a1e307a099c579d7a5f45e7807d2835b73e2","cases":12},{"key":"shiji/064","agentId":"bc-a235c897-af47-4a42-9a1a-afbf8a402361","runId":"run-4fbe6d9c-d719-40a8-9c2c-64cbfbe6fdd3","owner":"bc-47648f6a-9ca6-438d-9cd5-6f14a61294c2","packetSha256":"fcc94b45c395dadada6bd5d5718e13dae7ce69236550f6e18ad7e27c2d10ff09","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/shiji-064/independent-identity-report.json","evidenceHead":"5ac284fffb0d2fedc59fa6100082bcf29cf62e0a","reportSha256":"ccf9f20a3ba2600b615c41fde522e3a72d9e3db63c08dd4a6aefec9135855f9b","cases":14}];
          const tmp=process.env.RUNNER_TEMP;
          const output=path.join(process.cwd(),'data/people/generated/cross-corpus-certification');
          const results=[];
          fs.mkdirSync(output,{recursive:true});
          const hash=(bytes)=>createHash('sha256').update(bytes).digest('hex');
          for(const job of expected){
            try{
              const [book,chapter]=job.key.split('/');
              const id=book+'-'+chapter;
              const packet=path.join(tmp,'packets',id,'source-review-packet.json');
              const packetBytes=fs.readFileSync(packet);
              const review=path.join(tmp,id+'-report.json');
              const captured=path.join(tmp,id+'-captured.json');
              assert.equal(hash(packetBytes),job.packetSha256);
              const report=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+job.reportPath+'?ref='+job.evidenceHead]);
              assert.equal(hash(report),job.reportSha256);
              const data=JSON.parse(report);
              assert.equal(data.reviews.length,job.cases);
              assert(data.reviews.every(x=>x.verdict==='approve'));
              assert.equal(data.reviewer.agentId,job.agentId);
              const previous=JSON.parse(packetBytes).authorAgentIds;
              assert(Array.isArray(previous)&&!previous.includes(job.agentId)&&job.owner!==job.agentId);
              fs.writeFileSync(review,report,{flag:'wx'});
              fs.writeFileSync(captured,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:{book,chapter},agentId:job.agentId,runId:job.runId,authorAgentIds:[...new Set([...previous,job.owner])],sourcePacketSha256:job.packetSha256,reportSha256:job.reportSha256})+'\n',{flag:'wx'});
              const receipt=await recordChapterIdentityReview({packet,report:review,job:captured,registry:path.join(tmp,'registry',"110c2f92a0e7994af8d9218f76c80ccd72b98d5c"),out:path.join(output,id+'.json')});
              results.push({key:job.key,receipt});
            }catch(error){results.push({key:job.key,error:error.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrospective-native-certify-current-evidence
          path: data/people/generated/cross-corpus-certification/
          if-no-files-found: error
          retention-days: 7
