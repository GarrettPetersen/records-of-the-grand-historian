name: Certify cross-corpus identity reports
run-name: Recheck exact independent reports with only native envelope fields
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: next-audited-glossary-evidence
          run-id: 45336188091
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify review bytes and apply the canonical recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const expected=[{"key":"qingshigao/120","agentId":"bc-7d924c3e-6338-4a3e-ba11-52388f267617","runId":"run-f45dce8a-9d7d-4fd1-800f-d600e9cb7200","owner":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","packetSha256":"aab0d34fca60d6a34a5c1e5372a8cca38ca1e349bb05a6e6f054c27613d0e98e","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/qingshigao-120/independent-identity-report.json","evidenceHead":"05b285156dc12ab926e205f884e12a8897d35430","reportSha256":"7ef5dbd964d18f9e963806d0e789a4d164659873db7e9fe6da1f702c32af27ef","cases":3,"transportSha256":"440f500bf76e9867a09e4be2ffb0816f7318802bcc67f84884fc63c222559560","authorHead":"baa383cc0b5d9533938f066b00365a446f6d9200"},{"key":"songshu/096","agentId":"bc-e596112f-a8c7-44d7-ae09-074032992c58","runId":"run-2e3d7443-0ace-4941-8563-84ea19426053","owner":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","packetSha256":"b3c150e3fb5bd73fbdf9f493ef897e6eb56578a426ff6a833f67db173654af9a","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/songshu-096/independent-identity-report.json","evidenceHead":"4d5d285f1fb2f2d24762bd63418ec52d5bba0642","reportSha256":"3db22fda564fddbd6b54d5590b592056af2e7bffa261202c98ec35314b3efe05","cases":40,"transportSha256":"dd956c096abaa2b9c2789f12fef2bf523ab3c7710f64fbf54720f8f9bf9f6c76","authorHead":"bc09397f909cf48381f617c04ddcef59dee0fb13"}];
          const tmp=process.env.RUNNER_TEMP;
          const output=path.join(process.cwd(),'data/people/generated/cross-corpus-certification');
          const results=[];
          fs.mkdirSync(output,{recursive:true});
          const hash=(bytes)=>createHash('sha256').update(bytes).digest('hex');
          for(const job of expected){
            try{
              const [book,chapter]=job.key.split('/');
              const id=book+'-'+chapter;
              const packet=path.join(tmp,'packets',id,'source-review-packet.json');
              const packetBytes=fs.readFileSync(packet);
              const review=path.join(tmp,id+'-report.json');
              const captured=path.join(tmp,id+'-captured.json');
              assert.equal(hash(packetBytes),job.packetSha256);
              const report=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+job.reportPath+'?ref='+job.evidenceHead]);
              assert.equal(hash(report),job.reportSha256);
              const data=JSON.parse(report);
              assert.equal(data.reviews.length,job.cases);
              assert(data.reviews.every(x=>x.verdict==='approve'));
              assert.equal(data.reviewer.agentId,job.agentId);
              const previous=JSON.parse(packetBytes).authorAgentIds;
              assert(Array.isArray(previous)&&!previous.includes(job.agentId)&&job.owner!==job.agentId);
              const expectedKeys=["schemaVersion","planFingerprint","reviewer","reviews"];
              const extras=Object.keys(data).filter(k=>!expectedKeys.includes(k)).sort();
              const validExtra=job.key==="qingshigao/120"?["authorCommit","counts","lookupProvenance","transportSha256"]:["lookupProvenance","sourceBaseCommit","transportSha256"];
              assert.deepEqual(extras,validExtra);
              assert.equal(data.transportSha256,job.transportSha256);
              assert.equal(data.authorCommit??data.sourceBaseCommit,job.authorHead);
              const native=Object.fromEntries(expectedKeys.map(k=>{assert(k in data);return [k,data[k]];}));
              const nativeBytes=Buffer.from(JSON.stringify(native,null,2)+"\n");
              const derivedSha=hash(nativeBytes);
              fs.writeFileSync(path.join(output,id+"-envelope-provenance.json"),JSON.stringify({originalReportSha256:job.reportSha256,projectedReportSha256:derivedSha,unchangedReviewRowsSha256:hash(JSON.stringify(data.reviews)),metadataFields:extras,originalEvidenceCommit:job.evidenceHead})+"\n");
              fs.writeFileSync(review,nativeBytes,{flag:"wx"});
              fs.writeFileSync(captured,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:{book,chapter},agentId:job.agentId,runId:job.runId,authorAgentIds:[...new Set([...previous,job.owner])],sourcePacketSha256:job.packetSha256,reportSha256:derivedSha})+'\n',{flag:'wx'});
              const receipt=await recordChapterIdentityReview({packet,report:review,job:captured,registry:path.join(tmp,'registry',process.env.SOURCE),out:path.join(output,id+'.json')});
              results.push({key:job.key,receipt});
            }catch(error){results.push({key:job.key,error:error.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-envelope-receipts
          path: data/people/generated/cross-corpus-certification/
          if-no-files-found: error
          retention-days: 7
