name: Certify cross-corpus identity reports
run-name: Certify exact third cohort identity reviews
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: next-audited-glossary-evidence
          run-id: 45336188091
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify review bytes and apply the canonical recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const expected=[{"key":"liaoshi/111","agentId":"bc-88cb2e3f-049b-4267-9b4d-c0f7af4810f2","runId":"run-5b7203f7-b10c-4f5e-a014-99219faa3fe3","owner":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","packetSha256":"dd7c9d4697c678b0d75fb0fe82c8f3a938f1348ab033e5ca814d734c32be24ed","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liaoshi-111/independent-identity-report.json","evidenceHead":"378b707b32106fd68c1050d92fecebdfbe460b2e","reportSha256":"4ba6a7aa5057578ce1e9fa52aba5157156e49170144daf82055526006ea1245a","cases":43},{"key":"liangshu/015","agentId":"bc-45e2f91f-23a4-4edd-8f80-6b89c70ec36a","runId":"run-24ae9497-ed7c-4d69-9180-1e5b4a8987f6","owner":"bc-0eb589e8-bd06-4e8c-bf58-1afc35d46126","packetSha256":"28fefe0db7ab92114f9eb9a43a7f8f4f870afae610d08f00b49a1b79a4db7a7e","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liangshu-015/independent-identity-report.json","evidenceHead":"4a2b63b24d256952aff853d3614bca41f0591e59","reportSha256":"881f79966f9b238acdbd1e2605b95939e8d2d538159980d9c5998835a637ab68","cases":46},{"key":"liaoshi/101","agentId":"bc-b3b8cc9e-6778-4c03-8d8d-f8ac067e8e9e","runId":"run-1989c7d1-9421-492c-9a61-e2e1d69ac509","owner":"bc-b1b4cecc-160a-4940-add4-09b11b527691","packetSha256":"065b23c7bd086ec05fda86acbc77a633b2a031d7407be01949460b12a22171b7","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liaoshi-101/independent-identity-report.json","evidenceHead":"fbd8c2fa2380bb79f30fed42a345f34e170189b2","reportSha256":"f9bdb663ceb4ae02e429c5857f3e2fd2a3a2d559ce3046fa1de080b3c4de4de2","cases":29},{"key":"weishu/019","agentId":"bc-dfa59da4-faa0-4b68-9f14-c89ae401b259","runId":"run-d6404646-f37d-45da-bc48-bfc7d629af66","owner":"bc-b1b4cecc-160a-4940-add4-09b11b527691","packetSha256":"77ea602d24283979567d3e82a3d180eef45da9164ec7e34620f5931b520ad00a","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/weishu-019/independent-identity-report.json","evidenceHead":"84911b42b04bf24eca3d32ee3b84119f99b82f7a","reportSha256":"827f619afdf35c9d6765f480920c8d1af1fe225620d2d8e8078ab5de76cb1ab8","cases":31},{"key":"liangshu/024","agentId":"bc-652bdcc9-7584-46c6-be58-b81aaddb6212","runId":"run-24010762-afa5-4e5e-a3d2-a9e6f517048d","owner":"bc-b1b4cecc-160a-4940-add4-09b11b527691","packetSha256":"fce6c04c5dfa2d2b25f253d63cae163c5d74a3e473dfd1e066a699bbe0e9f55d","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liangshu-024/independent-identity-report.json","evidenceHead":"53bfbf6f8583d26889d966ebc44a7e1f53f891d2","reportSha256":"5ffbcd62c6d31665b015a63ac71cd82676f9537faac12e11a0c06496a7217a63","cases":34},{"key":"jinshi/023","agentId":"bc-54db4a62-e3b4-4d46-a270-537565dea26b","runId":"run-a5344272-6ae7-4a54-9024-7711335ef407","owner":"bc-b1b4cecc-160a-4940-add4-09b11b527691","packetSha256":"45f86dc869f724cb861029c22f2155e172ae0c2f88c1847fde95e5220fee9bfa","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/jinshi-023/independent-identity-report.json","evidenceHead":"1eab0d132f79c474cd636219ca508bdb1e1bdea5","reportSha256":"70a3d9f7aca66832263fb6a180555c7411245fc219ae496df9750699eca325d4","cases":48}];
          const tmp=process.env.RUNNER_TEMP;
          const output=path.join(process.cwd(),'data/people/generated/cross-corpus-certification');
          const results=[];
          fs.mkdirSync(output,{recursive:true});
          const hash=(bytes)=>createHash('sha256').update(bytes).digest('hex');
          for(const job of expected){
            try{
              const [book,chapter]=job.key.split('/');
              const id=book+'-'+chapter;
              const packet=path.join(tmp,'packets',id,'source-review-packet.json');
              const packetBytes=fs.readFileSync(packet);
              const review=path.join(tmp,id+'-report.json');
              const captured=path.join(tmp,id+'-captured.json');
              assert.equal(hash(packetBytes),job.packetSha256);
              const report=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+job.reportPath+'?ref='+job.evidenceHead]);
              assert.equal(hash(report),job.reportSha256);
              const data=JSON.parse(report);
              assert.equal(data.reviews.length,job.cases);
              assert(data.reviews.every(x=>x.verdict==='approve'));
              assert.equal(data.reviewer.agentId,job.agentId);
              const previous=JSON.parse(packetBytes).authorAgentIds;
              assert(Array.isArray(previous)&&!previous.includes(job.agentId)&&job.owner!==job.agentId);
              fs.writeFileSync(review,report,{flag:'wx'});
              fs.writeFileSync(captured,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:{book,chapter},agentId:job.agentId,runId:job.runId,authorAgentIds:[...new Set([...previous,job.owner])],sourcePacketSha256:job.packetSha256,reportSha256:job.reportSha256})+'\n',{flag:'wx'});
              const receipt=await recordChapterIdentityReview({packet,report:review,job:captured,registry:path.join(tmp,'registry',process.env.SOURCE),out:path.join(output,id+'.json')});
              results.push({key:job.key,receipt});
            }catch(error){results.push({key:job.key,error:error.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-native-certify-third-evidence
          path: data/people/generated/cross-corpus-certification/
          if-no-files-found: error
          retention-days: 7
