name: Diagnose stale date proof reuse for 21 prioritized chapters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Compare current date packet coverage with retained reports
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {buildDateAuditPacket,dateAuditStatus} from './scripts/lib/people-date-audit.mjs';
          const keys=["beiqishu/006","hanshu/002","houhanshu/122","jiuwudaishi/003","jiuwudaishi/007","jiuwudaishi/008","jiuwudaishi/010","jiuwudaishi/011","jiuwudaishi/012","jiuwudaishi/040","jiuwudaishi/086","jiuwudaishi/092","jiuwudaishi/096","jiuwudaishi/115","jiuwudaishi/120","jiuwudaishi/121","jiuwudaishi/124","jiuwudaishi/127","jiuwudaishi/130","songshi/110","yuanshi/204"], rows=[];
          for(const key of keys){
           const [book,chapter]=key.split('/'), ref='data/people/date-audits/'+key+'.json';
           try{
            const old=JSON.parse(fs.readFileSync(ref,'utf8')), now=buildDateAuditPacket(book,chapter);
            const previousItemIds=new Set(old.itemChecks.map(x=>x.id)), currentItemIds=new Set(now.items.map(x=>x.id));
            const previousPersonIds=new Set(old.personChecks.map(x=>x.id)), currentPersonIds=new Set(now.people.map(x=>x.id));
            const unshared=(one,two)=>[...one].filter(x=>!two.has(x)).sort();
            const inputs=['data/'+key+'.json','data/people/extractions/'+key+'.json',ref,'data/people/editorial-decisions/'+key+'.json'].map(p=>({path:p,blob:execFileSync('git',['rev-parse','HEAD:'+p],{encoding:'utf8'}).trim()}));
            rows.push({key,inputs,status:dateAuditStatus(book,chapter).status,originalStatus:old.status,originalReviewedAt:old.reviewedAt,oldFindings:old.findings.length,sourceChanged:old.sourceHash!==now.sourceHash,extractionChanged:old.extractionHash!==now.extractionHash,addedItems:unshared(currentItemIds,previousItemIds),droppedItems:unshared(previousItemIds,currentItemIds),addedPeople:unshared(currentPersonIds,previousPersonIds),droppedPeople:unshared(previousPersonIds,currentPersonIds),currentUnits:now.units.length,currentItems:now.items.length,currentPeople:now.people.length});
           }catch(e){rows.push({key,error:e.message});}
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/stale-date-recovery.json',JSON.stringify({source:process.env.SOURCE,rows},null,2)+'\n');
          console.log(JSON.stringify(rows.map(x=>({key:x.key,status:x.status,sourceChanged:x.sourceChanged,extractionChanged:x.extractionChanged,added:x.addedItems?.length,dropped:x.droppedItems?.length,error:x.error}))));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: nov24-21-stale-date-proof-deltas
          path: ${{ runner.temp }}/stale-date-recovery.json
          if-no-files-found: error
          retention-days: 7
