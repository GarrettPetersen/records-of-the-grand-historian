name: Prepare audited Jinshu identity evidence
run-name: Prepare Jinshu 020 independently audited identity evidence with verified historical authors
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 486d52193b8d3cf68b99ad1c794c759b22c02ff8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - run: node scripts/validate-people-extraction.mjs --self-test
      - name: Prepare one source-pinned registry and the sealed dossier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          root="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          export REGISTRY="$root/$SOURCE"
          mkdir -p "$root" "$RUNNER_TEMP/registry-export"
          for chapter in 020; do
            npm run people:dates:verify -- --book jinshu --chapter "$chapter" --out "$RUNNER_TEMP/date-$chapter.json"
            jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$RUNNER_TEMP/date-$chapter.json"
          done
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          import path from 'node:path';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          for (const chapter of ['020']) {
            const result=await prepareChapterIdentityReview({book:'jinshu',chapter,sourceRevision:process.env.SOURCE,registry:process.env.REGISTRY,out:path.join(process.env.RUNNER_TEMP,'identity-'+chapter),transportMaxBytes:384*1024});
            console.log(JSON.stringify(result));
          }
          JS
          cp "$REGISTRY/manifest.json" "$RUNNER_TEMP/registry-export/manifest.json"
          tar -czf "$RUNNER_TEMP/registry-export/registry.tar.gz" -C "$root" "$SOURCE"
          (cd "$RUNNER_TEMP/registry-export" && sha256sum registry.tar.gz manifest.json > SHA256SUMS)
          test "$(stat -c %s "$RUNNER_TEMP/registry-export/registry.tar.gz")" -le 167772160
      - uses: actions/upload-artifact@v4
        with:
          name: people-registry-${{ env.SOURCE }}
          path: ${{ runner.temp }}/registry-export/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-020-native-identity-evidence
          path: ${{ runner.temp }}/identity-020/
          if-no-files-found: error
          retention-days: 7
