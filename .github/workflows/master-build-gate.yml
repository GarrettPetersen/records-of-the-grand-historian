name: Certify partitioned glossary owner reviews
run-name: Certify exact independently reviewed partitioned glossary chapters
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        shard: [2, 1, 0, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
      SHARD: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
          run-id: 45362321360
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: nov24-current-master-next-owner-shard-${{ matrix.shard }}
          run-id: 45362321360
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify captures and run the native identity recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          const expected=[{"key":"houhanshu/117","shard":2,"actor":"bc-7df35274-9833-4a6b-a102-a2d9299e5cef","run":"run-1c3146d5-333d-42be-af85-683778a1054d","owner":"bc-ba535de0-6357-4346-9b55-6a7365618ee9","packetSha256":"3b86600015286e2b878cd2f9e6c2e975cb3b2db3e4c8776bcce201da518b5b16","planFingerprint":"sha256:ed38472d3f4874fdf7edc025a5e08c0a8b08bc694d581fdff257c41f01879ffe","cases":56,"parts":[{"file":"transport-part-001.json","sha256":"f4c25559151f968d9637ff4c553fd8eb084d1227168f66ff7b0a6f41f6182733"},{"file":"transport-part-002.json","sha256":"e9c99fc8beba4ed219103c6875e468986da9579c5059ba314af8edfdd990f3a8"},{"file":"transport-part-003.json","sha256":"769fc046b4ea26a873276c212cc099e074f1307f0b2652136ccb557f3711d636"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-current-master-transport/houhanshu-117/independent-identity-report-part-001.json","blob":"2faafc6a50a144b7f680b0297de8c130e3f04c36","sha256":"d4382fe3fa8d27dbecd48a8fa62856a8460e0c6981b7a8580f31c7c8a618f427","cases":14,"approvals":14,"holds":[],"runId":"run-9333a24b-a2e8-4c3c-b7f0-18475db2cd0a","evidenceHead":"4993c8a7299724280d7c58d896c29b74255f5bbe","changedWitnesses":0},{"path":"research/people/checkpoints/campaign-nov24-current-master-transport/houhanshu-117/independent-identity-report-part-002.json","blob":"3549ab90268ae77bc82226500813ab1f1980643c","sha256":"adcbcab2986cfb14e72b3166aa2060ccb1a9cfb372ef2624edcd8d02a6d2189c","cases":14,"approvals":14,"holds":[],"runId":"run-9333a24b-a2e8-4c3c-b7f0-18475db2cd0a","evidenceHead":"4993c8a7299724280d7c58d896c29b74255f5bbe","changedWitnesses":0},{"path":"research/people/checkpoints/campaign-nov24-current-master-transport/houhanshu-117/independent-identity-report-part-003.json","blob":"b3fda7a76e45f5e75fb633035e0e0d511ae7936c","sha256":"0dc15d772f66c399c53e8d438680ce51b2bc17f4f8d40c8071339865e0efb892","cases":28,"holds":[],"runId":"run-1c3146d5-333d-42be-af85-683778a1054d","evidenceHead":"b672231b0ba3f956d24dde4cbaac0a585e337b2e","chang