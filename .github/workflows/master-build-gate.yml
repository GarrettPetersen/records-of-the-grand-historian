name: Prepare reviewed extraction accounting identity evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 963b2f0387269ee258b166fcfde065ce32111a97
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Build once and prepare only approved chapter scopes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$RUNNER_TEMP/recovered-chronology-identity"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          mkdir -p "$OUT" "$(dirname "$REGISTRY")"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          const expected=[{"scope":"jiuwudaishi/027","path":"data/people/date-audits/jiuwudaishi/027.json","blob":"d10e7327d9073d6459717abe7fbd5b5455cef464","retainedPath":"data/people/date-audit-history/jiuwudaishi/027/edf9482ce68ce86e3ae106c32aa6e1581cbed121b59624b1df5e5382aaabfa36.json","retainedBlob":"07d10ae091accc009db0eb37d24d16d43f10d24b"},{"scope":"jiuwudaishi/055","path":"data/people/date-audits/jiuwudaishi/055.json","blob":"63de6b9f8150158dcf716af268dcf1139ab1887a","retainedPath":"data/people/date-audit-history/jiuwudaishi/055/aa0ae684e8fb6840139a081f9d5cf52cfaa15bd91b179bbb36fa8a8f2d1314dd.json","retainedBlob":"46316f050db1d69db834cccf1cf2eed767e8de70"}];
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const results=[];
          for(const x of expected){
           const [book,chapter]=x.scope.split('/');
           try{
            assert.equal(execFileSync('git',['rev-parse',process.env.SOURCE+':'+x.path],{encoding:'utf8'}).trim(),x.blob);
            if(x.retainedPath)assert.equal(execFileSync('git',['rev-parse',process.env.SOURCE+':'+x.retainedPath],{encoding:'utf8'}).trim(),x.retainedBlob); const result=await prepareChapterIdentityReview({book,chapter,sourceRevision:process.env.SOURCE,registry:process.env.REGISTRY,out:path.join(process.env.OUT,x.scope.replace('/','-')),transportMaxBytes:384*1024,...(x.retainedPath?{retainedComposition:path.resolve(x.retainedPath)}:{})});
            results.push({key:x.scope,status:result.status,receipt:result});
           }catch(e){results.push({key:x.scope,status:'held',reason:e.message});}
          }
          fs.writeFileSync(path.join(process.env.OUT,'summary.json'),JSON.stringify({source:process.env.SOURCE,results},null,2)+'\n');
          console.log(JSON.stringify(results.map(x=>({key:x.key,status:x.status,reason:x.reason,newReviewCases:x.receipt?.newReviewCases}))));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-accounting-identity-packets
          path: ${{ runner.temp }}/recovered-chronology-identity/
          if-no-files-found: error
          retention-days: 7
