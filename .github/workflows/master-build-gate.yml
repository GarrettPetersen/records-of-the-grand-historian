name: Retain Mingshi 034 chronology after an English correction
run-name: Validate exact Mingshi 034 English-only chronology composition
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SOURCE: 8ecdc7f8389731e42fde7fb19d97855a38454cac
      BEFORE: 0a685b5841232600601da819de1de3bb1d97fe64
      REVIEW: 073f60e30f8e87c2c28d7b1234164bfeebb6af11
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Verify independent delta and retain identical dated item proofs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^)" = "$BEFORE"
          out="$RUNNER_TEMP/mingshi034-date-composition"
          export OUT="$out"
          mkdir -p "$out/history"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {buildDateAuditPacket,validateDateAuditReport,recordDateAudit,dateAuditReferencesCurrent} from './scripts/lib/people-date-audit.mjs';
          const {SOURCE,BEFORE,REVIEW,OUT,GITHUB_REPOSITORY}=process.env;
          const scope=['mingshi','034'];
          const data='data/mingshi/034.json', extraction='data/people/extractions/mingshi/034.json', audit='data/people/date-audits/mingshi/034.json';
          const witness='research/people/checkpoints/cross-corpus-native-review-20261124/mingshi-034/independent-dependency-recheck.json';
          const earlier=p=>execFileSync('git',['show',OWNER_PREIMAGE+':'+p],{maxBuffer:10e6});
          const OWNER_PREIMAGE=BEFORE;
          const approved=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+witness+'?ref='+REVIEW]);
          const decision=JSON.parse(approved);
          assert.equal(decision.ownerRevisionReviewed,SOURCE);
          assert.equal(decision.verdict,'accept');
          assert.equal(decision.identityCases.cases.length,2);
          assert(decision.identityCases.cases.every(entry=>entry.verdict==='approve-unchanged'));
          const priorSource=path.join(process.env.RUNNER_TEMP,'mingshi034-before-source');
          fs.mkdirSync(path.join(priorSource,'mingshi'),{recursive:true});
          fs.writeFileSync(path.join(priorSource,'mingshi','034.json'),earlier(data));
          const before=buildDateAuditPacket(...scope,{dataDir:priorSource,extraction:JSON.parse(earlier(extraction))});
          const after=buildDateAuditPacket(...scope);
          assert.notEqual(before.sourceHash,after.sourceHash);
          assert.notEqual(before.extractionHash,after.extractionHash);
          assert.deepEqual(after.people,before.people);
          assert.deepEqual(after.items,before.items);
          assert.deepEqual(after.unitPeople,before.unitPeople);
          assert.equal(after.units.length,before.units.length);
          const differences=before.units.filter((unit,i)=>unit.en!==after.units[i].en).map(unit=>unit.id);
          assert.deepEqual(differences,['s0011']);
          const withoutEnglish=({en,...unit})=>unit;
          assert.deepEqual(after.units.map(withoutEnglish),before.units.map(withoutEnglish));
          const originalBytes=fs.readFileSync(audit);
          assert(originalBytes.equals(earlier(audit)));
          const original=JSON.parse(originalBytes);
          validateDateAuditReport(original,before);
          assert.equal(original.status,'audited');
          assert(dateAuditReferencesCurrent(original));
          const next={...original,sourceHash:after.sourceHash,extractionHash:after.extractionHash,summary:original.summary+' Exact unchanged chronology proofs retained after independent recheck of the idiomatic English correction at s0011.'};
          validateDateAuditReport(next,after);
          const status=recordDateAudit(next);
          assert.equal(status.status,'audited');
          assert.equal(status.findings,0);
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const historyName=hash(JSON.stringify(original))+'.json';
          const history=path.join('data/people/date-audit-history/mingshi/034',historyName);
          assert.deepEqual(JSON.parse(fs.readFileSync(history)),original);
          fs.copyFileSync(history,path.join(OUT,'history',historyName));
          fs.copyFileSync(audit,path.join(OUT,'recorded-date-audit.json'));
          fs.writeFileSync(path.join(OUT,'date-status.json'),JSON.stringify({chapters:[{book:'mingshi',chapter:'034',...status}]})+'\n');
          fs.writeFileSync(path.join(OUT,'composition-receipt.json'),JSON.stringify({source:SOURCE,before:BEFORE,review:REVIEW,reviewSha256:hash(approved),originalReportSha256:hash(originalBytes),beforeExtraction:before.extractionHash,afterExtraction:after.extractionHash,beforeSource:before.sourceHash,afterSource:after.sourceHash,unchangedChronologyProofs:next.itemChecks.length,changedEnglishUnits:differences},null,2)+'\n');
          JS
          npm run people:validate -- --book mingshi --chapter 034 | tee "$out/scoped-validation.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mingshi-034-composed-native-date-recording
          path: ${{ runner.temp }}/mingshi034-date-composition/
          if-no-files-found: error
          retention-days: 7
