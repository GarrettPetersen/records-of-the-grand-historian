name: Record independently reconciled glossary cases
run-name: Record only affected identity evidence for Songshu 004 and Jinshu 028
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  record:
    name: Record ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: songshu-004
            source: 73783b61f96477486c5c188849cd888d620d7820
            evidence: songshu-004-only-changed-identity-witnesses
            run: 45351404458
          - key: jinshu-028
            source: f76083ba3743da9866c9c103468be6e076e3ab79
            evidence: jinshu-028-reconciled-identity-evidence
            run: 45351400102
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ matrix.source }}
      TARGET: ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.evidence }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reconciled-evidence
      - uses: actions/download-artifact@v4
        if: matrix.key == 'jinshu-028'
        with:
          name: people-registry-${{ matrix.source }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/accepted-registry
      - name: Verify original transport and capture independent report bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          if [ "$TARGET" = "jinshu-028" ]; then
            (
              cd "$RUNNER_TEMP/accepted-registry"
              sha256sum -c SHA256SUMS
              tar -xzf registry.tar.gz
            )
            export REGISTRY="$RUNNER_TEMP/accepted-registry/$SOURCE"
          else
            root="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
            mkdir -p "$root"
            export REGISTRY="$root/$SOURCE"
            node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          fi
          export OUT="$GITHUB_WORKSPACE/data/people/generated/reconciled-recording"
          mkdir -p "$OUT"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
