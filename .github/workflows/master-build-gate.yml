name: Campaign source-only chronology regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aad5dc09c7cdddbb1e3e6b7931f139a25a8a2248
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - run: node --test scripts/test-people-source-only-chronology.mjs
