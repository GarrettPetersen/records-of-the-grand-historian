name: Verify composed chapter proofs on current staging
run-name: Reconcile the original Jinshu 028 proof against the current staging registry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 0e6650af12d72a4cc45576b906dc3c4c3ce4493f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Prepare only changed identity cases using the current composed evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          root="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          mkdir -p "$root" "$RUNNER_TEMP/composed-staging"
          export REGISTRY="$root/$SOURCE"
          export OUT="$RUNNER_TEMP/composed-staging"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --test scripts/test-people-source-only-chronology.mjs
          for key in jinshu/028; do
            book="${key%/*}"; chapter="${key#*/}"
            npm run people:validate -- --book "$book" --chapter "$chapter" | tee "$OUT/$book-$chapter-extraction.txt"
            npm run people:dates:verify -- --book "$book" --chapter "$chapter" --out "$OUT/$book-$chapter-chronology.json"
            jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$OUT/$book-$chapter-chronology.json"
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const {SOURCE,REGISTRY,OUT}=process.env;
          const result=await prepareChapterIdentityReview({book:'jinshu',chapter:'028',registry:REGISTRY,sourceRevision:SOURCE,retainedComposition:path.resolve('data/people/identity-reviews/jinshu/028.json'),out:path.join(OUT,'native-reconciliation'),transportMaxBytes:384*1024});
          console.log(JSON.stringify({state:result.status,reviewedCases:result.reviewedCases??null,reusedCases:result.reusedCases??null,newReviewCases:result.newReviewCases??null,retainedHoldCases:result.retainedHoldCases??null}));
          JS
          mkdir -p "$RUNNER_TEMP/jinshu028-reconciliation-registry"
          tar -czf "$RUNNER_TEMP/jinshu028-reconciliation-registry/registry.tar.gz" -C "$root" "$SOURCE"
          (cd "$RUNNER_TEMP/jinshu028-reconciliation-registry" && sha256sum registry.tar.gz > SHA256SUMS)
          test "$(stat -c %s "$RUNNER_TEMP/jinshu028-reconciliation-registry/registry.tar.gz")" -le 167772160
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jinshu028-native-composition-reconciliation
          path: ${{ runner.temp }}/composed-staging/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jinshu028-reconciliation-registry
          path: ${{ runner.temp }}/jinshu028-reconciliation-registry/
          if-no-files-found: error
          retention-days: 7
