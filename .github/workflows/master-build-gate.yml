name: Campaign scoped validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - chapter: '031'
            revision: f1286300cc48e6b3abf678ba34681c3ee48599be
          - chapter: '067'
            revision: 73a655fb8523f92a12f58a5d1cd7cb0e815b3012
          - chapter: '116'
            revision: b50547fea51c8fef5ca4b1ad9264dfbc28780bb8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run people:validate -- --book jinshu --chapter ${{ matrix.chapter }}
