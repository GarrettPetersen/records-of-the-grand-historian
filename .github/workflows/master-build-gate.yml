name: Verify scoped people curation before a production build
run-name: Locate the two exact deferred identity blockers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SOURCE: d393da3f6981fbbc58a713b127a8462ef76314fe
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - run: node scripts/test-people-source-only-chronology.mjs
      - name: Reconstruct qualified scopes and inspect exact display guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          export OUT="$RUNNER_TEMP/scoped-curation-preflight"
          mkdir -p "$OUT" data/people/generated/identity-dossiers
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE" > "$OUT/registry-receipt.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {readIdentityDossierRegistry} from './scripts/lib/people-identity-dossier-delta.mjs';
          import {loadProperNounMatcher} from './scripts/lib/people-candidates.mjs';
          import {loadValidatedPeopleChapter} from './scripts/lib/people-validated-chapter.mjs';
          import {loadCurrentIdentityEvidence} from './scripts/lib/people-identity-evidence.mjs';
          import {localNameKeys} from './scripts/lib/people-resolution.mjs';
          import {memberContract} from './scripts/lib/people-identity-dossiers.mjs';
          import {peopleDigest} from './scripts/lib/people-identity-seal.mjs';
          import {reconcileIdentityProofComposition} from './scripts/lib/people-identity-proof-composition.mjs';
          const reg=await readIdentityDossierRegistry(process.env.REGISTRY,new Map());
          const view={localPersonMap:reg.localPersonMap,canonicalByKnownId:reg.canonicalByKnownId};
          const matcher=loadProperNounMatcher(), reports=[];
          try{for(const key of ['jinshu/031','songshu/004']){
            const [book,chapter]=key.split('/');
            const bundle=JSON.parse(fs.readFileSync('data/people/identity-reviews/'+key+'.json','utf8'));
            const own=loadValidatedPeopleChapter(book,chapter,{properNounMatcher:matcher});
            const sources=loadCurrentIdentityEvidence(bundle,own,matcher);
            const changedAnchors=[];
            for(const plan of [bundle.plan,...(bundle.sourcePlans??[])])for(const item of plan.cases){
              const a=item.canonicalMembership, id=a.anchorLocalId;
              const p=sources.get(id.split(':').slice(0,2).join(':'))?.localPeople.get(id);
              const current=p?peopleDigest(memberContract(p,localNameKeys(p))):null;
              if(current!==a.anchorVersion)changedAnchors.push({plan:plan.fingerprint,caseId:item.id,id,old:a.anchorVersion,current,localPeople:item.localPeople});
            }
            const result={key,changedAnchors};
            try{const r=reconcileIdentityProofComposition(view,sources,bundle.plan,bundle.sourcePlans,bundle.components);
              Object.assign(result,{invalidated:r.invalidated,remaining:r.remainingCaseIds,held:r.held});
            }catch(e){result.error=e.message;}
            reports.push(result);
          }}finally{reg.close();}
          fs.writeFileSync(process.env.OUT+'/exact-deferred-dependencies.json',JSON.stringify({source:process.env.SOURCE,reports},null,2)+'\n');
          console.log(JSON.stringify(reports.map(r=>({key:r.key,changedAnchors:r.changedAnchors.length,remaining:r.remaining?.length,error:r.error}))));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-exact-deferred-dependencies
          path: ${{ runner.temp }}/scoped-curation-preflight/
          if-no-files-found: error
          retention-days: 7
