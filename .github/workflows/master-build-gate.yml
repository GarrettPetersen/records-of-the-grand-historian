name: Native Jinshu identity packet and retained proof
on:
  workflow_dispatch:
    inputs:
      chapter:
        required: true
        type: choice
        options: ['031', '083', '094', '115', '031-record', '031-stage', '083-witness-check']
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: inputs.chapter != '031-record' && inputs.chapter != '031-stage' && inputs.chapter != '083-witness-check'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHAPTER: ${{ inputs.chapter }}
    steps:
      - id: pin
        run: |
          case "$CHAPTER" in
            031) revision=f65754d727561484a4a9a75453cdcd67ecec5c4d; registry_run=45284855296 ;;
            083|094) revision=1fb7ef675b0c2089fefaec9a8185c33f8d072bb3; registry_run=45287545951 ;;
            115) revision=1fb25e99e2fc07ba0ee8fbd89369d44c482c4326; registry_revision=131ae6dd0d756654bbd5d839226e08b7c5cc3c39; registry_run=45286659491 ;;
            *) exit 1 ;;
          esac
          printf 'revision=%s\nregistry_run=%s\nregistry_revision=%s\n' "$revision" "$registry_run" "${registry_revision:-$revision}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.revision }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-${{ steps.pin.outputs.registry_revision }}
          run-id: ${{ steps.pin.outputs.registry_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry-archive
      - uses: actions/download-artifact@v4
        if: inputs.chapter == '031'
        with:
          name: jinshu031-native-identity-packet
          run-id: 45264629519
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-identity
      - name: Verify original reports and derive native retained components
        if: inputs.chapter == '031'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import {captureIdentityProofComponent} from './scripts/lib/people-identity-proof-composition.mjs';
          import {identityArtifactHash as hash} from './scripts/lib/people-identity-artifacts.mjs';
          const tmp=process.env.RUNNER_TEMP;
          const oldPacket=fs.readFileSync(path.join(tmp,'original-identity/source-review-packet.json'));
          const receipt=JSON.parse(fs.readFileSync(path.join(tmp,'original-identity/preparation-receipt.json')));
          const packet=JSON.parse(oldPacket), scope={book:'jinshu',chapter:'031'};
          assert.deepEqual(packet.scope,scope);
          assert.equal(hash(oldPacket),'fdb98159c15fc9cd2874b10d74977fbd1d9d1e146239059fff0364280acf4ab3');
          const evidence='6a570bcfef20299d6d2c27617280ec3c533391fb';
          const original='4588bb7810f9f33ad5719d180aeb99ba15bedce1';
          const actor='bc-c338e2c8-9d0c-4d07-a751-be3d40824e00', originalRun='run-1da4161b-9b5d-49a7-a8b6-c7827519b61a';
          const base='research/people/jinshu031-independent-canonical-identity-parts-20261123/';
          const read=(file,revision)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+file+'?ref='+revision],{maxBuffer:10*1024*1024});
          const reportBytes=read('research/people/jinshu031-independent-canonical-identity-report-20261123.json',original);
          const report=JSON.parse(reportBytes),manifest=JSON.parse(read(base+'manifest.json',evidence));
          assert.equal(manifest.originalAggregateReport.commit,original);
          assert.equal(manifest.originalAggregateReport.sha256,'sha256:'+hash(reportBytes));
          assert.equal(report.reviewer.agentId,actor);
          assert.equal(manifest.partitionAuthor.agentId,actor);
          assert.equal(report.planFingerprint,packet.plan.fingerprint);
          assert(!packet.authorAgentIds.includes(actor));
          assert.equal(manifest.parts.length,32);
          assert.equal(receipt.reviewParts.length,32);
          const aggregate={schemaVersion:1,kind:'captured-independent-identity-review-parts',phase:'report-recorded',scope,authorAgentIds:packet.authorAgentIds,sourcePacketSha256:hash(oldPacket),transportPolicy:receipt.transportPolicy,parts:[]};
          const captured=[], reconstructed=[];
          for(const [i,entry] of manifest.parts.entries()){
            assert.match(entry.file,/^part-\d{3}\.result\.json$/u);
            assert.equal(entry.originalTransportFile,receipt.reviewParts[i].file);
            const bytes=read(base+entry.file,evidence),piece=JSON.parse(bytes);
            assert.equal('sha256:'+hash(bytes),entry.sha256);
            const transport=fs.readFileSync(path.join(tmp,'original-identity',receipt.reviewParts[i].file));
            assert.equal(hash(transport),receipt.reviewParts[i].sha256);
            assert.equal('sha256:'+hash(transport),entry.originalTransportSha256);
            assert.deepEqual(piece.reviews.map(row=>row.caseId),entry.caseIds);
            reconstructed.push(...piece.reviews);
            // The reviewer supplied a lossless partition. Only the outer native wrapper is encoded here.
            const native=Buffer.from(JSON.stringify({schemaVersion:1,planFingerprint:report.planFingerprint,reviewer:report.reviewer,reviews:piece.reviews})+'\n');
            const job={schemaVersion:1,kind:'captured-independent-identity-review-part',phase:'report-recorded',scope,sourcePacketSha256:hash(oldPacket),agentId:actor,runId:originalRun,reportSha256:hash(native),transportSha256:hash(transport)};
            aggregate.parts.push(job);captured.push({native,transport,job});
          }
          assert.deepEqual(reconstructed,report.reviews);
          const components=captured.map(({native,transport,job})=>captureIdentityProofComponent(oldPacket,native,transport,job,receipt.transportPolicy,aggregate).component);
          fs.writeFileSync(path.join(tmp,'retained-031.json'),JSON.stringify({schemaVersion:1,kind:'chapter-identity-review-composition',scope,plan:packet.plan,sourcePlans:[],components,selections:[]})+'\n');
          console.log(JSON.stringify({original,partitionCommit:evidence,originalProviderRun:originalRun,rows:reconstructed.length,components:components.length}));
          JS
      - name: Validate exact registry and prepare native identity evidence
        env:
          SOURCE_REVISION: ${{ steps.pin.outputs.revision }}
          REGISTRY_REVISION: ${{ steps.pin.outputs.registry_revision }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          if [[ "$REGISTRY_REVISION" != "$SOURCE_REVISION" ]]; then
            git fetch --depth=1 --no-tags origin "$REGISTRY_REVISION"
          fi
          cd "$RUNNER_TEMP/registry-archive"
          sha256sum -c SHA256SUMS
          mkdir "$RUNNER_TEMP/identity-registry"
          tar -xzf registry.tar.gz -C "$RUNNER_TEMP/identity-registry"
          registry="$RUNNER_TEMP/identity-registry/$REGISTRY_REVISION"
          cmp manifest.json "$registry/manifest.json"
          cd "$GITHUB_WORKSPACE"
          extra=()
          if [[ "$CHAPTER" == 031 ]]; then
            extra+=(--retained-composition "$RUNNER_TEMP/retained-031.json")
          fi
          if [[ "$CHAPTER" == 094 ]]; then
            SOURCE_REVISION="$SOURCE_REVISION" IDENTITY_REGISTRY="$registry" node --input-type=module <<'JS'
          import path from 'node:path';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const receipt=await prepareChapterIdentityReview({book:'jinshu',chapter:'094',sourceRevision:process.env.SOURCE_REVISION,registry:process.env.IDENTITY_REGISTRY,out:path.join(process.env.RUNNER_TEMP,'native-identity'),transportMaxBytes:384*1024});
          console.log(JSON.stringify(receipt,null,2));
          JS
          else
          node scripts/prepare-people-chapter-identity.mjs --book jinshu --chapter "$CHAPTER" --source-revision "$SOURCE_REVISION" --registry "$registry" --out "$RUNNER_TEMP/native-identity" "${extra[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-${{ inputs.chapter }}-native-identity-evidence
          path: ${{ runner.temp }}/native-identity/
          if-no-files-found: error
          retention-days: 7
  record-031:
    if: inputs.chapter == '031-record'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f65754d727561484a4a9a75453cdcd67ecec5c4d
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-f65754d727561484a4a9a75453cdcd67ecec5c4d
          run-id: 45284855296
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry-archive
      - uses: actions/download-artifact@v4
        with:
          name: jinshu-031-native-identity-evidence
          run-id: 45286126920
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-identity
      - name: Verify actual report capture and run the canonical recorder
        shell: bash
        run: |
          set -euo pipefail
          revision=f65754d727561484a4a9a75453cdcd67ecec5c4d
          test "$(git rev-parse HEAD)" = "$revision"
          mkdir "$RUNNER_TEMP/identity-registry" "$RUNNER_TEMP/recorded"
          (
            cd "$RUNNER_TEMP/registry-archive"
            sha256sum -c SHA256SUMS
            tar -xzf registry.tar.gz -C "$RUNNER_TEMP/identity-registry"
            cmp manifest.json "$RUNNER_TEMP/identity-registry/$revision/manifest.json"
          )
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {identityArtifactHash as sha} from './scripts/lib/people-identity-artifacts.mjs';
          import {assembleChapterIdentityReviewParts} from './scripts/lib/people-identity-review-transport.mjs';
          const base=path.join(process.env.RUNNER_TEMP,'native-identity');
          const packetBytes=fs.readFileSync(path.join(base,'source-review-packet.json'));
          const packet=JSON.parse(packetBytes);
          const receipt=JSON.parse(fs.readFileSync(path.join(base,'preparation-receipt.json')));
          const commit='43891318ba7bce476cac75524bc059cb9a94d6ab';
          const agentId='bc-c338e2c8-9d0c-4d07-a751-be3d40824e00';
          const runId='run-5ea57248-9aae-4296-92b9-f6454beb90d0';
          const get=file=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/research/people/jinshu031-native-identity-remaining-review-20261123/'+file+'?ref='+commit],{maxBuffer:1000000});
          const manifest=JSON.parse(get('manifest.json'));
          const scope={book:'jinshu',chapter:'031'};
          assert.deepEqual(packet.scope,scope);
          assert.deepEqual(manifest.scope,scope);
          assert.equal(manifest.reviewer.agentId,agentId);
          assert.equal(manifest.actionsEvidence.artifactId,14871024327);
          assert.equal(manifest.actionsEvidence.runId,45286126920);
          assert.equal(manifest.actionsEvidence.artifactDigest,'sha256:54ab3b6e712a6726579dd603238d262604d4d6225fcd6410d98915d3eac1a4ee');
          assert.equal(receipt.sourceRevision,'f65754d727561484a4a9a75453cdcd67ecec5c4d');
          assert.equal(manifest.sealedPacket.sourceRevision,receipt.sourceRevision);
          assert.equal(manifest.sealedPacket.sourcePacketSha256,'sha256:'+sha(packetBytes));
          assert.equal(manifest.sealedPacket.planFingerprint,packet.plan.fingerprint);
          assert.equal(manifest.sealedPacket.retainedCompositionFingerprint,receipt.retainedCompositionFingerprint);
          assert.equal(sha(packetBytes),receipt.sourcePacketSha256);
          assert.equal(receipt.reusedCases,208);
          assert.equal(receipt.newReviewCases,49);
          assert.equal(manifest.parts.length,receipt.reviewParts.length);
          const reports=[], transports=[];
          const parts=receipt.reviewParts.map((sealed,index)=>{
            const entry=manifest.parts[index], file='part-'+String(index+1).padStart(3,'0')+'.report.json';
            assert.equal(entry.file,file);
            assert.equal(entry.sealedTransportFile,sealed.file);
            assert.equal(entry.sealedTransportSha256,'sha256:'+sealed.sha256);
            assert.deepEqual(entry.caseIds,sealed.caseIds);
            const transportFile=path.join(base,sealed.file);
            const transportBytes=fs.readFileSync(transportFile), reportBytes=get(file);
            assert.equal(sha(transportBytes),sealed.sha256);
            assert.equal('sha256:'+sha(reportBytes),entry.sha256);
            const report=JSON.parse(reportBytes);
            assert.equal(report.reviewer.agentId,agentId);
            reports.push(report); transports.push(JSON.parse(transportBytes));
            const reportFile=path.join(base,file);
            fs.writeFileSync(reportFile,reportBytes,{flag:'wx'});
            return {schemaVersion:1,kind:'captured-independent-identity-review-part',phase:'report-recorded',scope,agentId,runId,sourcePacketSha256:sha(packetBytes),transportSha256:sha(transportBytes),reportSha256:sha(reportBytes),transportFile,reportFile};
          });
          const assembled=assembleChapterIdentityReviewParts(packet.plan,transports,reports,parts.map(part=>part.agentId),packet.authorAgentIds,packet.reviewCaseIds);
          assert.equal(assembled.reviews.length,49);
          const reportBytes=Buffer.from(JSON.stringify(assembled,null,2)+'\n');
          const job={schemaVersion:1,kind:'captured-independent-identity-review-parts',phase:'report-recorded',scope,agentId,runId,authorAgentIds:packet.authorAgentIds,sourcePacketSha256:sha(packetBytes),reportSha256:sha(reportBytes),transportPolicy:receipt.transportPolicy,parts};
          fs.writeFileSync(path.join(base,'recording-report.json'),reportBytes,{flag:'wx'});
          fs.writeFileSync(path.join(base,'recording-job.json'),JSON.stringify(job)+'\n',{flag:'wx'});
          JS
          node scripts/record-people-chapter-identity-worker.mjs \
            --packet "$RUNNER_TEMP/native-identity/source-review-packet.json" \
            --report "$RUNNER_TEMP/native-identity/recording-report.json" \
            --job "$RUNNER_TEMP/native-identity/recording-job.json" \
            --registry "$RUNNER_TEMP/identity-registry/$revision" | tee "$RUNNER_TEMP/recorded/recording-receipt.json"
          jq -e '.nativeIdentityProofAccepted and .reviewedCases == 257 and .chapterLocalPeople == 267' "$RUNNER_TEMP/recorded/recording-receipt.json"
          npm run people:validate -- --book jinshu --chapter 031 | tee "$RUNNER_TEMP/recorded/scoped-validation.txt"
          cp data/people/identity-reviews/jinshu/031.json "$RUNNER_TEMP/recorded/jinshu-031-identity-proof.json"
          (cd "$RUNNER_TEMP/recorded" && sha256sum jinshu-031-identity-proof.json recording-receipt.json scoped-validation.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-031-recorded-canonical-identity
          path: ${{ runner.temp }}/recorded/
          if-no-files-found: error
          retention-days: 7
  transfer-031:
    if: inputs.chapter == '031-stage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jinshu-031-recorded-canonical-identity
          run-id: 45288153281
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/recorded
      - name: Attach the exact verified proof and date seal to the owner draft
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/recorded"
          sha256sum -c SHA256SUMS
          jq -e '.nativeIdentityProofAccepted and .reviewedCases == 257 and .chapterLocalPeople == 267 and .sourceRevision == "f65754d727561484a4a9a75453cdcd67ecec5c4d"' recording-receipt.json
          grep -F 'Scoped person data validation passed for jinshu/031' scoped-validation.txt
          node <<'JS'
          const {execFileSync}=require('node:child_process');
          const {createHash}=require('node:crypto');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const root='repos/'+process.env.GITHUB_REPOSITORY;
          const branch='codex/cursor-glossary-nov24-2026-jinshu031';
          const owner='7a7c5869773c0ad213a4b8ba3c498ffaf2cbe537';
          const seal='f65754d727561484a4a9a75453cdcd67ecec5c4d';
          const api=(method,url,body)=>JSON.parse(execFileSync('gh',['api','-X',method,root+url,...(body?['--input','-']:[])],{input:body?JSON.stringify(body):undefined,encoding:'utf8',maxBuffer:10e6}));
          const ownerRef='/git/refs/heads/'+branch;
          assert.equal(api('GET',ownerRef).object.sha,owner,'Exact owner PR changed');
          const entry=(revision,path)=>api('GET','/contents/'+path+'?ref='+revision);
          for(const path of ['data/jinshu/031.json','data/people/extractions/jinshu/031.json','data/people/editorial-decisions/jinshu/031.json']){
            assert.equal(entry(owner,path).sha,entry(seal,path).sha,'Source evidence differs from hosted seal: '+path);
          }
          const dates='data/people/date-audits/jinshu/031.json';
          const oldDate=entry(owner,dates);
          const dateBytes=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json',root+'/contents/'+dates+'?ref='+owner],{maxBuffer:10e6});
          const archiveKey=createHash('sha256').update(JSON.stringify(JSON.parse(dateBytes))).digest('hex');
          const proof=api('POST','/git/blobs',{encoding:'base64',content:fs.readFileSync('jinshu-031-identity-proof.json').toString('base64')});
          const files=[
            {path:dates,sha:entry(seal,dates).sha},
            {path:'data/people/date-audit-history/jinshu/031/'+archiveKey+'.json',sha:oldDate.sha},
            {path:'data/people/identity-reviews/jinshu/031.json',sha:proof.sha},
          ];
          const original=api('GET','/git/commits/'+owner);
          const tree=api('POST','/git/trees',{base_tree:original.tree.sha,tree:files.map(file=>({...file,mode:'100644',type:'blob'}))});
          const message='Attach native independently approved Jinshu 031 identity and chronology';
          const stage=api('POST','/git/commits',{message,tree:tree.sha,parents:[owner]});
          for(const {path,sha} of files)assert.equal(entry(stage.sha,path).sha,sha);
          const ref=api('PATCH',ownerRef,{sha:stage.sha,force:false});
          assert.equal(ref.object.sha,stage.sha);
          console.log(JSON.stringify({chapter:'jinshu/031',pullRequest:5447,ownerBefore:owner,approvedHead:stage.sha,certificateBlob:proof.sha,files}));
          JS
  witness-check-083:
    if: inputs.chapter == '083-witness-check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fb7ef675b0c2089fefaec9a8185c33f8d072bb3
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: jinshu-083-native-identity-evidence
          run-id: 45289188834
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-identity
      - name: Check native witness routes for the six held people
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {assertDossierPrimaryWitness} from './scripts/lib/people-identity-dossiers.mjs';
          import {localNameKeys} from './scripts/lib/people-resolution.mjs';
          import {identityArtifactHash as hash} from './scripts/lib/people-identity-artifacts.mjs';
          const base=path.join(process.env.RUNNER_TEMP,'native-identity');
          const bytes=fs.readFileSync(path.join(base,'source-review-packet.json'));
          const packet=JSON.parse(bytes), receipt=JSON.parse(fs.readFileSync(path.join(base,'preparation-receipt.json')));
          assert.equal(receipt.sourcePacketSha256,hash(bytes));
          assert.equal(receipt.sourceRevision,'1fb7ef675b0c2089fefaec9a8185c33f8d072bb3');
          assert.deepEqual(packet.scope,{book:'jinshu',chapter:'083'});
          const source=JSON.parse(execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/research/people/jinshu083-independent-review-20261123/identity-sealed-1fb7ef67/identity-review-native-hold.json?ref=963ee5293a57602bfd6fb45db19b2ff78d542032'],{encoding:'utf8'}));
          const people=new Map(packet.people.map(person=>[person.localId,person]));
          const units=new Map(packet.units.map(unit=>[[unit.book,unit.chapter,unit.id].join(':'),unit.zh]));
          const plan=new Map(packet.plan.cases.map(item=>[item.id,item]));
          const canonical=new Map(packet.plan.cases.flatMap(item=>item.localPeople.map(id=>[id,item.canonicalPersonId])));
          const nameEvidence=new Map();
          const audit=[];
          for(const held of source.blockedCases){
            const item=plan.get(held.caseId);
            assert(item);
            for(const problem of held.failures){
              const person=people.get(problem.localId);
              assert(person);
              const tested=new Set(person.claims.flatMap(claim=>claim.evidence));
              for(const {unitId} of problem.ownedUnits)tested.add('jinshu:083:'+unitId);
              const matches=[];
              for(const sourceID of tested){
                const [book,chapter,unitId]=sourceID.split(':');
                const quote=units.get(sourceID);
                if(!quote)continue;
                const witness={localId:person.localId,book,chapter,unitId,quote};
                try{assertDossierPrimaryWitness(witness,person,units,localNameKeys,nameEvidence,people,canonical);matches.push(witness);}
                catch(error){if(!error.message.startsWith('Witness does not support this person'))throw error;}
              }
              audit.push({caseId:item.id,localId:person.localId,sourceUnitsTested:[...tested],nativeCompatibleCandidateQuotes:matches});
            }
          }
          assert.equal(audit.length,6);
          console.log(JSON.stringify({sourceRevision:receipt.sourceRevision,authority:'Mechanical witness candidates only. Independent identity disposition required.',cases:audit},null,2));
          JS
