name: Prepare three reconciled chronology chapters for independent identity review
run-name: Prepare identity handoff for Liao Shi 042, 106 and Shi Ji 064
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      SOURCE: 32d461ef5297344e103a040cf9ee28fb05837535
      PRIOR: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - name: Verify current dates and prepare source-complete native packets
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^)" = "$PRIOR"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          export OUT="$RUNNER_TEMP/retrospective-native-identity"
          mkdir -p "$OUT"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          import {dateAuditStatus} from './scripts/lib/people-date-audit.mjs';
          const {RUNNER_TEMP,SOURCE,PRIOR,OUT}=process.env;
          const out=[];
          for(const [book,chapter] of [['liaoshi','042'],['liaoshi','106'],['shiji','064']]){
            try{
              const date=dateAuditStatus(book,chapter);
              assert.equal(date.status,'audited');
              assert.equal(date.findings,0);
              const result=await prepareChapterIdentityReview({book,chapter,sourceRevision:SOURCE,registry:path.join(RUNNER_TEMP,'registry',PRIOR),out:path.join(OUT,book+'-'+chapter),transportMaxBytes:384*1024});
              out.push({book,chapter,result});
            }catch(error){out.push({book,chapter,error:error.message});}
          }
          fs.writeFileSync(path.join(OUT,'cohort-receipts.json'),JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out));
          assert(out.some(x=>x.result?.metrics?.cases>0),'No useful native packets');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrospective-three-native-identity-evidence
          path: ${{ runner.temp }}/retrospective-native-identity/
          if-no-files-found: error
          retention-days: 7
