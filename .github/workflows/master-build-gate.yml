name: Certify partitioned glossary owner reviews
run-name: Certify recovered chronology identity batch 3
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: c271abb995e5101bcb93e258cff242a33210299e
      SHARD: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: recovered-chronology-identity-packets
          run-id: 45391003204
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify captures and run the native identity recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p "$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          node scripts/people-identity-registry-worker.mjs --out "$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE" --revision "$SOURCE"
          node --input-type=module <<'JS'
          const expected=[{"key":"jiuwudaishi/012","shard":0,"actor":"bc-2965c405-54d2-4b38-9214-c6738419c15b","run":"run-2230cefd-d9ba-41a0-9df5-222fc5a50275","owner":"bc-8490c614-fab6-4384-8868-077febf76dfc","packetSha256":"5c9b79732759c098d22a038fcf5a19446c7c28129ef12cbbbb649ee2cfef1079","planFingerprint":"sha256:3e7cb52003d98a046806987ae9b40f3e1f83929b2dd9a407fff286bf2ef628b7","cases":42,"parts":[{"file":"transport-part-001.json","sha256":"16967d5ef7ce6a6a9e4c4a1291b3b0232df81140bfb701db20db094771905bc4"},{"file":"transport-part-002.json","sha256":"fe0f190818cbb8d1f37823887ef66daceb4073b35b10d69cb0559b0dc7ea1337"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-recovered-chronology-identity/jiuwudaishi-012/independent-identity-report-part-001.json","sha256":"f52187b5ff2e454b7b7802dde255f597ace28d26c20bd87ad0b99b6c98ddbb33"},{"path":"research/people/checkpoints/campaign-nov24-recovered-chronology-identity/jiuwudaishi-012/independent-identity-report-part-002.json","sha256":"da61ca23a812e8522631d059eb51f380c7bd1281c47dbcf4da00bd139e2cf2ed"}],"reviewHead":"670bb00bbb5bb30eb21db0ebeea52db441bcf00b"},{"key":"jiuwudaishi/121","shard":0,"actor":"bc-4299fee0-94a5-4c2e-93b3-47a1ac13fdf8","run":"run-76722a80-3c62-4b48-a6e4-2dfe49bc49ae","owner":"bc-8490c614-fab6-4384-8868-077febf76dfc","packetSha256":"9f02f4a1a6c6d8c508249977964fa8be13ab78d301a1898622ad940513efb900","planFingerprint":"sha256:1c1db8f8f757f581e230153b9e64f959d8421378b9697f7741861486cf2c3570","cases":44,"parts":[{"file":"transport-part-001.json","sha256":"907de6233bee80583b08d4d396a99dc2ee56c10ca5c2c3febd8cbf1abb7db363"},{"file":"transport-part-002.json","sha256":"7bd961c332775a985ba6a4cd9dee5f787c9e7b63062a245a213dfd3161eb8dac"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-recovered-chronology-identity/jiuwudaishi-121/independent-identity-report-part-001.json","sha256":"ba4350a50c2e085986aca2f4bae27585f6a5b0675876eb9a3a90e2e2cc99c074"},{"path":"research/people/checkpoints/c