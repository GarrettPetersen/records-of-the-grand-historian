name: Certify partitioned glossary owner reviews
run-name: Certify exact four-part-final scoped identity reviews
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: e61eedae77bea163ec10120e88e806cde91315dd
      SHARD: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
