name: Verify retained independent chronology
run-name: Campaign independent chronology for Jinshu 028 and 081
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        include:
          - chapter: '028'
            author: f5818968f5f2dfdd372ba8594ded338cb3c705bb
            reviewer: 3d1d4ece29879f1b95ca347c2c9ce2cfd9ecea2b
            file: research/people/jinshu028-independent-date-audit-f581-20261124.json
            blob: 0924f1cd37a2cf55120e5d15e442bb4d6f9925fa
          - chapter: '081'
            author: 7bec9ac5168d4c4e3f0a4f38c969ff77e294d7b8
            reviewer: 7e41c1f1add36e8d9bd56c2ab63a207e2f721e8a
            file: research/people/jinshu081-date-audit-report-20261124-owner-7bec9ac-continuation.json
            blob: 22b0429b8631cd26f156f68c141a61d172bc90b6
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.author }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact independent report with native validators
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHAPTER: ${{ matrix.chapter }}
          AUTHOR: ${{ matrix.author }}
          REVIEWER: ${{ matrix.reviewer }}
          PATH_IN_REVIEW: ${{ matrix.file }}
          REPORT_BLOB: ${{ matrix.blob }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHOR"
          out="$RUNNER_TEMP/chronology"
          mkdir -p "$out"
          gh api "repos/$REPO/contents/$PATH_IN_REVIEW?ref=$REVIEWER" --jq .content | base64 --decode > "$out/independent.json"
          test "$(git hash-object "$out/independent.json")" = "$REPORT_BLOB"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(fs.readFileSync(process.argv[1])); assert.equal(r.status,"audited"); assert.equal(r.book,"jinshu"); assert.equal(r.chapter,process.env.CHAPTER)' "$out/independent.json"
          npm run people:dates:record -- --report "$out/independent.json"
          npm run people:dates:verify -- --book jinshu --chapter "$CHAPTER" --out "$out/date-status.json"
          npm run people:validate -- --book jinshu --chapter "$CHAPTER" | tee "$out/scoped-validation.txt"
          cp "data/people/date-audits/jinshu/$CHAPTER.json" "$out/recorded-date-audit.json"
          archive="data/people/date-audit-history/jinshu/$CHAPTER"
          if test -d "$archive"; then
            git ls-files --others --exclude-standard "$archive" | while IFS= read -r item; do
              mkdir -p "$out/history"
              cp "$item" "$out/history/$(basename "$item")"
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-${{ matrix.chapter }}-native-date-recording
          path: ${{ runner.temp }}/chronology/
          if-no-files-found: error
          retention-days: 7
