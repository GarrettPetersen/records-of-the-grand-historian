name: Certify cross-corpus identity reports
run-name: Certify the first recovered audited cohort identity reviews
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: next-audited-glossary-evidence
          run-id: 45336188091
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify review bytes and apply the canonical recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const expected=[{"key":"xintangshu/066","agentId":"bc-5cfc93a7-9e34-452a-a049-553a992aa7ad","runId":"run-26826ee6-b56a-4373-9312-e0ff682bfe42","owner":"bc-a1d9fb49-57cd-49f8-a504-e22bc5dcc56f","packetSha256":"de46c5cf13ae2d0df6e9384913586cdc23fb98cc96de70f79fa7450255a4267b","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/xintangshu-066/independent-identity-report.json","evidenceHead":"e1e0deab2ffd40e782c22af9df61adcbc2f6f1ad","reportSha256":"bd9ec1c4d274caefcce7a17e684788764a85cdd187ccda7fa29bedfd77586467","cases":2},{"key":"qingshigao/027","agentId":"bc-33f707a1-3112-465b-86cb-45c720a62fb5","runId":"run-62a4c702-5839-4d2d-b08e-a554ba2c9638","owner":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","packetSha256":"a273bc522bb4d76ea0bb78c67a3cd396e0eac13aa3045f072fa229d2343276a7","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/qingshigao-027/independent-identity-report.json","evidenceHead":"8bcbfb4c4024ea0c16293d8f533aad2a38882c66","reportSha256":"57ed789c871cca2ae5894a3a81ae007745026498dacd6f9cb5b494095600462c","cases":3},{"key":"qingshigao/047","agentId":"bc-f0d71d77-0df8-4866-a3e1-0ee7fdb32831","runId":"run-e9212345-a62b-4986-bbbb-d3c2e6b462e7","owner":"bc-b1b4cecc-160a-4940-add4-09b11b527691","packetSha256":"09b55dfa230bea34fddec70d4e5eedc04022e54f31c3acccd18185bdb509703b","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/qingshigao-047/independent-identity-report.json","evidenceHead":"62730270a0cbe5b79bd9711a3e883b0f98222f03","reportSha256":"a3ea3e0abc45c5d5d568b1b04a52a90bf4a7dea28a26a17bcb75e3bb53d130c2","cases":3},{"key":"xintangshu/064","agentId":"bc-6f1d51d9-ac9e-4e72-9a82-eafb3a6efef3","runId":"run-566b5c8a-c29e-46b7-8c3d-262d0497eb53","owner":"bc-a1d9fb49-57cd-49f8-a504-e22bc5dcc56f","packetSha256":"5f508350be560f3e4d1081936c8587a7dc1652cc2936e1d6a0dc2d16b446e7e6","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/xintangshu-064/independent-identity-report.json","evidenceHead":"4c78762796e3de4282cfffdcffeefdad11a1944c","reportSha256":"2ce652e2e65bbe3732bfe2d775c83b98dc4d96b3f42faa15568cdc0265b87dfc","cases":4},{"key":"jinshi/043","agentId":"bc-55314703-04cf-4803-af0e-606f9e0049ae","runId":"run-91721eb4-d153-4e0f-a2bd-1709d42f0194","owner":"bc-0eb589e8-bd06-4e8c-bf58-1afc35d46126","packetSha256":"727c36dbc04314cdadb67391515012eb612cf91e18965ae04355d7d694572cfe","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/jinshi-043/independent-identity-report.json","evidenceHead":"5e012c79e2db43d50424f40ebf702d1130c79a60","reportSha256":"e9d211b9b1cd3c4c3c77d163360bfcdb2ad75b8c7ee653fdf52ad1995a4c7091","cases":13},{"key":"liaoshi/107","agentId":"bc-f89d77db-8357-4558-9d3a-dc86982078b9","runId":"run-8e29eab5-a714-4938-9457-43d44e8a665a","owner":"bc-0eb589e8-bd06-4e8c-bf58-1afc35d46126","packetSha256":"ffbe12e0eeeca31d0e0885927c67ac94d1a05048fce32721d7bf0105667b99e3","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liaoshi-107/independent-identity-report.json","evidenceHead":"662529d03de85688840c8d005c11ffbe13a78039","reportSha256":"4e6f871a2837b09c59d549a187364e6527a8e076f94b393194cc9c9bb8816acd","cases":26},{"key":"xinwudaishi/037","agentId":"bc-bdc60850-9367-4592-a2fd-98da9227f080","runId":"run-6db6809d-8633-48de-a03a-a11a7682262d","owner":"bc-a1d9fb49-57cd-49f8-a504-e22bc5dcc56f","packetSha256":"55ab82e5878bb817eba86eb4585ac9e4dbda0d00a3829b96b5e3b52ad11758a0","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/xinwudaishi-037/independent-identity-report.json","evidenceHead":"95bcd63b698db9f4f682c785dd96522e31acb2de","reportSha256":"6bf5140fdb7d4af33d078030eb92992e6870bc5952811bd7d5156fb08bf0e26a","cases":26},{"key":"jiuwudaishi/105","agentId":"bc-e0b2e941-2137-4092-a2e9-6e3e37f274b0","runId":"run-b4e7171d-f996-4f36-bb2a-6088ddf71491","owner":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","packetSha256":"cc76e629d09d021ff04fd5fd95c2b5cdc9c962c069368eb1f955c6a0df25d691","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/jiuwudaishi-105/independent-identity-report.json","evidenceHead":"f0342b81ff0582a49df80b7898cafe3cb2b7f81c","reportSha256":"bc8b1cda63332463f33aca44f8e6f7c4ee2fe758919c2dcea2ecd5d01adaa7c7","cases":27},{"key":"songshu/004","agentId":"bc-4cd17482-e936-451d-b36a-df99d6c7f01b","runId":"run-7ea8cf08-e89b-4f66-a3ea-c055184985a6","owner":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","packetSha256":"1e409f8707eec9854b5f579fb38d859b7d5083ffc57933e222cb496d5574c1ae","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/songshu-004/independent-identity-report.json","evidenceHead":"7ac99498a0ee75cbb9f6a6eae9ff02db8ab63791","reportSha256":"53585e0fd118d2706c7967559f292b099b9f7fe864e1b36dd65dd5990d0b244c","cases":30},{"key":"liaoshi/079","agentId":"bc-7030f98c-710c-48fc-a098-a7dd54b7a289","runId":"run-b21ea7f8-8a2c-4933-b27c-89739d6ba10d","owner":"bc-0eb589e8-bd06-4e8c-bf58-1afc35d46126","packetSha256":"db64b3b91349ee6423a69156fbf0a8e567577b7ffe708a774eca1b3da175c6f3","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liaoshi-079/independent-identity-report.json","evidenceHead":"f2f57424d105faef325dc6702c738bbb4756383e","reportSha256":"894a03a96da41177218a8002ce669ea965901c5657b3514db0184074f4b50e1c","cases":33},{"key":"liaoshi/091","agentId":"bc-854d0953-b85c-4575-b209-b4446bdb5884","runId":"run-8b929ad7-5ce4-4b76-8fb0-bfdb48dc858f","owner":"bc-a1d9fb49-57cd-49f8-a504-e22bc5dcc56f","packetSha256":"2f42491145e1514631e71c60e52443fdf55f39796a11ab68340e92c127ef21a7","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liaoshi-091/independent-identity-report.json","evidenceHead":"2d6061d250d6f539c45fea90672912f428d6774c","reportSha256":"14f902cccc7626ef739dc886cef9417a86fb7bb070d13628eefcfe0fa0fdc838","cases":34}];
          const tmp=process.env.RUNNER_TEMP;
          const output=path.join(process.cwd(),'data/people/generated/cross-corpus-certification');
          const results=[];
          fs.mkdirSync(output,{recursive:true});
          const hash=(bytes)=>createHash('sha256').update(bytes).digest('hex');
          for(const job of expected){
            try{
              const [book,chapter]=job.key.split('/');
              const id=book+'-'+chapter;
              const packet=path.join(tmp,'packets',id,'source-review-packet.json');
              const packetBytes=fs.readFileSync(packet);
              const review=path.join(tmp,id+'-report.json');
              const captured=path.join(tmp,id+'-captured.json');
              assert.equal(hash(packetBytes),job.packetSha256);
              const report=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+job.reportPath+'?ref='+job.evidenceHead]);
              assert.equal(hash(report),job.reportSha256);
              const data=JSON.parse(report);
              assert.equal(data.reviews.length,job.cases);
              assert(data.reviews.every(x=>x.verdict==='approve'));
              assert.equal(data.reviewer.agentId,job.agentId);
              const previous=JSON.parse(packetBytes).authorAgentIds;
              assert(Array.isArray(previous)&&!previous.includes(job.agentId)&&job.owner!==job.agentId);
              fs.writeFileSync(review,report,{flag:'wx'});
              fs.writeFileSync(captured,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:{book,chapter},agentId:job.agentId,runId:job.runId,authorAgentIds:[...new Set([...previous,job.owner])],sourcePacketSha256:job.packetSha256,reportSha256:job.reportSha256})+'\n',{flag:'wx'});
              const receipt=await recordChapterIdentityReview({packet,report:review,job:captured,registry:path.join(tmp,'registry',process.env.SOURCE),out:path.join(output,id+'.json')});
              results.push({key:job.key,receipt});
            }catch(error){results.push({key:job.key,error:error.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-audited-native-identity-first
          path: data/people/generated/cross-corpus-certification/
          if-no-files-found: error
          retention-days: 7
