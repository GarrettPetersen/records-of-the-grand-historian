name: Record current retained Mingshi 034 identity
run-name: Record two independently reviewed Mingshi 034 identities
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: 73ba4773142695f3fefee7a178eabbbfb740f189
      PRIOR: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: mingshi034-current-retained-identity-evidence
          run-id: 45339823689
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained
      - name: Verify the native retained receipt and record the canonical proof
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^)" = "$PRIOR"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          r="$RUNNER_TEMP/retained/prepared/preparation-receipt.json"
          jq -e '.status=="identity-review-current" and .newReviewCases==0 and .reviewedCases==2 and .independentReviewCompleted==true' "$r"
          out="data/people/generated/mingshi034-recorded"
          mkdir -p "$out"
          node scripts/record-people-chapter-identity-worker.mjs --composition "$RUNNER_TEMP/retained/prepared/composition.json" --source-revision "$SOURCE" --registry "$RUNNER_TEMP/registry/$PRIOR" --out "$PWD/$out/identity-review.json" | tee "$out/recording-receipt.json"
          jq -e '.nativeIdentityProofAccepted==true and .reviewedCases==2' "$out/recording-receipt.json"
          npm run people:validate -- --book mingshi --chapter 034 | tee "$out/scoped-validation.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mingshi034-recorded-native-identity
          path: data/people/generated/mingshi034-recorded/
          if-no-files-found: error
          retention-days: 7
