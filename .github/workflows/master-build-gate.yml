name: Verify four chapters after independent editorial repairs
run-name: Validate exact editorial application and prepare only changed chronology evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: houhanshu-111
            book: houhanshu
            chapter: "111"
            source: 91f9f2166eca4603e54220de0d4a8633daeceb26
            prior: 7b85821a54d6a2d234cfc844767496403199cb45
          - key: houhanshu-106
            book: houhanshu
            chapter: "106"
            source: 66bbff94bf0d17b7afb3dc642c414ac77339b9ca
            prior: b32e2e05e0f6356fb5a6914c19f64d39dfa89ddf
          - key: jiutangshu-030
            book: jiutangshu
            chapter: "030"
            source: 344cf42cda05befb5e2b733b726656560f7272e0
            prior: b3c36063da3b2bbb2c754c6f46a429d9cf70c701
          - key: songshu-069
            book: songshu
            chapter: "069"
            source: 1cadb163a7bd731615cd88a77d4102fd122f37a0
            prior: b3a9b891fc0aa5a2f119d0f4edd35ece0cf34d6f
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ matrix.source }}
      PRIOR: ${{ matrix.prior }}
      BOOK: ${{ matrix.book }}
      CHAPTER: ${{ matrix.chapter }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Validate exact reviewed changes and produce current chronology delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$RUNNER_TEMP/editorial-receipt"
          mkdir -p "$OUT"
          npm run people:validate -- --book "$BOOK" --chapter "$CHAPTER" | tee "$OUT/extraction.txt"
          npm run people:dates:verify -- --book "$BOOK" --chapter "$CHAPTER" --out "$OUT/current-date-status.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {buildDateAuditPacket,validateDateAuditReport,dateAuditReferencesCurrent} from './scripts/lib/people-date-audit.mjs';
          const {BOOK:book,CHAPTER:chapter,SOURCE,PRIOR,OUT,RUNNER_TEMP,GITHUB_REPOSITORY}=process.env;
          const key=book+'/'+chapter, chapterFile='data/'+key+'.json', extraction='data/people/extractions/'+key+'.json', audit='data/people/date-audits/'+key+'.json';
          const get=(p,ref)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+p+'?ref='+ref],{maxBuffer:10e6});
          const prev=path.join(RUNNER_TEMP,'previous-chapter');
          fs.mkdirSync(path.join(prev,book),{recursive:true});
          fs.writeFileSync(path.join(prev,book,chapter+'.json'),get(chapterFile,PRIOR));
          const before=buildDateAuditPacket(book,chapter,{dataDir:prev,extraction:JSON.parse(get(extraction,PRIOR))});
          const after=buildDateAuditPacket(book,chapter);
          const previousById=new Map(before.units.map(x=>[x.id,x]));
          const changedUnits=after.units.flatMap(u=>{
            const old=previousById.get(u.id);
            return !old||old.zh!==u.zh||old.en!==u.en||old.literal!==u.literal?[{id:u.id,before:old??null,after:u}]:[];
          });
          const removedUnits=before.units.filter(x=>!after.units.some(y=>x.id===y.id));
          const itemKey=x=>x.claimHash??x.id;
          const prevItems=new Map(before.items.map(x=>[itemKey(x),x]));
          const nextItems=new Map(after.items.map(x=>[itemKey(x),x]));
          assert.equal(prevItems.size,before.items.length,'Duplicate prior chronology item fingerprint');
          assert.equal(nextItems.size,after.items.length,'Duplicate current chronology item fingerprint');
          const neat=({id,claimIndex,...x})=>x;
          const changedItems=after.items.flatMap(x=>{
            const old=prevItems.get(itemKey(x));
            return !old||JSON.stringify(neat(old))!==JSON.stringify(neat(x))?[{before:old??null,after:x}]:[];
          });
          const removedItems=before.items.filter(x=>!nextItems.has(itemKey(x)));
          const changedPeople=after.people.flatMap(x=>{const y=before.people.find(z=>z.id===x.id);return JSON.stringify(y)===JSON.stringify(x)?[]:[{before:y??null,after:x}];});
          const removedPeople=before.people.filter(x=>!after.people.some(y=>x.id===y.id));
          const changedUnitPeople=Object.entries(after.unitPeople).flatMap(([id,ids])=>JSON.stringify(ids.slice().sort())===JSON.stringify((before.unitPeople[id]??[]).slice().sort())?[]:[{id,before:before.unitPeople[id]??[],after:ids}]);
          let priorAudit={status:'missing'};
          if(fs.existsSync(audit)){
            const bytes=get(audit,PRIOR), doc=JSON.parse(bytes);
            assert.deepEqual(fs.readFileSync(audit),bytes,'Owner changed date approval bytes during editorial application');
            try{
              validateDateAuditReport(doc,before);
              assert(dateAuditReferencesCurrent(doc));
              priorAudit={status:doc.status,reviewer:doc.reviewer,itemChecks:doc.itemChecks.length,personChecks:doc.personChecks.length,reviewedUnits:doc.reviewedUnits.length};
            }catch(err){priorAudit={status:'invalid-at-prior-revision',reason:err.message};}
          }
          const report={scope:{book,chapter},source:SOURCE,prior:PRIOR,priorAudit,previousSourceHash:before.sourceHash,sourceHash:after.sourceHash,previousExtractionHash:before.extractionHash,extractionHash:after.extractionHash,changedUnits,removedUnits,changedItems,removedItems,changedPeople,removedPeople,changedUnitPeople};
          fs.writeFileSync(path.join(OUT,'chronology-delta.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({key,priorAudit,changedUnits:changedUnits.length,changedChinese:changedUnits.filter(x=>x.before?.zh!==x.after.zh).length,changedItems:changedItems.length,removedItems:removedItems.length,changedPeople:changedPeople.length,removedPeople:removedPeople.length}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: post-editorial-${{ matrix.key }}
          path: ${{ runner.temp }}/editorial-receipt/
          if-no-files-found: error
          retention-days: 7
