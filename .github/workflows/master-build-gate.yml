name: Certify Jinshi 038 final identity
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 992c7d6e13470e7c0c83e3de2e8e46917800feb4
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: nov24-native-identity-after-replayed-chronology-0
          run-id: 45445628548
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/review-inputs
      - name: Record exact independent native identity certificate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$GITHUB_WORKSPACE/data/people/generated/jinshi038-native"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          mkdir -p "$OUT" "$(dirname "$REGISTRY")"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          const x={"scope":{"book":"jinshi","chapter":"038"},"agentId":"bc-4c6a7f05-b1eb-42bb-9e1e-170a6ae23c1f","ownerAgentId":"bc-159f19bf-4834-45ac-9043-8f3fc66a8383","runId":"run-15914ed2-e3cf-42f2-9659-0ddcfe3c4d12","sourcePacketSha256":"05fe852b7a264100503351546d1ab6377b4079b6058d23290dcd6287ff573714","reportSha256":"c8803a9673e595806820330638bb9dea6f85b68d63905819c57be994c1c74699","reportPath":"research/people/checkpoints/campaign-nov24-retained-native-identity/jinshi-038/native-identity-report.json","reportHead":"3a153fe485ea868e90fcc1fa10b72d3571fc0ca9","identityCases":15};
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {identityArtifactHash,recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const dir=process.env.RUNNER_TEMP+'/review-inputs/jinshi-038', out=process.env.OUT;
          const packet=dir+'/source-review-packet.json', report=dir+'/native-source-review.json', job=dir+'/capture.json';
          const p=fs.readFileSync(packet), raw=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+x.reportPath+'?ref='+x.reportHead],{maxBuffer:2e6,timeout:25000});
          assert.equal(identityArtifactHash(p).replace(/^sha256:/u,''),x.sourcePacketSha256.replace(/^sha256:/u,''));
          assert.equal(identityArtifactHash(raw).replace(/^sha256:/u,''),x.reportSha256);
          assert.equal(JSON.parse(p).registryReuse.sourceRevision,process.env.SOURCE);
          fs.writeFileSync(report,raw,{flag:'wx'});
          fs.writeFileSync(job,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:x.scope,agentId:x.agentId,runId:x.runId,authorAgentIds:[x.ownerAgentId],sourcePacketSha256:identityArtifactHash(p),reportSha256:identityArtifactHash(raw)}),{flag:'wx'});
          const r=await recordChapterIdentityReview({packet,report,job,registry:process.env.REGISTRY,out:out+'/jinshi-038.json'});
          assert(r.nativeIdentityProofAccepted&&r.reviewedCases===x.identityCases);
          fs.writeFileSync(out+'/summary.json',JSON.stringify(r,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jinshi038-native-identity-certificate
          path: data/people/generated/jinshi038-native/
          if-no-files-found: error
          retention-days: 7
