name: Verify composed chapter proofs on current staging
run-name: Check twelve native-certified chapter proofs on staging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 32dc5229a89e270bfea75a8f879e3db62da6d089
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Verify staged chapter data against the exact current production runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          root="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          mkdir -p "$root" "$RUNNER_TEMP/composed-staging"
          export REGISTRY="$root/$SOURCE"
          export OUT="$RUNNER_TEMP/composed-staging"
          node --test scripts/test-people-source-only-chronology.mjs
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          for key in hanshu/090 jiuwudaishi/020 jiuwudaishi/050 jiuwudaishi/037 chenshu/030 jiuwudaishi/070 houhanshu/117 jiuwudaishi/139 hanshu/091 yuanshi/207 jinshi/127 jiuwudaishi/022; do
            book="${key%/*}"; chapter="${key#*/}"
            npm run people:validate -- --book "$book" --chapter "$chapter" | tee "$OUT/$book-$chapter-extraction.txt"
            npm run people:dates:verify -- --book "$book" --chapter "$chapter" --out "$OUT/$book-$chapter-chronology.json"
            jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$OUT/$book-$chapter-chronology.json"
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {readIdentityDossierRegistry} from './scripts/lib/people-identity-dossier-delta.mjs';
          import {loadProperNounMatcher} from './scripts/lib/people-candidates.mjs';
          import {loadValidatedPeopleChapter} from './scripts/lib/people-validated-chapter.mjs';
          import {loadCurrentIdentityEvidence} from './scripts/lib/people-identity-evidence.mjs';
          import {chapterIdentityInputs,validateChapterIdentityBundle} from './scripts/lib/people-chapter-identity.mjs';
          const {SOURCE,REGISTRY,OUT}=process.env, registry=await readIdentityDossierRegistry(REGISTRY,new Map());
          const expected=[{"key":"hanshu/090","hash":"4cce473f2bd50c7af094e582aabf62b518b4913e8610f9c28897323927d6132e","cases":72},{"key":"jiuwudaishi/020","hash":"90c5554391ab5c17ca1c2226d960dbf89d0c824e9f96a08a846bd80c82f6225e","cases":66},{"key":"jiuwudaishi/050","hash":"ad1dd6a24a5a92629f41f51838f2bee72bf3275d860c9be151430ccb630ebd60","cases":71},{"key":"jiuwudaishi/037","hash":"2fcf2a10ffb67932d89bc385820e2e46f77e34cc11f0389db72e6ba60ff08fb2","cases":72},{"key":"chenshu/030","hash":"f82cb1725ccb566b087c4c5e56e25a933bd0fa553added5de97be20b5d28876f","cases":73},{"key":"jiuwudaishi/070","hash":"4ff31ac95b6f049d3150ae72c033e5d163b83b1e22213f52ed2012e4151c461a","cases":59},{"key":"houhanshu/117","hash":"c9b28e1ce148eac294a3e86fb8580764385c0694a674aa34a5746888d772f2f8","cases":56},{"key":"jiuwudaishi/139","hash":"a6179c4cc56060b55ac2eb10d8cae6a240e2e622364a06c72945ab7b2ac44512","cases":17},{"key":"hanshu/091","hash":"e77157536033f65467536a8ffd712455820e3ee254aedb8d852c88000f2f6591","cases":85},{"key":"yuanshi/207","hash":"935a80614e6d1d4fc2ac51772eb8692625b5c145566bf8b5e38e6ed8ae6893ca","cases":84},{"key":"jinshi/127","hash":"d8ecdcf409097240aa483178e6da8573235dada6e6afd74c882d90368c51a38c","cases":80},{"key":"jiuwudaishi/022","hash":"84df2c9ec6fb6dc46acfde6df957c61182100544ea7178fbe27ce45f4251f08c","cases":78}];
          const m=loadProperNounMatcher(), view={localPersonMap:registry.localPersonMap,canonicalByKnownId:registry.canonicalByKnownId};
          try{
            for(const x of expected){
              const [book,chapter]=x.key.split('/');
              const scope={book,chapter};
              const bytes=fs.readFileSync('data/people/identity-reviews/'+x.key+'.json'), hash=createHash('sha256').update(bytes).digest('hex');
              assert.equal(hash,x.hash);
              const proof=JSON.parse(bytes), own=loadValidatedPeopleChapter(book,chapter,{properNounMatcher:m});
              const source=loadCurrentIdentityEvidence(proof,own,m);
              const result=validateChapterIdentityBundle(view,source,scope,proof,chapterIdentityInputs(book,chapter));
              assert.equal(result.retained.length,x.cases);
              fs.writeFileSync(OUT+'/'+book+'-'+chapter+'-identity.json',JSON.stringify({scope,source:SOURCE,cases:result.retained.length,certificateSha256:hash})+'\n');
            }
          }finally{registry.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-twelve-current-approved-staging-certificates
          path: ${{ runner.temp }}/composed-staging/
          if-no-files-found: error
          retention-days: 7
