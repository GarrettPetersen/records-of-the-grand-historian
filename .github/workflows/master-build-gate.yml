name: Prepare audited Jinshu identity evidence
run-name: Prepare Jinshu 047 retained identity with current chronology
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: c3d0743e0295d262ef61202971bbc1dbf4b93370
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - run: node scripts/validate-people-extraction.mjs --self-test
      - uses: actions/download-artifact@v4
        with:
          name: jinshu-047-retained-identity-components
          run-id: 45333193951
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained-047
      - name: Prepare one source-pinned registry and the sealed dossier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          root="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          export REGISTRY="$root/$SOURCE"
          mkdir -p "$root" "$RUNNER_TEMP/registry-export"
          for chapter in 047; do
            npm run people:dates:verify -- --book jinshu --chapter "$chapter" --out "$RUNNER_TEMP/date-$chapter.json"
            jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$RUNNER_TEMP/date-$chapter.json"
          done
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          (cd "$RUNNER_TEMP/retained-047" && sha256sum -c SHA256SUMS)
          jq -e '.scope.book=="jinshu" and .scope.chapter=="047" and .coverage==148' "$RUNNER_TEMP/retained-047/retained-identity-components.json" >/dev/null
          jq '{schemaVersion:1,kind:"chapter-identity-review-composition",scope,plan:.sourcePlan,sourcePlans:[],components,selections:[]}' "$RUNNER_TEMP/retained-047/retained-identity-components.json" > "$RUNNER_TEMP/retained-047.json"
          node --input-type=module <<'JS'
          import path from 'node:path';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          for (const chapter of ['047']) {
            const result=await prepareChapterIdentityReview({book:'jinshu',chapter,sourceRevision:process.env.SOURCE,registry:process.env.REGISTRY,out:path.join(process.env.RUNNER_TEMP,'identity-'+chapter),retainedComposition:path.join(process.env.RUNNER_TEMP,"retained-047.json"),transportMaxBytes:384*1024});
            console.log(JSON.stringify(result));
          }
          JS
          cp "$REGISTRY/manifest.json" "$RUNNER_TEMP/registry-export/manifest.json"
          tar -czf "$RUNNER_TEMP/registry-export/registry.tar.gz" -C "$root" "$SOURCE"
          (cd "$RUNNER_TEMP/registry-export" && sha256sum registry.tar.gz manifest.json > SHA256SUMS)
          test "$(stat -c %s "$RUNNER_TEMP/registry-export/registry.tar.gz")" -le 167772160
      - uses: actions/upload-artifact@v4
        with:
          name: people-registry-${{ env.SOURCE }}
          path: ${{ runner.temp }}/registry-export/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-047-post-removal-native-identity-evidence
          path: ${{ runner.temp }}/identity-047/
          if-no-files-found: error
          retention-days: 7
