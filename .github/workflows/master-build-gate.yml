name: Certify cross-corpus identity reports
run-name: Certify narrow independent source-witness corrections
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: next-audited-glossary-evidence
          run-id: 45336188091
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify review bytes and apply the canonical recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const expected=[{"key":"songshu/096","agentId":"bc-e596112f-a8c7-44d7-ae09-074032992c58","runId":"run-bbb1b2fb-b004-4421-b8aa-27362f2a6c54","owner":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","packetSha256":"b3c150e3fb5bd73fbdf9f493ef897e6eb56578a426ff6a833f67db173654af9a","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/songshu-096/independent-identity-report.json","evidenceHead":"87099533b640740d4d1dc24c3f5602f9efea02e4","reportSha256":"800ef795db4c20d181b2d2a3bc6fcf080537c68180e079369d4af0b428517916","cases":40},{"key":"liangshu/008","agentId":"bc-5c1d9063-5a82-4be2-90d6-08cd90298ca8","runId":"run-0e5393cd-eb87-4f11-8e39-814a5d2bdffb","owner":"bc-5782b067-a4f3-49a7-936b-07d6064d1de5","packetSha256":"4beb3f72d592abc413ac5f405d85f66f504aeb063f90b10cae19123ed2b3110f","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liangshu-008/independent-identity-report.json","evidenceHead":"bac42d006f231cb63828f88101c40ae58d3f783d","reportSha256":"358356b6f37fd1b51bc9be5a3f743228cb346fa149325aefee0611aa9039dfa4","cases":26},{"key":"xintangshu/012","agentId":"bc-633e0883-fd3f-4215-b764-d30fea93e045","runId":"run-c85f7428-d3ae-415a-bdb6-e0166caf680b","owner":"bc-a1d9fb49-57cd-49f8-a504-e22bc5dcc56f","packetSha256":"ea3c2b851b5dc8f7ee8a5219ab02d85e502b77d8a65b0227e9d98856ef4ab4ff","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/xintangshu-012/independent-identity-report.json","evidenceHead":"2c05b7820262c69cb5e71dcae5f931281c97edda","reportSha256":"5fe3fb748bd560d1b84cbc01795d02c2cc0b3aecf3fd2d76d5763a1993ffb04d","cases":36},{"key":"liangshu/024","agentId":"bc-652bdcc9-7584-46c6-be58-b81aaddb6212","runId":"run-46e8f089-81d1-43a1-b1fc-c961cc91d539","owner":"bc-b1b4cecc-160a-4940-add4-09b11b527691","packetSha256":"fce6c04c5dfa2d2b25f253d63cae163c5d74a3e473dfd1e066a699bbe0e9f55d","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liangshu-024/independent-identity-report.json","evidenceHead":"63885d431330f488bc2a4c53ad81d3a3cf2f8d48","reportSha256":"8706ae97c5b8830ad2acb2cfb5cdf8b906471251c74e499163a800912aa2c2eb","cases":34},{"key":"jinshi/023","agentId":"bc-54db4a62-e3b4-4d46-a270-537565dea26b","runId":"run-43de54f4-72ea-4057-9ab5-b64910e45350","owner":"bc-b1b4cecc-160a-4940-add4-09b11b527691","packetSha256":"45f86dc869f724cb861029c22f2155e172ae0c2f88c1847fde95e5220fee9bfa","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/jinshi-023/independent-identity-report.json","evidenceHead":"2fe76de49cc192c319e0b8f8bd34d709710ad2e4","reportSha256":"e0fad8bad92bc0df671ccc982e2f826bbe8c2c21a005fff5d72d8bdbd85436b9","cases":48},{"key":"xinwudaishi/020","agentId":"bc-aa83281c-5ba5-4371-a97d-38e4ceb65a73","runId":"run-489753f4-32b4-4a80-9d05-0888cd410377","owner":"bc-5782b067-a4f3-49a7-936b-07d6064d1de5","packetSha256":"ae6327e29bf6b9754489c997b600b8f51b60f6182d348200f7959c5f46e8e50d","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/xinwudaishi-020/independent-identity-report.json","evidenceHead":"a8b1ea970a2e2df25a9140c62e581eebf0567d2b","reportSha256":"05069eaccc0bc199de6e703b006bb052285c5aa1661cf7b94e9ca0a61c88f46e","cases":31}];
          const tmp=process.env.RUNNER_TEMP;
          const output=path.join(process.cwd(),'data/people/generated/cross-corpus-certification');
          const results=[];
          fs.mkdirSync(output,{recursive:true});
          const hash=(bytes)=>createHash('sha256').update(bytes).digest('hex');
          for(const job of expected){
            try{
              const [book,chapter]=job.key.split('/');
              const id=book+'-'+chapter;
              const packet=path.join(tmp,'packets',id,'source-review-packet.json');
              const packetBytes=fs.readFileSync(packet);
              const review=path.join(tmp,id+'-report.json');
              const captured=path.join(tmp,id+'-captured.json');
              assert.equal(hash(packetBytes),job.packetSha256);
              const report=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+job.reportPath+'?ref='+job.evidenceHead]);
              assert.equal(hash(report),job.reportSha256);
              const data=JSON.parse(report);
              assert.equal(data.reviews.length,job.cases);
              assert(data.reviews.every(x=>x.verdict==='approve'));
              assert.equal(data.reviewer.agentId,job.agentId);
              const previous=JSON.parse(packetBytes).authorAgentIds;
              assert(Array.isArray(previous)&&!previous.includes(job.agentId)&&job.owner!==job.agentId);
              fs.writeFileSync(review,report,{flag:'wx'});
              fs.writeFileSync(captured,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:{book,chapter},agentId:job.agentId,runId:job.runId,authorAgentIds:[...new Set([...previous,job.owner])],sourcePacketSha256:job.packetSha256,reportSha256:job.reportSha256})+'\n',{flag:'wx'});
              const receipt=await recordChapterIdentityReview({packet,report:review,job:captured,registry:path.join(tmp,'registry',process.env.SOURCE),out:path.join(output,id+'.json')});
              results.push({key:job.key,receipt});
            }catch(error){results.push({key:job.key,error:error.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-witness-repair-returns
          path: data/people/generated/cross-corpus-certification/
          if-no-files-found: error
          retention-days: 7
