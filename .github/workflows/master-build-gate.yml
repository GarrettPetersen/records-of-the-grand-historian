name: Verify scoped people curation before a production build
run-name: Prepare native retained-proof deltas for Jinshu 031 and Songshu 004
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SOURCE: d393da3f6981fbbc58a713b127a8462ef76314fe
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - run: node scripts/test-people-source-only-chronology.mjs
      - name: Reconstruct qualified scopes and inspect exact display guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          export OUT="$RUNNER_TEMP/scoped-curation-preflight"
          mkdir -p "$OUT" data/people/generated/identity-dossiers
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE" > "$OUT/registry-receipt.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const rows=[];
          for(const key of ['jinshu/031','songshu/004']){
            const [book,chapter]=key.split('/');
            try{
              const out=path.join(process.env.OUT,key.replace('/','-'));
              const receipt=await prepareChapterIdentityReview({book,chapter,sourceRevision:process.env.SOURCE,registry:process.env.REGISTRY,out,retainedComposition:path.resolve('data/people/identity-reviews/'+key+'.json'),transportMaxBytes:384*1024});
              rows.push({key,status:'prepared',newReviewCases:receipt.newReviewCases,reusedCases:receipt.reusedCases??receipt.reviewedCases,receipt});
            }catch(e){rows.push({key,status:'held',error:e.message});}
          }
          fs.writeFileSync(path.join(process.env.OUT,'delta-preparation.json'),JSON.stringify(rows,null,2)+'\n');
          console.log(JSON.stringify(rows.map(x=>({key:x.key,status:x.status,newReviewCases:x.newReviewCases,reusedCases:x.reusedCases,error:x.error}))));
          if(rows.every(x=>x.status==='held'))throw Error('Both exact delta preparations remain held');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-deferred-retained-identity-deltas
          path: ${{ runner.temp }}/scoped-curation-preflight/
          if-no-files-found: error
          retention-days: 7
