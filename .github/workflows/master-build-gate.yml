name: Campaign scoped validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - chapter: '094'
            revision: 166a7da3935090884d7a89aaec47af256aed1985
          - chapter: '116'
            revision: 5520975d6aaf496e3494352c6498fa12947d3f80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run people:validate -- --book jinshu --chapter ${{ matrix.chapter }}
