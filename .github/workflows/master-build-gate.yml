name: Discover release-ready glossary scopes
run-name: Prepare the next 48 nonempty audited glossary scopes
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 44
    env:
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      STAGING: 2d0daa8f7e8b8a844e8bdc21d915285bf57aea51
      NODE_OPTIONS: --max-old-space-size=3072
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - name: Rank already-audited scopes and run native preparation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          git fetch --no-tags --depth=1 origin "$STAGING"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const {SOURCE,STAGING,RUNNER_TEMP,GITHUB_REPOSITORY}=process.env;
          const queue=JSON.parse(execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/people-work-queue.json?ref=codex/people-work-queue'],{encoding:'utf8',maxBuffer:12e6}));
          const excluded=new Set(["houhanshu/001","jinshu/028","jinshu/030","jinshu/031","jinshu/047","jinshu/053","jinshu/063","jinshu/078","jinshu/081","jinshu/083","jinshu/085","jinshu/094","jinshu/115","jinshu/123","jiuwudaishi/104","liaoshi/042","liaoshi/043","liaoshi/106","mingshi/034","nanqishu/060","shiji/064","shiji/115","songshu/090","xinwudaishi/016"]);
          for(const [key,record] of Object.entries(queue.chapterOwners??{}))if(['active','ready','resume-required'].includes(record.status))excluded.add(key);
          for(const lane of ['identityReviews','dateAudits','claims'])for(const [key,record] of Object.entries(queue[lane]??{}))if(['claimed','active','ready','resume-required'].includes(record.status))excluded.add(key);
          const git=(args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:24e6}).trim();
          const changes=new Set(git(['diff','--name-only',SOURCE,STAGING,'--','data/']).split('\n'));
          const dir='data/people/date-audits';
          const roots=['data','data/people/extractions','data/people/date-audits','data/people/editorial-decisions'];
          const candidates=[];
          const skipped={};
          const skip=k=>{skipped[k]=(skipped[k]??0)+1;};
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          for(const book of fs.readdirSync(dir)){
            if(!fs.statSync(path.join(dir,book)).isDirectory())continue;
            for(const name of fs.readdirSync(path.join(dir,book))){
              if(!/^\d{3}\.json$/.test(name))continue;
              const chapter=name.slice(0,-5),key=book+'/'+chapter;
              if(excluded.has(key)||fs.existsSync('data/people/identity-reviews/'+key+'.json')){skip('reserved_or_certified');continue;}
              const files=roots.map(root=>root+'/'+key+'.json');
              if(files.some(f=>!fs.existsSync(f)||changes.has(f))){skip('missing_or_staging_changed');continue;}
              const audit=read(files[2]);
              if(audit.status!=='audited'||audit.findings?.length!==0){skip('recorded_status');continue;}
              const extraction=read(files[1]);
              const people=extraction.people?.length;
              if(!Number.isInteger(people)||people===0){skip('empty');continue;}
              candidates.push({key,book,chapter,people,files});
            }
          }
          candidates.sort((a,b)=>a.people-b.people||a.key.localeCompare(b.key));
          const receipts=[];
          const out=path.join(RUNNER_TEMP,'cohort');
          fs.mkdirSync(out,{recursive:true});
          const registry=path.join(RUNNER_TEMP,'registry',SOURCE);
          let prepared=0;
          for(const c of candidates){
            if(prepared>=48)break;
            const target=path.join(out,c.key.replace('/','-'));
            try{
              const result=await prepareChapterIdentityReview({book:c.book,chapter:c.chapter,sourceRevision:SOURCE,registry,out:target,transportMaxBytes:384*1024});
              const pin=read(path.join(target,'preparation-receipt.json'));
              if(!result.metrics?.cases||result.reviewParts?.length){
                receipts.push({key:c.key,people:c.people,status:'requires_separate_review_transport',cases:result.metrics?.cases??0,parts:result.reviewParts?.length??0});
                fs.rmSync(target,{recursive:true,force:true});continue;
              }
              const files=c.files.map(p=>({path:p,blob:git(['rev-parse',SOURCE+':'+p])}));
              receipts.push({key:c.key,people:c.people,status:'ready',cases:result.metrics.cases,planFingerprint:result.planFingerprint,sourcePacketSha256:result.sourcePacketSha256,transportSha256:pin.transportSha256,transportBytes:pin.transportBytes,files});
              prepared+=1;
            }catch(e){receipts.push({key:c.key,people:c.people,status:'held',reason:e.message.split('\n')[0]});}
          }
          fs.writeFileSync(path.join(out,'cohort-receipts.json'),JSON.stringify({source:SOURCE,staging:STAGING,eligibleBeforeNativeGate:candidates.length,skipped,prepared,receipts},null,2)+'\n',{flag:'wx'});
          console.log(JSON.stringify({eligibleBeforeNativeGate:candidates.length,skipped,prepared,held:receipts.filter(x=>x.status==='held').length}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-audited-glossary-evidence
          path: ${{ runner.temp }}/cohort/
          if-no-files-found: error
          retention-days: 7
