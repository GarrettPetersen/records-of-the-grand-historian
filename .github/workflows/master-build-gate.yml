name: Certify retained Mingshi 034 identity decisions
run-name: Reuse the exact Mingshi review through the English-only correction
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SOURCE: 73ba4773142695f3fefee7a178eabbbfb740f189
      PRIOR: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: campaign-audited-non-jinshu-identity-evidence
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packet
      - name: Compose and record verified unchanged identity evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse HEAD^)" = "$PRIOR"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {captureIdentityProofComponent} from './scripts/lib/people-identity-proof-composition.mjs';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          import {recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const pin={"agentId":"bc-77bf0e6f-d0fe-437b-a4df-83de0224062f","runId":"run-23ee4506-bd63-44a2-a344-98334eaf42e7","ownerAgentId":"bc-c4ccc606-4e91-4f57-8419-94b8fb4d3a0e","sourcePacketSha256":"7ae547112fdf43af32f5452e4995a1ade4886964e8f12edf85f01d8041d09e21","transportSha256":"7d1034a5b3c4b8b1904634abac0cf50577da417e7a70ec1a51458dcb255f9e8e","reportPath":"research/people/checkpoints/cross-corpus-native-review-20261124/mingshi-034/independent-identity-report.json","firstReviewHead":"3d953381afc8393aedb559bdb9f76717dbf72012","reportSha256":"4053cbc1e28fd6c04bbfc93a838fadc3341b2255f4ee5f65ff138635d97b9cfa","recheckPath":"research/people/checkpoints/cross-corpus-native-review-20261124/mingshi-034/independent-dependency-recheck.json","recheckHead":"073f60e30f8e87c2c28d7b1234164bfeebb6af11","editorialOwnerHead":"8ecdc7f8389731e42fde7fb19d97855a38454cac"};
          const {RUNNER_TEMP,PRIOR,SOURCE,GITHUB_REPOSITORY}=process.env;
          const out=path.join(RUNNER_TEMP,'mingshi034-native');
          fs.mkdirSync(out);
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const packetDir=path.join(RUNNER_TEMP,'packet','mingshi-034');
          const packet=fs.readFileSync(path.join(packetDir,'source-review-packet.json'));
          const transport=fs.readFileSync(path.join(packetDir,'transport-packet.json'));
          assert.equal(hash(packet),pin.sourcePacketSha256);
          assert.equal(hash(transport),pin.transportSha256);
          const evidence=(p,r)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+p+'?ref='+r]);
          const report=evidence(pin.reportPath,pin.firstReviewHead);
          assert.equal(hash(report),pin.reportSha256);
          const native=JSON.parse(report);
          assert.equal(native.reviewer.agentId,pin.agentId);
          assert.equal(native.reviews.length,2);
          assert(native.reviews.every(x=>x.verdict==='approve'));
          const recheck=JSON.parse(evidence(pin.recheckPath,pin.recheckHead));
          assert.equal(recheck.verdict,'accept');
          assert.equal(recheck.reviewerAgentId,pin.agentId);
          assert.equal(recheck.ownerRevisionReviewed,pin.editorialOwnerHead);
          assert(recheck.identityCases.cases.every(x=>x.verdict==='approve-unchanged'));
          const capture={schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:{book:'mingshi',chapter:'034'},agentId:pin.agentId,runId:pin.runId,authorAgentIds:[pin.ownerAgentId],sourcePacketSha256:pin.sourcePacketSha256,reportSha256:pin.reportSha256,transportSha256:pin.transportSha256};
          const {sourcePlan,component}=captureIdentityProofComponent(packet,report,transport,capture,JSON.parse(fs.readFileSync(path.join(packetDir,'preparation-receipt.json'))).transportPolicy);
          const retained=path.join(out,'retained-native-proof.json');
          fs.writeFileSync(retained,JSON.stringify({schemaVersion:1,kind:'chapter-identity-review-composition',scope:capture.scope,plan:sourcePlan,sourcePlans:[],components:[component],selections:[]})+'\n');
          const registry=path.join(RUNNER_TEMP,'registry',PRIOR);
          const preparedOut=path.join(out,'prepared');
          const result=await prepareChapterIdentityReview({book:'mingshi',chapter:'034',sourceRevision:SOURCE,registry,out:preparedOut,retainedComposition:retained,transportMaxBytes:384*1024});
          console.log(JSON.stringify(result));
          if(result.newReviewCases===0&&result.reusedCases===2){
            const dest=path.join(process.cwd(),'data/people/generated/mingshi034-certification');
            fs.mkdirSync(dest,{recursive:true});
            const recorded=await recordChapterIdentityReview({composition:path.join(preparedOut,'composition.json'),sourceRevision:SOURCE,registry,out:path.join(dest,'mingshi-034.json')});
            fs.copyFileSync(path.join(dest,'mingshi-034.json'),path.join(out,'mingshi-034.json'));
            fs.writeFileSync(path.join(out,'recording-receipt.json'),JSON.stringify(recorded,null,2)+'\n');
            console.log(JSON.stringify(recorded));
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: mingshi034-current-retained-identity-evidence
          path: ${{ runner.temp }}/mingshi034-native/
          if-no-files-found: error
          retention-days: 7
