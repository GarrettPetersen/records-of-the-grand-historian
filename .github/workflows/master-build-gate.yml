name: Certify partitioned glossary owner reviews
run-name: Certify exact separate-transport-shard-1 scoped identity reviews
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: e61eedae77bea163ec10120e88e806cde91315dd
      SHARD: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: nov24-five-to-seven-part-identity-packets-1
          run-id: 45418694013
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify captures and run the native identity recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p "$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          node scripts/people-identity-registry-worker.mjs --out "$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE" --revision "$SOURCE"
          node --input-type=module <<'JS'
          const expected=[{"key":"jiuwudaishi/060","shard":0,"actor":"bc-3cf9625f-37fc-4a89-91a7-ec4045e55cec","run":"run-515de0ad-414e-4120-838f-5a99700b971b","owner":"bc-e207215c-b48a-483e-b53d-c526ad7cb717","packetSha256":"cbb5ebf24411e0b52eb9a48b453dc4e31a965a5796002e325a9b2ae135644abb","planFingerprint":"sha256:b0b8c83bb755538166dbf401cd121a2992c0acba1b33f5f0c1c3c463e02e8775","cases":99,"parts":[{"file":"transport-part-001.json","sha256":"f814b7973974cacc72fb6f427a97b21e0b9675b368fa03b5bb31c41f8ef6bbd2"},{"file":"transport-part-002.json","sha256":"cd76c0ae4fa58efa665e91e5e9280cb21be2010129170cd0c3e590392a130d24"},{"file":"transport-part-003.json","sha256":"471ea35571fd8bc3c62d5a35e667d695c2f4395398b76860a50b1c031a284be8"},{"file":"transport-part-004.json","sha256":"84a54d4e80d5a27f987a6f6ae90e461dda1f026834c984448e645dba432ea194"},{"file":"transport-part-005.json","sha256":"154edd7621b63dd99900baea76fcd3095e6ec0c2f768b6ba42750e1d367e0755"},{"file":"transport-part-006.json","sha256":"177d59d6bbfb59c0e5b194c8d3b5c67bb744fa2e1b1d581fe065b30914de78b6"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-separate-transport-audited/jiuwudaishi-060/independent-identity-report-part-001.json","sha256":"b2777ca5630ad39c6cd2af5ad544bafbb3c16e9fa50ac62804d3b2172b60145a","projection":"flat-attested-report"},{"path":"research/people/checkpoints/campaign-nov24-separate-transport-audited/jiuwudaishi-060/independent-identity-report-part-002.json","sha256":"54d7dac7d26272c95ce71b04df8696687288e649dc3569a82bbd9224457beef7","projection":"flat-attested-report"},{"path":"research/people/checkpoints/campaign-nov24-separate-transport-audited/jiuwudaishi-060/independent-identity-report-part-003.json","sha256":"f07f2ae1e560f1e62594425dd5c10b9030b5d7c2331c34c5ebdd86e35bc8a9d6","projection":"flat-attested-report"},{"path":"research/people/checkpoints/campaign-nov24-separate-transport-audited/jiuwudaishi-060/independent-identity-report-part-004.json","sha256":"1cce84dd1c8ff1fdb