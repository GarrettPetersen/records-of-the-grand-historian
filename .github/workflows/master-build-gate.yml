name: Certify the retained Jinshu 047 identity review
run-name: Record 125 retained and 22 reviewed Jinshu 047 identity cases
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SOURCE: c3d0743e0295d262ef61202971bbc1dbf4b93370
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-c3d0743e0295d262ef61202971bbc1dbf4b93370
          run-id: 45337830236
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: jinshu-047-post-removal-native-identity-evidence
          run-id: 45337830236
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packet
      - name: Validate and record the exact current independent case responses
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {assembleChapterIdentityReviewParts} from './scripts/lib/people-identity-review-transport.mjs';
          import {recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const pin={"agentId":"bc-f5b6b706-b1a5-4233-a9e0-855c2834d8b5","runId":"run-70e8bb26-b6bd-4252-aa91-d5e8b94328d4","owner":"bc-1d294055-ba1a-4edb-9343-adeb9881920a","sourcePacketSha256":"dc4f9a55967614ca6b9171be5ebe0db7fb0eca3c6f498946dfa57880df185ea1","transportSha256":"a377fda39914c505cd84364c9fd64497bc9feb26fc2a907f113faaefbc3c6831","planFingerprint":"sha256:37e5eeccbca00a5791fb56038aece635127b05596de3b0ed195179e48c26e574","path":"research/people/checkpoints/jinshu047-reconciled-native-review-20261124/part-001.result.json","evidenceHead":"6274e0349a8e21af8325e55943d4a91c37d8b0b4","wrapperSha256":"9c98926ce8bbc66f1fb2cba191fb3f045dcd3ee2c000647f84cea51c0858aa8b"};
          const {RUNNER_TEMP,SOURCE,GITHUB_REPOSITORY}=process.env;
          const dir=path.join(RUNNER_TEMP,'packet');
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const packet=path.join(dir,'source-review-packet.json');
          const sourceBytes=fs.readFileSync(packet), source=JSON.parse(sourceBytes);
          const transport=path.join(dir,'transport-part-001.json');
          const transportBytes=fs.readFileSync(transport), transportData=JSON.parse(transportBytes);
          assert.equal(hash(sourceBytes),pin.sourcePacketSha256);
          assert.equal(hash(transportBytes),pin.transportSha256);
          assert.equal(source.plan.fingerprint,pin.planFingerprint);
          assert.equal(source.reviewCaseIds.length,22);
          const receipt=JSON.parse(fs.readFileSync(path.join(dir,'preparation-receipt.json')));
          assert.equal(receipt.reusedCases,125);
          const raw=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+pin.path+'?ref='+pin.evidenceHead],{maxBuffer:4e6});
          assert.equal(hash(raw),pin.wrapperSha256);
          const {requiredReport:actual,...result}=JSON.parse(raw);
          const {requiredReport:schema,...expected}=transportData;
          assert.deepEqual(result,expected);
          assert.equal(actual.reviewer.agentId,pin.agentId);
          assert(actual.reviews.every(x=>x.verdict==='approve'));
          assert(!source.authorAgentIds.includes(pin.agentId));
          assert.notEqual(pin.agentId,pin.owner);
          const reportFile=path.join(dir,'part-001.native-report.json');
          const reportBytes=Buffer.from(JSON.stringify(actual)+'\n');
          fs.writeFileSync(reportFile,reportBytes,{flag:'wx'});
          const part={schemaVersion:1,kind:'captured-independent-identity-review-part',phase:'report-recorded',scope:source.scope,agentId:pin.agentId,runId:pin.runId,sourcePacketSha256:hash(sourceBytes),transportSha256:hash(transportBytes),reportSha256:hash(reportBytes),transportFile:transport,reportFile};
          const authorAgentIds=[...new Set([...source.authorAgentIds,pin.owner])];
          const report=assembleChapterIdentityReviewParts(source.plan,[transportData],[actual],[pin.agentId],authorAgentIds,source.reviewCaseIds);
          assert.equal(report.reviews.length,22);
          const bytes=Buffer.from(JSON.stringify(report)+'\n');
          const reportPath=path.join(dir,'review-native-aggregate.json'), jobPath=path.join(dir,'review-native-job.json');
          fs.writeFileSync(reportPath,bytes,{flag:'wx'});
          fs.writeFileSync(jobPath,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review-parts',phase:'report-recorded',scope:source.scope,agentId:pin.agentId,runId:pin.runId,authorAgentIds,sourcePacketSha256:hash(sourceBytes),reportSha256:hash(bytes),transportPolicy:receipt.transportPolicy,parts:[part]})+'\n',{flag:'wx'});
          const out=path.join(process.cwd(),'data/people/generated/jinshu047-certified');
          fs.mkdirSync(out,{recursive:true});
          const output=await recordChapterIdentityReview({packet,report:reportPath,job:jobPath,registry:path.join(RUNNER_TEMP,'registry',SOURCE),out:path.join(out,'identity-review.json')});
          assert.equal(output.reviewedCases,147);
          assert.equal(output.nativeIdentityProofAccepted,true);
          fs.writeFileSync(path.join(out,'recording-receipt.json'),JSON.stringify(output,null,2)+'\n');
          console.log(JSON.stringify(output));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu047-canonical-composed-identity
          path: data/people/generated/jinshu047-certified/
          if-no-files-found: error
          retention-days: 7
