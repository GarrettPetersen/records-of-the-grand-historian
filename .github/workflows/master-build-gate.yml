name: Certify cross-corpus identity reports
run-name: Certify five exact cross-corpus independent reviews
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: campaign-audited-non-jinshu-identity-evidence
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify review bytes and apply the canonical recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const expected=[{"key":"jiuwudaishi/104","agentId":"bc-54505c4f-9fca-4dbe-a2bd-b6420fd1c919","runId":"run-e492858a-eedf-4881-ae6c-92c8296cdd60","owner":"bc-47648f6a-9ca6-438d-9cd5-6f14a61294c2","packetSha256":"1d08562fc91e9f9b4934572dc43035534ff177536c8da81fcc9fe7d1ff0a0850","reportPath":"research/people/checkpoints/cross-corpus-native-review-20261124/jiuwudaishi-104/independent-identity-report.json","evidenceHead":"961fcd0b75f3a7245ecb82942fd914eb38136f75","reportSha256":"f82a60e0829c3d457c5c564a37e675fdf23623e8698d643a666c1d9aa9dc08c4","cases":13},{"key":"nanqishu/060","agentId":"bc-fffcbf7a-9ac1-46b4-a356-ceeafbbf658d","runId":"run-6bf5f26c-14d2-48b1-9581-af9d504d36a8","owner":"bc-47648f6a-9ca6-438d-9cd5-6f14a61294c2","packetSha256":"a3480390fcf7c144ec465d206b6d0519bd2dba14cc3d278f022708d12d240e2e","reportPath":"research/people/checkpoints/cross-corpus-native-review-20261124/nanqishu-060/independent-identity-report.json","evidenceHead":"ca187f87c476f158f37605bcddd65434e6836e85","reportSha256":"25918cf58f784fb71a1c31b1a44a3bf71d61841c0b200485d97852f356921af7","cases":15},{"key":"xinwudaishi/016","agentId":"bc-02876d6d-8ece-4570-bd52-79663d8b145b","runId":"run-f9add0e9-ca5b-4d59-9e3d-0ea8313a31b1","owner":"bc-47648f6a-9ca6-438d-9cd5-6f14a61294c2","packetSha256":"f5f071e7ca2742580257ff1a90f2658491760be33b4b841a9a23a8238cc20dc6","reportPath":"research/people/checkpoints/cross-corpus-native-review-20261124/xinwudaishi-016/independent-identity-report.json","evidenceHead":"d7d10c0fe6a8ac521f7444d747d2ecdc917ead84","reportSha256":"a79757a69cbf9c514129fc27a6c60a67cbdfc512deffffd58f0c21d3dbe4f55e","cases":20},{"key":"songshu/090","agentId":"bc-e7661202-dafd-4fc3-b2e3-285b3cab8a1b","runId":"run-f51d6ec5-c023-42c7-8d43-9c782d18a922","owner":"bc-47648f6a-9ca6-438d-9cd5-6f14a61294c2","packetSha256":"69d0f5e9e1ab11856280abf44d41f35fc93040e6f906986390b97db65dbd6fa5","reportPath":"research/people/checkpoints/cross-corpus-native-review-20261124/songshu-090/independent-identity-report.json","evidenceHead":"5225681adaae5601a292eba62a9e8ba1fb5c2560","reportSha256":"f999cca0dfab783d48de1708f3ac925ed943b3d54c2ed4da488a852d8a0a5e94","cases":22},{"key":"shiji/115","agentId":"bc-9c7aaec2-7110-4278-b4b9-0e7bd29682c4","runId":"run-bd86034b-67a6-46a2-be7e-3c1fb7c2174c","owner":"bc-47648f6a-9ca6-438d-9cd5-6f14a61294c2","packetSha256":"d61449f09ca1690436f94fb0975d96394f5b7e3abe352fb14706101bb78d0fb7","reportPath":"research/people/checkpoints/cross-corpus-native-review-20261124/shiji-115/independent-identity-report.json","evidenceHead":"154a711b137e05e4e83c890bd348c505e24dd1c9","reportSha256":"f57d766c7664cd802470befdf19ec4196def5fb1269f0598362350657fdeb404","cases":22}];
          const tmp=process.env.RUNNER_TEMP;
          const output=path.join(process.cwd(),'data/people/generated/cross-corpus-certification');
          const results=[];
          fs.mkdirSync(output,{recursive:true});
          const hash=(bytes)=>createHash('sha256').update(bytes).digest('hex');
          for(const job of expected){
            try{
              const [book,chapter]=job.key.split('/');
              const id=book+'-'+chapter;
              const packet=path.join(tmp,'packets',id,'source-review-packet.json');
              const packetBytes=fs.readFileSync(packet);
              const review=path.join(tmp,id+'-report.json');
              const captured=path.join(tmp,id+'-captured.json');
              assert.equal(hash(packetBytes),job.packetSha256);
              const report=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+job.reportPath+'?ref='+job.evidenceHead]);
              assert.equal(hash(report),job.reportSha256);
              const data=JSON.parse(report);
              assert.equal(data.reviews.length,job.cases);
              assert(data.reviews.every(x=>x.verdict==='approve'));
              assert.equal(data.reviewer.agentId,job.agentId);
              const previous=JSON.parse(packetBytes).authorAgentIds;
              assert(Array.isArray(previous)&&!previous.includes(job.agentId)&&job.owner!==job.agentId);
              fs.writeFileSync(review,report,{flag:'wx'});
              fs.writeFileSync(captured,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:{book,chapter},agentId:job.agentId,runId:job.runId,authorAgentIds:[...new Set([...previous,job.owner])],sourcePacketSha256:job.packetSha256,reportSha256:job.reportSha256})+'\n',{flag:'wx'});
              const receipt=await recordChapterIdentityReview({packet,report:review,job:captured,registry:path.join(tmp,'registry',process.env.SOURCE),out:path.join(output,id+'.json')});
              results.push({key:job.key,receipt});
            }catch(error){results.push({key:job.key,error:error.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results));
          assert(results.every(x=>x.receipt?.nativeIdentityProofAccepted),'Some exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-corpus-certified-identity-next-five
          path: data/people/generated/cross-corpus-certification/
          if-no-files-found: error
          retention-days: 7
