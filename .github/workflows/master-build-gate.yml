file":"transport-part-002.json","sha256":"bc940e5f92ad6bf960315dc629af6b56ea473682f59649e1ec1290688dd95771"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/jinshi-039/independent-identity-report-part-001.json","blob":"98a94bcc742d9828a6191d88f9cbe501b8062a91","sha256":"1658499880e2c3aa8c11b20129cffc0a570b5459047e07c2ad73e86fda18ddb8","cases":28,"approvals":28,"holds":[]},{"path":"research/people/checkpoints/campaign-nov24-split-transport/jinshi-039/independent-identity-report-part-002.json","blob":"e928aaedca4472c798972472541fdfd1bdb1670b","sha256":"3688f9cfb0e10103bf23d9540a517f08cb65557eb171f9c9c2c4db3337f2403b","cases":29,"approvals":29,"holds":[]}],"reviewHead":"e52f57575dd681cf00f08aec5a1947b623d20b0f"},{"key":"jinshi/046","shard":0,"actor":"bc-80936f36-4fce-448d-9e07-938f2122b6ac","run":"run-ae73d864-e230-45e3-91a4-ac7420caee16","owner":"bc-23529211-836c-4588-b3ee-a1d4918b098f","packetSha256":"3e941560cc480a595905427bc5c754f8e6acbdae8e02009af385eae696f6e443","planFingerprint":"sha256:acdf1a7521154c6977424f72a5fdd0cc3d2b6853c47d693bfda44feaae97c627","cases":57,"parts":[{"file":"transport-part-001.json","sha256":"34ca74ad2c68062a05f425873d006cb85452462cb2a6066879612354e64b4308"},{"file":"transport-part-002.json","sha256":"1be205af3fa13f4666c76da7e982b879f88475ef91920f800d8b2791f4654251"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/jinshi-046/independent-identity-report-part-001.json","blob":"a772c52e984ef0428137abf3297f6d5f6a87ed71","sha256":"4ea01a7ab6d547778bd4b6b053fbc873c85ba29db0b656910285c6d88d1eff2e","cases":28,"approvals":28,"holds":[]},{"path":"research/people/checkpoints/campaign-nov24-split-transport/jinshi-046/independent-identity-report-part-002.json","blob":"6104287c3303c3fbda35acf92685aae577651ac2","sha256":"59e765f433c7ed766784bc9d5c0654b48600998a04fb59a3026ca0f1b48dde5a","cases":29,"approvals":29,"holds":[]}],"reviewHead":"5ddcc057c749de99479117a9f27f6e89a67f08f8"},{"key":"liangshu/044","shard":3,"actor":"bc-07cb5293-a526-4491-908b-81f931e86b01","run":"run-1668cb84-2fed-4717-94c9-9c1573070097","owner":"bc-978e1690-a3ab-48d2-ae68-23b6a36f76fe","packetSha256":"934b49cc6cb881a636ddfd1142afd94b1397f0a2016e3da2788697ee69f9d3bf","planFingerprint":"sha256:c19a358fa7144dadfa8edc244d1520d1fde9460cd0913a078e36b3d5cda1ae08","cases":59,"parts":[{"file":"transport-part-001.json","sha256":"7feb25799f1d794db8834ecae4193bbc60623fad819030b895e7b1f09dd43448"},{"file":"transport-part-002.json","sha256":"a848b88f8dd47ee2936f8e60565e85480f6a5efdaf854e010e81edaf12ae41c3"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/liangshu-044/independent-identity-report-part-001.json","blob":"58622429d87b7c1d21a821cbdb3222856376cce3","sha256":"55b63d93b6c28dd1efd9357a5e72db16a83a43004737a7c25b660f7f33f44601","cases":29,"approvals":29,"holds":[]},{"path":"research/people/checkpoints/campaign-nov24-split-transport/liangshu-044/independent-identity-report-part-002.json","blob":"9bd3390b005cb60f369904f619d6f955976a88e4","sha256":"ca554ec9ffb79e298c717e576cbc5e6282653d992c964dc9e3fd999227fb1784","cases":30,"approvals":30,"holds":[]}],"reviewHead":"57b230d887682ac98226c47a6671bd16180dfab2"}];
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {identityArtifactHash,recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          import {assembleChapterIdentityReviewParts,identityReviewTransportPolicy} from './scripts/lib/people-identity-review-transport.mjs';
          const tmp=process.env.RUNNER_TEMP, registry=path.join(tmp,'registry',process.env.SOURCE);
          const output=path.join(process.cwd(),'data/people/generated/nov24-partitioned-validation');
          fs.mkdirSync(output,{recursive:true});
          const readRemote=(file,revision)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+file+'?ref='+revision],{maxBuffer:3e6,timeout:20000});
          const results=[];
          for(const j of expected.filter(y=>y.shard===Number(process.env.SHARD))){
            try{
              const id=j.key.replace('/','-'), dir=path.join(tmp,'packets',id);
              const packet=path.join(dir,'source-review-packet.json'), p=fs.readFileSync(packet), data=JSON.parse(p);
              const hash=b=>identityArtifactHash(b).replace(/^sha256:/u,'');
              assert.equal(hash(p),j.packetSha256.replace(/^sha256:/u,''));
              assert.equal(data.plan.fingerprint,j.planFingerprint);
              assert.equal(data.registryReuse.sourceRevision,process.env.SOURCE);
              assert(!data.authorAgentIds.includes(j.actor)&&j.owner!==j.actor);
              const parts=[],transports=[],reports=[];
              for(const [i,part] of j.parts.entries()){
                const transportFile=path.join(dir,part.file),b=fs.readFileSync(transportFile);
                const report=j.reports[i], reportFile=path.join(dir,'actual-report-'+(i+1)+'.json'), d=readRemote(report.path,j.reviewHead);
                assert.equal(hash(b),part.sha256.replace(/^sha256:/u,''));
                assert.equal(hash(d),report.sha256);
                const rawReport=JSON.parse(d);
                assert.equal(rawReport.reviewer.agentId,j.actor);
                assert(rawReport.reviews.every(x=>x.verdict==='approve'));
                fs.writeFileSync(reportFile,d,{flag:'wx'});
                transports.push(JSON.parse(b));reports.push(rawReport);
                parts.push({schemaVersion:1,kind:'captured-independent-identity-review-part',phase:'report-recorded',agentId:j.actor,runId:j.run,sourcePacketSha256:identityArtifactHash(p),transportSha256:identityArtifactHash(b),reportSha256:identityArtifactHash(d),transportFile,reportFile});
              }
              const aggregated=assembleChapterIdentityReviewParts(data.plan,transports,reports,parts.map(x=>x.agentId),data.authorAgentIds,data.reviewCaseIds);
              assert.equal(aggregated.reviews.length,j.cases);
              const report=path.join(dir,'actual-aggregate.json'), job=path.join(dir,'actual-job.json');
              const aggregateBytes=Buffer.from(JSON.stringify(aggregated)+'\n');
              fs.writeFileSync(report,aggregateBytes,{flag:'wx'});
              fs.writeFileSync(job,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review-parts',phase:'report-recorded',scope:data.scope,agentId:j.actor,runId:j.run,authorAgentIds:[j.owner],sourcePacketSha256:identityArtifactHash(p),reportSha256:identityArtifactHash(aggregateBytes),transportPolicy:identityReviewTransportPolicy(384*1024),parts})+'\n',{flag:'wx'});
              const receipt=await recordChapterIdentityReview({packet,report,job,registry,out:path.join(output,id+'.json')});
              results.push({key:j.key,receipt});
            }catch(e){results.push({key:j.key,error:e.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results.map(x=>({key:x.key,native:x.receipt?.nativeIdentityProofAccepted,error:x.error}))));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-recovered-handoffs-native-proof-${{ matrix.shard }}
          path: data/people/generated/nov24-partitioned-validation/
          if-no-files-found: error
          retention-days: 7
