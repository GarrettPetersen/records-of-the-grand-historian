name: Verify composed chapter proofs on current staging
run-name: Verify Jinshu and Songshu proof compositions against current staging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 31901f6b123764554b691156eae8ca61c793b781
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Verify staged chapter data against the exact current production runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          root="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          mkdir -p "$root" "$RUNNER_TEMP/composed-staging"
          export REGISTRY="$root/$SOURCE"
          export OUT="$RUNNER_TEMP/composed-staging"
          node --test scripts/test-people-source-only-chronology.mjs
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          for key in jinshu/031 songshu/004; do
            book="${key%/*}"; chapter="${key#*/}"
            npm run people:validate -- --book "$book" --chapter "$chapter" | tee "$OUT/$book-$chapter-extraction.txt"
            npm run people:dates:verify -- --book "$book" --chapter "$chapter" --out "$OUT/$book-$chapter-chronology.json"
            jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$OUT/$book-$chapter-chronology.json"
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {readIdentityDossierRegistry} from './scripts/lib/people-identity-dossier-delta.mjs';
          import {loadProperNounMatcher} from './scripts/lib/people-candidates.mjs';
          import {loadValidatedPeopleChapter} from './scripts/lib/people-validated-chapter.mjs';
          import {loadCurrentIdentityEvidence} from './scripts/lib/people-identity-evidence.mjs';
          import {chapterIdentityInputs,validateChapterIdentityBundle} from './scripts/lib/people-chapter-identity.mjs';
          const {SOURCE,REGISTRY,OUT}=process.env, registry=await readIdentityDossierRegistry(REGISTRY,new Map());
          const expected=[{"key":"jinshu/031","hash":"7dbdacc997e8ad924b2453e573add77800a36ee4543cf5f72dd048768fe8c3ee","cases":257},{"key":"songshu/004","hash":"a712ec82f13287a63f156154c788419577cc30272f9f9759d4e3a86ea00b62f8","cases":30}];
          const m=loadProperNounMatcher(), view={localPersonMap:registry.localPersonMap,canonicalByKnownId:registry.canonicalByKnownId};
          try{
            for(const x of expected.filter(x=>x.key==='songshu/004')){
            const [book,chapter]=x.key.split('/');
            const bytes=fs.readFileSync('data/people/identity-reviews/'+x.key+'.json');assert.equal(createHash('sha256').update(bytes).digest('hex'),x.hash);
            const proof=JSON.parse(bytes), own=loadValidatedPeopleChapter(book,chapter,{properNounMatcher:m}), source=loadCurrentIdentityEvidence(proof,own,m);
            const {memberContract}=await import('./scripts/lib/people-identity-dossiers.mjs');const {localNameKeys}=await import('./scripts/lib/people-resolution.mjs');const {peopleDigest}=await import('./scripts/lib/people-identity-seal.mjs');
            const people=new Map([...source.values()].flatMap(ch=>[...ch.localPeople]));const plans=[proof.plan,...proof.sourcePlans];const issues=[];
            for(const plan of plans)for(const c of plan.cases){const anchor=c.canonicalMembership.anchorLocalId;const member=people.get(anchor);const value=member?peopleDigest(memberContract(member,localNameKeys(member))):null;
            if(value!==c.canonicalMembership.anchorVersion)issues.push({caseId:c.id,anchor,expected:c.canonicalMembership.anchorVersion,observed:value,plan:plan.fingerprint,currentPlan:plan===proof.plan,component:proof.components.filter(x=>x.sourcePlanFingerprint===plan.fingerprint).map(x=>x.id)});}
            assert(issues.length);fs.writeFileSync(OUT+'/songshu-004-anchor-delta.json',JSON.stringify({scope:x.key,source:SOURCE,issues},null,2)+'\n');console.log(JSON.stringify(issues));
            }
          }finally{registry.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-staged-songshu004-anchor-delta
          path: ${{ runner.temp }}/composed-staging/
          if-no-files-found: error
          retention-days: 7
