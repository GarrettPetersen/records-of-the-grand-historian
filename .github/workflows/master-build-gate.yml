name: Certify Qingshigao 152 final identity
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: f271e2d9c5dabfba4fa315fa137cf394fe80dbbe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: qingshigao152-supplemental-editorial-proof
          run-id: 45395579959
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/review-inputs
      - name: Record exact independent native identity certificate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$GITHUB_WORKSPACE/data/people/generated/qingshigao152-native"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          mkdir -p "$OUT" "$(dirname "$REGISTRY")"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          const x={"scope":{"book":"qingshigao","chapter":"152"},"agentId":"bc-46f83c47-f346-4df8-8c80-813d48ba59b6","ownerAgentId":"bc-ffd8c215-a9f0-4a40-9f06-7ccb25982823","runId":"run-6dc40b46-353d-4ff4-b12c-b374c99aadbe","sourcePacketSha256":"ee38c0e196f5c0a3625df74499f693b0ec337af4c7166bdc2a93c0eafdfa8cd1","reportSha256":"f91b2540bbf6260d472919d64153ccb81ee6fbb655495e0526044239db9b4231","reportPath":"research/people/checkpoints/campaign-nov24-editorial-authorship-recovery/qingshigao-152/independent-final-identity.json","reportHead":"fd4ba819cc79b0205166c2c016fccbcc70d8a699","identityCases":10};
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {identityArtifactHash,recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const dir=process.env.RUNNER_TEMP+'/review-inputs/qingshigao-152', out=process.env.OUT;
          const packet=dir+'/source-review-packet.json', report=dir+'/native-source-review.json', job=dir+'/capture.json';
          const p=fs.readFileSync(packet), raw=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+x.reportPath+'?ref='+x.reportHead],{maxBuffer:2e6,timeout:25000});
          assert.equal(identityArtifactHash(p).replace(/^sha256:/u,''),x.sourcePacketSha256.replace(/^sha256:/u,''));
          assert.equal(identityArtifactHash(raw).replace(/^sha256:/u,''),x.reportSha256);
          assert.equal(JSON.parse(p).registryReuse.sourceRevision,process.env.SOURCE);
          fs.writeFileSync(report,raw,{flag:'wx'});
          fs.writeFileSync(job,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:x.scope,agentId:x.agentId,runId:x.runId,authorAgentIds:[x.ownerAgentId],sourcePacketSha256:identityArtifactHash(p),reportSha256:identityArtifactHash(raw)}),{flag:'wx'});
          const r=await recordChapterIdentityReview({packet,report,job,registry:process.env.REGISTRY,out:out+'/qingshigao-152.json'});
          assert(r.nativeIdentityProofAccepted&&r.reviewedCases===x.identityCases);
          fs.writeFileSync(out+'/summary.json',JSON.stringify(r,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qingshigao152-native-identity-certificate
          path: data/people/generated/qingshigao152-native/
          if-no-files-found: error
          retention-days: 7
