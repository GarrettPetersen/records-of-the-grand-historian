name: Validate Qingshigao 152 supplemental editorial decisions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: f271e2d9c5dabfba4fa315fa137cf394fe80dbbe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Validate exact source and prepare final identity review
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$RUNNER_TEMP/qingshigao152-proof"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          mkdir -p "$OUT" "$(dirname "$REGISTRY")"
          test "$(git hash-object data/people/editorial-decisions/qingshigao/152.json)" = d4a3316068decf885ad7e4d46442c503e6f576c0
          npm run people:validate -- --book qingshigao --chapter 152 | tee "$OUT/validation.txt"
          npm run people:dates:verify -- --book qingshigao --chapter 152 --out "$OUT/chronology.json"
          jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$OUT/chronology.json"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const p=await prepareChapterIdentityReview({book:'qingshigao',chapter:'152',sourceRevision:process.env.SOURCE,registry:process.env.REGISTRY,out:process.env.OUT+'/qingshigao-152',transportMaxBytes:384*1024});
          console.log(JSON.stringify(p));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qingshigao152-supplemental-editorial-proof
          path: ${{ runner.temp }}/qingshigao152-proof/
          if-no-files-found: error
          retention-days: 7
