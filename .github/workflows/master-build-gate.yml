name: Prepare already audited chapters across the corpus
run-name: Prepare eleven already audited non-Jinshu identity scopes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Validate and prepare source-pinned identity packets from a shared registry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          root="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          export REGISTRY="$root/$SOURCE"
          mkdir -p "$root" "$RUNNER_TEMP/registry-export" "$RUNNER_TEMP/cohort"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const scopes = ["mingshi/034","songshu/090","houhanshu/001","liaoshi/043","jiuwudaishi/104","nanqishu/060","shiji/064","xinwudaishi/016","liaoshi/106","liaoshi/042","shiji/115"];
          const out = path.join(process.env.RUNNER_TEMP,'cohort');
          const results = [];
          for (const key of scopes) {
            const [book,chapter] = key.split('/');
            try {
              const r = await prepareChapterIdentityReview({book,chapter,sourceRevision:process.env.SOURCE,registry:process.env.REGISTRY,out:path.join(out,book+'-'+chapter),transportMaxBytes:384*1024});
              results.push({key,status:'ready-independent-review',metrics:r.metrics,planFingerprint:r.planFingerprint,reviewParts:r.reviewParts?.length??0,packet:r.sourcePacketSha256});
            } catch (error) {
              results.push({key,status:'held-native-gate',reason:error.message.split('\n')[0]});
            }
          }
          fs.writeFileSync(path.join(out,'cohort-receipts.json'),JSON.stringify(results,null,2)+'\n',{flag:'wx'});
          console.log(JSON.stringify(results));
          assert(results.some(r=>r.status==='ready-independent-review'),'All candidates remain held by native gates');
          JS
          cp "$REGISTRY/manifest.json" "$RUNNER_TEMP/registry-export/manifest.json"
          tar -czf "$RUNNER_TEMP/registry-export/registry.tar.gz" -C "$root" "$SOURCE"
          (cd "$RUNNER_TEMP/registry-export" && sha256sum registry.tar.gz manifest.json > SHA256SUMS)
          test "$(stat -c %s "$RUNNER_TEMP/registry-export/registry.tar.gz")" -le 167772160
      - uses: actions/upload-artifact@v4
        with:
          name: people-registry-${{ env.SOURCE }}
          path: ${{ runner.temp }}/registry-export/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-audited-non-jinshu-identity-evidence
          path: ${{ runner.temp }}/cohort/
          if-no-files-found: error
          retention-days: 7
