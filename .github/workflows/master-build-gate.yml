name: Verify scoped people curation before a production build
run-name: Verify scoped glossary release and preserve already-live chapters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SOURCE: bdc827a0ca3bbaa2f907fc2b8b0ab03841ee6229
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Reconstruct qualified scopes and inspect exact display guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          node --test scripts/test-people-source-only-chronology.mjs
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          export OUT="$RUNNER_TEMP/scoped-curation-preflight"
          mkdir -p "$OUT" data/people/generated/identity-dossiers
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE" > "$OUT/registry-receipt.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {readIdentityDossierRegistry} from './scripts/lib/people-identity-dossier-delta.mjs';
          import {loadProperNounMatcher} from './scripts/lib/people-candidates.mjs';
          import {loadValidatedPeopleChapter} from './scripts/lib/people-validated-chapter.mjs';
          import {loadCurrentIdentityEvidence} from './scripts/lib/people-identity-evidence.mjs';
          import {chapterIdentityInputs,validateChapterIdentityBundle} from './scripts/lib/people-chapter-identity.mjs';
          import {assertChapterGates} from './scripts/lib/people-qualified-scope.mjs';
          import {dateAuditStatus} from './scripts/lib/people-date-audit.mjs';
          import {editorialDecisionPath} from './scripts/lib/people-editorial-decisions.mjs';
          const mustPass=new Set(["beiqishu/006","beiqishu/046","beishi/084","chenshu/023","chenshu/030","hanshu/090","hanshu/091","houhanshu/001","houhanshu/094","houhanshu/117","houhanshu/119","houhanshu/126","jinshi/019","jinshi/023","jinshi/038","jinshi/039","jinshi/043","jinshi/127","jinshu/030","jinshu/031","jinshu/047","jinshu/063","jinshu/081","jinshu/083","jinshu/085","jinshu/094","jinshu/115","jinshu/123","jiutangshu/112","jiutangshu/185","jiuwudaishi/006","jiuwudaishi/007","jiuwudaishi/010","jiuwudaishi/011","jiuwudaishi/012","jiuwudaishi/014","jiuwudaishi/016","jiuwudaishi/020","jiuwudaishi/022","jiuwudaishi/023","jiuwudaishi/024","jiuwudaishi/029","jiuwudaishi/031","jiuwudaishi/037","jiuwudaishi/040","jiuwudaishi/042","jiuwudaishi/050","jiuwudaishi/057","jiuwudaishi/062","jiuwudaishi/063","jiuwudaishi/064","jiuwudaishi/070","jiuwudaishi/073","jiuwudaishi/075","jiuwudaishi/078","jiuwudaishi/086","jiuwudaishi/102","jiuwudaishi/104","jiuwudaishi/105","jiuwudaishi/115","jiuwudaishi/118","jiuwudaishi/120","jiuwudaishi/121","jiuwudaishi/126","jiuwudaishi/127","jiuwudaishi/136","jiuwudaishi/139","jiuwudaishi/144","jiuwudaishi/147","liangshu/007","liangshu/015","liangshu/016","liangshu/017","liangshu/023","liangshu/024","liangshu/029","liangshu/030","liangshu/035","liangshu/037","liangshu/039","liangshu/042","liangshu/043","liangshu/044","liangshu/052","liangshu/055","liaoshi/005","liaoshi/043","liaoshi/107","mingshi/034","nanqishu/008","nanqishu/060","qingshigao/027","qingshigao/047","qingshigao/152","shiji/051","shiji/098","shiji/115","songshu/090","weishu/019","xintangshu/045","xintangshu/052","xintangshu/064","xintangshu/066","xintangshu/183","xinwudaishi/003","xinwudaishi/016","xinwudaishi/019","xinwudaishi/041","yuanshi/207"]);
          import {reviewedInferredSourceReferences} from './scripts/lib/people-inferred-source-references.mjs';
          const {SOURCE,REGISTRY,OUT}=process.env;
          const productPeople=new Map(), allMembers=new Map(), productChapters=[], productCertificates=[];
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const roots='data/people/identity-reviews';
          const match=loadProperNounMatcher();
          const registry=await readIdentityDossierRegistry(REGISTRY,new Map());
          const view={localPersonMap:registry.localPersonMap,canonicalByKnownId:registry.canonicalByKnownId};
          const current=read('data/people/config.json').promptVersion;
          const overrides=read('data/people/curation/overrides.json').people; for(const [id,row] of Object.entries(overrides)){ assert(row.preferredName||row.preferredDescription!==undefined||row.preferredSlug!==undefined,'Invalid people curation override for '+id); }
          const byCanonical=new Map();
          const ready=[],held=[],members=new Map(),findings=[];
          try{
            for(const [id,override] of Object.entries(overrides)){
              const canonical=view.canonicalByKnownId.get(id);
              if(!canonical)continue;
              const current=byCanonical.get(canonical)??[];
              current.push({id,override});
              byCanonical.set(canonical,current);
            }
            for(const book of fs.readdirSync(roots)){
              for(const file of fs.readdirSync(path.join(roots,book)).filter(x=>/^\d{3}\.json$/.test(x))){
                const chapter=file.slice(0,-5), scope={book,chapter}, key=book+'/'+chapter;
                try{
                  const own=loadValidatedPeopleChapter(book,chapter,{properNounMatcher:match});
                  const editorial=editorialDecisionPath(book,chapter);
                  assertChapterGates(own.extraction,current,dateAuditStatus(book,chapter),fs.existsSync(editorial)?read(editorial):null);
                  const bundle=read(path.join(roots,book,file));
                  const evidence=loadCurrentIdentityEvidence(bundle,own,match);
                  const certified=validateChapterIdentityBundle(view,evidence,scope,bundle,chapterIdentityInputs(book,chapter));
                  ready.push({key,cases:certified.retained.length});
                  productChapters.push(own);productCertificates.push(certified);
                  for(const [id,person] of own.localPeople){
                    const canonical=view.localPersonMap.get(id);
                    productPeople.set(id,person);
                    const group=allMembers.get(canonical)??[];group.push(person);allMembers.set(canonical,group);
                    if(!byCanonical.has(canonical))continue;
                    const value=members.get(canonical)??[];
                    value.push({id,key,person});
                    members.set(canonical,value);
                  }
                }catch(error){held.push({key,message:error.message.split('\n')[0]});}
              }
            }
            for(const [id,scoped] of members){
              const entries=byCanonical.get(id);
              if(entries.length>1){findings.push({id,overrideId,field:'override',reason:'Multiple scoped curation overrides',entries:entries.map(x=>x.id)});continue;}
              const {override,id:overrideId}=entries[0];
              if(override.preferredDescription&&!scoped.some(x=>x.person.descriptorSuggestion===override.preferredDescription))findings.push({id,overrideId,field:'preferredDescription',requested:override.preferredDescription,scoped:scoped.map(x=>({localId:x.id,key:x.key,descriptor:x.person.descriptorSuggestion}))});
              if(override.preferredName&&!scoped.flatMap(x=>x.person.claims).some(x=>x.predicate==='name'&&['en','zh','pinyin'].every(k=>!override.preferredName[k]||x.value?.[k]===override.preferredName[k])))findings.push({id,overrideId,field:'preferredName',requested:override.preferredName,scoped:scoped.map(x=>({localId:x.id,key:x.key}))});
            }
          }finally{registry.close();}
          const missing=[...mustPass].filter(x=>!ready.some(y=>y.key===x));
          const report={source:SOURCE,ready,held,findings,missing};
          const checkRefs=blocked=>{
            const pool=new Map([...productPeople].filter(([,p])=>!blocked.has(p.book+'/'+p.chapter)));
            const selected={chapters:productChapters.filter(d=>!blocked.has(d.extraction.book+'/'+d.extraction.chapter)),localPeople:pool};
            const proofs=productCertificates.filter(d=>!blocked.has(d.scope.book+'/'+d.scope.chapter));
            const issues=[];
            for(const [id,rows] of allMembers){
              const members=rows.filter(p=>pool.has(p.localId));
              if(!members.length||members.some(p=>p.mentions.length>0))continue;
              let reason='no-scoped-source-reference';
              try{if(reviewedInferredSourceReferences(members,selected,id,proofs).length>0)continue;}
              catch(e){reason=e.message;}
              issues.push({id,reason,members:members.map(p=>({localId:p.localId,chapter:p.book+'/'+p.chapter,mentionException:p.mentionException??null,nameKinds:p.claims.filter(c=>c.predicate==='name').map(c=>({kind:c.value.kind,certainty:c.certainty,evidence:c.evidence}))}))});
            }
            return issues;
          };
          const referenceIssuesInCandidate=checkRefs(new Set());
          const referenceIssuesWithReserve=checkRefs(new Set());
          report.referenceIssuesInCandidate=referenceIssuesInCandidate;
          report.referenceIssuesWithReserve=referenceIssuesWithReserve;
          fs.writeFileSync(path.join(OUT,'scoped-curation-report.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          assert.equal(missing.length,0,'One or more campaign chapters did not qualify');
          assert.equal(referenceIssuesInCandidate.length,0,'Scoped canonical record lacks supported source references');
          assert.equal(findings.length,0,'Scoped preferred display lacks source support');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-curation-release-preflight
          path: ${{ runner.temp }}/scoped-curation-preflight/
          if-no-files-found: error
          retention-days: 7
