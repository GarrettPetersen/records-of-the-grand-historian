name: Prepare only affected Songshu 004 identity cases
run-name: Reuse independently validated Songshu decisions with current staging evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GH_TOKEN: ${{ github.token }}
      SOURCE: 74bf7b59f83b12050dca2b48e83ca26b99caec3b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: next-audited-glossary-evidence
          run-id: 45336188091
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Reconcile independently approved witnesses with their current accepted source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p data/people/generated/identity-dossiers
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          export OUT="$RUNNER_TEMP/songshu004-changed-witnesses"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {captureIdentityProofComponent} from './scripts/lib/people-identity-proof-composition.mjs';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const pin={"sourcePacketSha256":"1e409f8707eec9854b5f579fb38d859b7d5083ffc57933e222cb496d5574c1ae","transportPath":"research/people/checkpoints/campaign-audited-transport-20261124/songshu-004/transport-packet.json","transportSha256":"f26a1f6a004a656e4132394bca28e42e46b8a6e86fae8285a1db4949639a8672","authorHead":"20ca96bfd47f37bb9174189eded0ad311eb63bdf","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/songshu-004/independent-identity-report.json","evidenceHead":"7ac99498a0ee75cbb9f6a6eae9ff02db8ab63791","reportSha256":"53585e0fd118d2706c7967559f292b099b9f7fe864e1b36dd65dd5990d0b244c","agentId":"bc-4cd17482-e936-451d-b36a-df99d6c7f01b","ownerAgentId":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","runId":"run-7ea8cf08-e89b-4f66-a3ea-c055184985a6"};
          const {SOURCE,REGISTRY,OUT,RUNNER_TEMP,GITHUB_REPOSITORY}=process.env;
          const raw=(p,ref)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+p+'?ref='+ref],{maxBuffer:5e6});
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const original=fs.readFileSync(path.join(RUNNER_TEMP,'original/songshu-004/source-review-packet.json'));
          const originalPrep=JSON.parse(fs.readFileSync(path.join(RUNNER_TEMP,'original/songshu-004/preparation-receipt.json')));
          const transport=raw(pin.transportPath,pin.authorHead),report=raw(pin.reportPath,pin.evidenceHead);
          for(const [b,expected] of [[original,pin.sourcePacketSha256],[transport,pin.transportSha256],[report,pin.reportSha256]])assert.equal(sha(b),expected);
          assert.equal(JSON.parse(report).reviewer.agentId,pin.agentId);
          const prior=JSON.parse(original),scope={book:'songshu',chapter:'004'};
          const input={schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope,agentId:pin.agentId,runId:pin.runId,authorAgentIds:[...new Set([...prior.authorAgentIds,pin.ownerAgentId])],sourcePacketSha256:pin.sourcePacketSha256,reportSha256:pin.reportSha256,transportSha256:pin.transportSha256};
          const captured=captureIdentityProofComponent(original,report,transport,input,originalPrep.transportPolicy);
          const retainedComposition=path.join(RUNNER_TEMP,'songshu-004-original-composition.json');
          fs.writeFileSync(retainedComposition,JSON.stringify({schemaVersion:1,kind:'chapter-identity-review-composition',scope,plan:captured.sourcePlan,sourcePlans:[],components:[captured.component],selections:[]})+'\n');
          const result=await prepareChapterIdentityReview({book:'songshu',chapter:'004',registry:REGISTRY,sourceRevision:SOURCE,retainedComposition,out:OUT,transportMaxBytes:384*1024});
          console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: songshu-004-only-changed-identity-witnesses
          path: ${{ runner.temp }}/songshu004-changed-witnesses/
          if-no-files-found: error
          retention-days: 7
