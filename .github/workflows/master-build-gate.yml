name: Certify partitioned glossary owner reviews
run-name: Certify exact independently reviewed partitioned glossary chapters
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
      SHARD: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
          run-id: 45362321360
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: nov24-current-master-followup-shard-${{ matrix.shard }}
          run-id: 45368520868
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify captures and run the native identity recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          const expected=[{"key":"songshu/062","shard":1,"actor":"bc-9d6043c9-9937-4358-a28f-1640b7492543","run":"run-8e71022c-f90e-4bc1-91b8-cd5da56cba32","owner":"bc-8514e599-6ea4-4fff-9f69-0cc0269184d8","packetSha256":"cbf0b4f64264d6023358db30ed5f54ca1952c0f6c339994ab9c32802ea059962","planFingerprint":"sha256:5dc1cd665512239f24b21b4eb18e438e9ced323e44baab8d4998af4ae285270a","cases":86,"parts":[{"file":"transport-part-001.json","sha256":"753c7bf14855719ecf21d0cff1efc204ac834f06d72a6832880a8c1b48d76eb7"},{"file":"transport-part-002.json","sha256":"35c1d638edabc0a462e5993f57a89b39afd0f5bdd85a09b7c42786eb02d94a88"},{"file":"transport-part-003.json","sha256":"f08158409b7afd784bb86618876b24e2f827d23a8b9d321abb1bd7f3faea0e23"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-current-master-followup-transport/songshu-062/independent-identity-report-part-001.json","blob":"2f2b17aac7f1654945be621e84c52d87bb32716b","sha256":"a7189acab7f518586dd7ae5b8907c65c8dc64706d6eff3674cdc9f310967cf2d","cases":21,"approvals":21,"holds":[]},{"path":"research/people/checkpoints/campaign-nov24-current-master-followup-transport/songshu-062/independent-identity-report-part-002.json","blob":"9af0bc5a1ef46f8384c5e2cfc70513184f6b1e98","sha256":"da350b808e09a1e2bc76177945cee6789e90d5fe26aea352a6f6317291990531","cases":22,"approvals":22,"holds":[]},{"path":"research/people/checkpoints/campaign-nov24-current-master-followup-transport/songshu-062/independent-identity-report-part-003.json","blob":"afbcc4cefec7185165bba881daa77e3b12eafac9","sha256":"8e4d0f70a3cd72d72a8d2a36ed26bfc2558b35cbf9b7b641941e9935eec8db8e","cases":43,"approvals":43,"holds":[]}],"reviewHead":"8238c8e9fef048fc25f9946724d3d22ca061a2ee"},{"key":"jiuwudaishi/054","shard":1,"actor":"bc-bf44d6e1-2942-4c73-bdc6-4644e8041573","run":"run-620b6b64-df47-43d2-9b96-2e29ed5bcc6b","owner":"bc-0fa2c5a7-1dcc-4526-9fd8-172656dd1d79","packetSha256":"e7cc13c22f81268f0f23f5c0a77f7204f8c333b91f954701d6bccf6f068e35b0","planFingerprint