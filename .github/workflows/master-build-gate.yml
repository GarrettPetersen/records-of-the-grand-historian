name: Verify source-only changes before independent proof reconciliation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE: a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Validate exact candidate bytes against native scoped gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync,spawnSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {buildDateAuditPacket,dateAuditStatus} from './scripts/lib/people-date-audit.mjs';
          const expected=[{"receipt":{"key":"jiuwudaishi/017","pr":5597,"runId":"run-61a0b091-6aee-4f0c-b8b6-14f2ea2c38c3","head":"01f5b867ed8b94854b752a27bae7f1fbd9a82f71","path":"research/people/checkpoints/campaign-nov24-current-master-followup-transport/jiuwudaishi-017/source-delta-native-candidate.json","blob":"2fef6e5826913c0b758a7c83a1f464cb9a177e8b","sha256":"379355c0a48c78e90fc09d8afd40223477a9deac5238b552200157871626e9f7","changedInputs":1,"status":"owner-candidate-captured-awaiting-host-validation"},"inputs":[{"path":"data/jiuwudaishi/017.json","blob":"8e8cde95c5ed94d9db99a5235a8e0c1ffa141a38"},{"path":"data/people/extractions/jiuwudaishi/017.json","blob":"22f045e4d5515eec7cd40e0b7c65299f4cf7f696"},{"path":"data/people/date-audits/jiuwudaishi/017.json","blob":"74451e88f14c9a2a30c11e3488e20f016699d290"},{"path":"data/people/editorial-decisions/jiuwudaishi/017.json","blob":"bb521cd9293a24b498eb8c74f78d1d815e8adde6"}]},{"receipt":{"key":"beiqishu/029","pr":5598,"runId":"run-61a0b091-6aee-4f0c-b8b6-14f2ea2c38c3","head":"431162e7c3fbe81361cbaaec52a417e734386873","path":"research/people/checkpoints/campaign-nov24-current-master-followup-transport/beiqishu-029/source-delta-native-candidate.json","blob":"aacf7290284a66a735226a3891e0d87a915545b2","sha256":"d7a58ea1ca0064c56155774385f929f6a90918a8a24e7d444319830404d14579","changedInputs":1,"status":"owner-candidate-captured-awaiting-host-validation"},"inputs":[{"path":"data/beiqishu/029.json","blob":"dcb854c696d765997b643b947d4e6db65825cad4"},{"path":"data/people/extractions/beiqishu/029.json","blob":"5a1c8dc831949e3d4a01234ed9a502d6f60c44f8"},{"path":"data/people/date-audits/beiqishu/029.json","blob":"9394d291230ed6c36f912515dc7b1e7c5cd7be35"},{"path":"data/people/editorial-decisions/beiqishu/029.json","blob":"f09cefe37f42c871eaa1de0a5c6351bc3da35bac"}]},{"receipt":{"key":"chenshu/020","pr":5591,"runId":"run-9bc86c33-fe49-4be6-b716-6030c8663f64","head":"78a8364d5ecf11159e2c4ddf5a6a6a5355f6b934","path":"research/people/checkpoints/campaign-nov24-current-master-followup-transport/chenshu-020/source-delta-native-candidate.json","blob":"ad39be9f6d9036b2c06746858d43548409ff0ce7","sha256":"e5f241e271bfaa50be8fefe39c97890539fbd22a67ad04e2f2c0bca11a7e31f9","changedInputs":1,"status":"owner-candidate-captured-awaiting-host-validation"},"inputs":[{"path":"data/chenshu/020.json","blob":"c9ad7ef20d94a5641600733e83171e497d26032d"},{"path":"data/people/extractions/chenshu/020.json","blob":"23b4a78082b0367aed328a5155196e1e9fed3f27"},{"path":"data/people/date-audits/chenshu/020.json","blob":"a9186a52952d2e162f1fb4bbd9cc7b6ccce2fb68"},{"path":"data/people/editorial-decisions/chenshu/020.json","blob":"0418ddb7e7fd88952f4b89247c578f31fcc0692b"}]},{"receipt":{"key":"jiuwudaishi/068","pr":5614,"runId":"run-d0b49328-d45d-4835-9fa4-4bb51ff73b0b","head":"2c16aa55decaada8133d61aaf1043645b72c3272","path":"research/people/checkpoints/campaign-nov24-current-master-followup-transport/jiuwudaishi-068/source-delta-native-candidate.json","blob":"82280a15cd4965d10efdb4f9dc291cee35381c3f","sha256":"9b0040b2bf9d4fd9370a823ad40549358cc1da8d2af7e9ff78b303f15a6314e0","changedInputs":2,"status":"owner-candidate-captured-awaiting-host-validation"},"inputs":[{"path":"data/jiuwudaishi/068.json","blob":"fe0f26c9a87dc7b459563bcdd94bfecc382d5c4c"},{"path":"data/people/extractions/jiuwudaishi/068.json","blob":"401dd7d9560118917450fc60eda94b489d59c11b"},{"path":"data/people/date-audits/jiuwudaishi/068.json","blob":"8c29df9b708fa74c3b857f76a88e60aad4b71b74"},{"path":"data/people/editorial-decisions/jiuwudaishi/068.json","blob":"a1b00e6e98a92d70fb46542f78aad51daf36d751"}]},{"receipt":{"key":"jiuwudaishi/071","pr":5613,"runId":"run-d0b49328-d45d-4835-9fa4-4bb51ff73b0b","head":"a5549d513532ecff8a07d31282c250b3e2bf5c7f","path":"research/people/checkpoints/campaign-nov24-current-master-followup-transport/jiuwudaishi-071/source-delta-native-candidate.json","blob":"839f545cbbfce3a820e45a9dd1576a37bf3cb735","sha256":"49def43b853e897e27b1dc0b9ad508f242e62d1f28b8ec1e7d3818c114d3e653","changedInputs":1,"status":"owner-candidate-captured-awaiting-host-validation"},"inputs":[{"path":"data/jiuwudaishi/071.json","blob":"3569dbc221c680e9cad6ce581f81afc5ba78cd4b"},{"path":"data/people/extractions/jiuwudaishi/071.json","blob":"5623c14668d6e4bdcb29dc1a2d0d337d7c46c80b"},{"path":"data/people/date-audits/jiuwudaishi/071.json","blob":"9c32366068699e58b488058825c7bc60ce5722f9"},{"path":"data/people/editorial-decisions/jiuwudaishi/071.json","blob":"6d303ba1afd34921399a7257804ea6ee9c3b4c82"}]}];
          const rows=[], hash=b=>createHash('sha256').update(b).digest('hex'), strip=x=>String(x??'').replace(/^sha256:/,'');
          const written=new Map();
          for(const q of expected){
           const {receipt}=q, key=receipt.key, [book,chapter]=key.split('/');
           const row={key,scope:receipt.head,proposal:receipt.sha256};
           try{
            const raw=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+receipt.path+'?ref='+receipt.head],{maxBuffer:3e6});
            if(hash(raw)!==receipt.sha256)throw Error('Owner candidate bytes do not match captured raw digest');
            const d=JSON.parse(raw), files=d.files??d.fileDeltas??[{path:d.candidateExtraction.path,sha256After:d.candidateExtraction.sha256}];
            const allowed=['data/'+key+'.json','data/people/extractions/'+key+'.json'];
            if(!files.length||files.some(x=>!allowed.includes(x.path))||new Set(files.map(x=>x.path)).size!==files.length)throw Error('Patch write scope disagrees');
            const before=buildDateAuditPacket(book,chapter);
            for(const e of files){
              const old=fs.readFileSync(e.path), pinned=q.inputs.find(x=>x.path===e.path);
              const actual=execFileSync('git',['rev-parse','HEAD:'+e.path],{encoding:'utf8'}).trim();
              if(!pinned||pinned.blob!==actual||(e.gitBlobBefore&&e.gitBlobBefore!==actual)||(e.sha256Before&&strip(e.sha256Before)!==hash(old)))throw Error('Current exact input disagrees: '+e.path);
              const digest=strip(e.sha256After??d.candidateExtraction?.sha256);
              const encoded=e.candidateBytesBase64??(d.candidateExtraction?.encoding==='base64'?d.candidateExtraction?.bytes:undefined);
              const doc=d.candidateExtractionDocument;
              const variants=encoded?[Buffer.from(encoded,'base64')]:doc&&e.path===d.candidateExtraction?.path?[JSON.stringify(doc,null,2)+'\n',JSON.stringify(doc,null,2),JSON.stringify(doc)+'\n',JSON.stringify(doc)].map(x=>Buffer.from(x)):[];
              const exact=variants.find(x=>hash(x)===digest);
              if(!exact||exact.equals(old))throw Error('No exact changed candidate bytes match supplied after fingerprint: '+e.path);
              JSON.parse(exact); written.set(e.path,old); fs.writeFileSync(e.path,exact);
            }
            const verify=spawnSync(process.execPath,['scripts/validate-people-data.mjs','--book',book,'--chapter',chapter],{encoding:'utf8',timeout:30000,maxBuffer:500000});
            row.nativeExtractionPassed=verify.status===0&&verify.stdout.includes('Scoped person data validation passed for '+key);
            row.validationResult=[verify.stdout,verify.stderr].filter(Boolean).join('\n').slice(-2200);
            const after=buildDateAuditPacket(book,chapter), compare=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
            row.nativeDateStatus=dateAuditStatus(book,chapter).status;
            row.dateDependencies={sourceHashChanged:before.sourceHash!==after.sourceHash,extractionHashChanged:before.extractionHash!==after.extractionHash,unitsChanged:!compare(before.units,after.units),itemsChanged:!compare(before.items,after.items),peopleChanged:!compare(before.people,after.people),beforeItems:before.items.length,afterItems:after.items.length};
           }catch(e){row.error=e.message;}
           finally{for(const [p,b] of written)fs.writeFileSync(p,b);written.clear();}
           rows.push(row);
          }
          if(execFileSync('git',['status','--porcelain','--untracked-files=no'],{encoding:'utf8'}).trim())throw Error('Temporary source inputs were not restored');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/candidate-source-native-results.json',JSON.stringify(rows,null,2)+'\n');
          console.log(JSON.stringify(rows.map(x=>({key:x.key,passed:x.nativeExtractionPassed,date:x.nativeDateStatus,error:x.error}))));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-source-patch-native-dependencies
          path: ${{ runner.temp }}/candidate-source-native-results.json
          if-no-files-found: error
          retention-days: 7
