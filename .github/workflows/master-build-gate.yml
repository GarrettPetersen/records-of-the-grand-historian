name: Campaign scoped validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - chapter: '067'
            revision: 0b2c2b5169e13489edc3cbfdc4f63779d8e8af71
          - chapter: '116'
            revision: 23084ed3554e8673628fe5903c2253140b53f611
          - chapter: '123'
            revision: 0ebd20b28e489ca9e1a52ff9097091826d8ffb73
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run people:validate -- --book jinshu --chapter ${{ matrix.chapter }}
