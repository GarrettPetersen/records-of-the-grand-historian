name: Prepare scoped identity review for recovered chronology
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: e1767c31496f90b8f757ebf7ea2d526e80ab1a22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Build once and prepare only approved chapter scopes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$RUNNER_TEMP/recovered-chronology-identity"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          mkdir -p "$OUT" "$(dirname "$REGISTRY")"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          const expected=[{"scope":"jiuwudaishi/092","path":"data/people/date-audits/jiuwudaishi/092.json","blob":"0afb6bfb17b48dfc8820a8abb3ecb550bc94a47f"},{"scope":"jiuwudaishi/086","path":"data/people/date-audits/jiuwudaishi/086.json","blob":"4bbe11df066425c098261a153565f14fbacb6e58"},{"scope":"hanshu/002","path":"data/people/date-audits/hanshu/002.json","blob":"4ebaf52c4046000daacefd7ca9242431d14646bd"},{"scope":"jiuwudaishi/010","path":"data/people/date-audits/jiuwudaishi/010.json","blob":"bd5447a1336d57421316103ebff527a16f4706ee"},{"scope":"songshu/004","path":"data/people/date-audits/songshu/004.json","blob":"774f2cc076e66ba21828232d5335e8c17b1735fc","retainedPath":"data/people/identity-reviews/songshu/004.json","retainedBlob":"4e0334c8a1c9322b4195b199969b2d43f1363bce"}];
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const results=[];
          for(const x of expected){
           const [book,chapter]=x.scope.split('/');
           try{
            assert.equal(execFileSync('git',['rev-parse',process.env.SOURCE+':'+x.path],{encoding:'utf8'}).trim(),x.blob);
            if(x.retainedPath)assert.equal(execFileSync('git',['rev-parse',process.env.SOURCE+':'+x.retainedPath],{encoding:'utf8'}).trim(),x.retainedBlob); const result=await prepareChapterIdentityReview({book,chapter,sourceRevision:process.env.SOURCE,registry:process.env.REGISTRY,out:path.join(process.env.OUT,x.scope.replace('/','-')),transportMaxBytes:384*1024,...(x.retainedPath?{retainedComposition:path.resolve(x.retainedPath)}:{})});
            results.push({key:x.scope,status:result.status,receipt:result});
           }catch(e){results.push({key:x.scope,status:'held',reason:e.message});}
          }
          fs.writeFileSync(path.join(process.env.OUT,'summary.json'),JSON.stringify({source:process.env.SOURCE,results},null,2)+'\n');
          console.log(JSON.stringify(results.map(x=>({key:x.key,status:x.status,reason:x.reason,newReviewCases:x.receipt?.newReviewCases}))));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-chronology-identity-packets
          path: ${{ runner.temp }}/recovered-chronology-identity/
          if-no-files-found: error
          retention-days: 7
