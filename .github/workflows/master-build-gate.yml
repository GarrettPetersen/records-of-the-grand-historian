name: Prepare scoped Jinshu 028 chronology change
run-name: Diff the exact repaired Jinshu 028 chronology packet against the accepted audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: 242c8f7ebdae4a022e6e6eebe97fe107e9130dd2
      PRIOR: 288a641a9929f5c6bdfdb0254b026f865d1060ff
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Identify only the changed chronology and attribution evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$RUNNER_TEMP/jinshu028-delta"
          mkdir -p "$OUT"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {buildDateAuditPacket,validateDateAuditReport,dateAuditReferencesCurrent} from './scripts/lib/people-date-audit.mjs';
          const {PRIOR,SOURCE,OUT,GITHUB_REPOSITORY}=process.env;
          const get=(name,ref)=>JSON.parse(execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+name+'?ref='+ref],{maxBuffer:12e6}));
          const oldExtraction=get('data/people/extractions/jinshu/028.json',PRIOR);
          const before=buildDateAuditPacket('jinshu','028',{extraction:oldExtraction}), after=buildDateAuditPacket('jinshu','028');
          const accepted=get('data/people/date-audits/jinshu/028.json',PRIOR);
          assert.equal(accepted.status,'audited');
          assert.equal(accepted.findings.length,0);
          validateDateAuditReport(accepted,before);
          assert(dateAuditReferencesCurrent(accepted));
          assert.equal(before.sourceHash,after.sourceHash);
          assert.deepEqual(before.units,after.units);
          const identity=item=>item.claimHash??item.id;
          const map=items=>{const m=new Map(items.map(i=>[identity(i),i]));assert.equal(m.size,items.length,'Duplicate date claim identity');return m;};
          const earlier=map(before.items), now=map(after.items);
          const semantics=({claimIndex,id,...rest})=>rest;
          const retained=[], changed=[], removed=[];
          for(const [k,item] of now){
            const old=earlier.get(k);
            if(!old||JSON.stringify(semantics(old))!==JSON.stringify(semantics(item)))changed.push({before:old??null,after:item});
            else retained.push({previousId:old.id,currentId:item.id,personId:item.personId});
          }
          for(const [k,item] of earlier)if(!now.has(k))removed.push(item);
          const changedPeople=[...new Set([...before.people.map(i=>i.id),...after.people.map(i=>i.id)])].flatMap(id=>{
            const old=before.people.find(p=>p.id===id)??null, next=after.people.find(p=>p.id===id)??null;
            return JSON.stringify(old)===JSON.stringify(next)?[]:[{id,before:old,after:next}];
          });
          const changedUnits=before.units.filter(u=>JSON.stringify([...before.unitPeople[u.id]].sort())!==JSON.stringify([...after.unitPeople[u.id]].sort())).map(u=>({...u,before:before.unitPeople[u.id],after:after.unitPeople[u.id]}));
          const nearby=after.units.filter(u=>Math.abs(Number(u.id.slice(1))-341)<=6||u.id==='s0182');
          const summary={source:SOURCE,prior:PRIOR,acceptedReviewer:accepted.reviewer,sourceHash:after.sourceHash,previousExtractionHash:before.extractionHash,currentExtractionHash:after.extractionHash,retained,changed,removed,changedPeople,changedUnits,nearby};
          fs.writeFileSync(path.join(OUT,'exact-chronology-delta.json'),JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify({retained:retained.length,changed:changed.map(i=>i.after.id),removed:removed.map(i=>i.id),changedPeople:changedPeople.map(i=>i.id),changedUnits:changedUnits.map(i=>i.id)}));
          JS
          npm run people:validate -- --book jinshu --chapter 028
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-028-chronology-delta-evidence
          path: ${{ runner.temp }}/jinshu028-delta/
          if-no-files-found: error
          retention-days: 7
