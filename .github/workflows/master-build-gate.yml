name: Campaign scoped validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-jinshu-047:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc6a726b7f763f7f4f54f3b95318074a0af7569b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run people:validate -- --book jinshu --chapter 047
