name: Verify Songshu 004 with current staging witnesses
run-name: Check the unchanged Songshu 004 proof against current Jinshu witnesses
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 74bf7b59f83b12050dca2b48e83ca26b99caec3b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Validate the exact scope and external review witnesses
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          mkdir -p data/people/generated/identity-dossiers "$RUNNER_TEMP/songshu-004"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          export OUT="$RUNNER_TEMP/songshu-004"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE" > "$OUT/registry-receipt.json"
          npm run people:validate -- --book songshu --chapter 004 | tee "$OUT/validation.txt"
          npm run people:dates:verify -- --book songshu --chapter 004 --out "$OUT/date.json"
          jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$OUT/date.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {readIdentityDossierRegistry} from './scripts/lib/people-identity-dossier-delta.mjs';
          import {loadProperNounMatcher} from './scripts/lib/people-candidates.mjs';
          import {loadValidatedPeopleChapter} from './scripts/lib/people-validated-chapter.mjs';
          import {loadCurrentIdentityEvidence} from './scripts/lib/people-identity-evidence.mjs';
          import {chapterIdentityInputs,validateChapterIdentityBundle} from './scripts/lib/people-chapter-identity.mjs';
          const {SOURCE,REGISTRY,OUT}=process.env;
          const bundle=JSON.parse(fs.readFileSync('data/people/identity-reviews/songshu/004.json'));
          const scope={book:'songshu',chapter:'004'};
          const m=loadProperNounMatcher();
          const own=loadValidatedPeopleChapter('songshu','004',{properNounMatcher:m});
          const evidence=loadCurrentIdentityEvidence(bundle,own,m);
          const registry=await readIdentityDossierRegistry(REGISTRY,new Map());
          try{
            const result=validateChapterIdentityBundle({localPersonMap:registry.localPersonMap,canonicalByKnownId:registry.canonicalByKnownId},evidence,scope,bundle,chapterIdentityInputs('songshu','004'));
            assert.equal(result.retained.length,bundle.plan.cases.length);
            fs.writeFileSync(OUT+'/semantic-proof.json',JSON.stringify({source:SOURCE,scope,reviewer:bundle.receipt.actualReviewerAgentId,plan:bundle.plan.fingerprint,retained:result.retained.length})+'\n');
          }finally{registry.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: songshu-004-staging-semantic-proof
          path: ${{ runner.temp }}/songshu-004/
          if-no-files-found: error
          retention-days: 7
