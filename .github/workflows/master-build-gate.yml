name: Certify partitioned glossary owner reviews
run-name: Certify exact independently reviewed partitioned glossary chapters
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      SHARD: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: retained-split-glossary-shard-${{ matrix.shard }}
          run-id: 45356094482
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify captures and run the native identity recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          const expected=[{"key":"hanshu/098","shard":1,"actor":"bc-ae54a551-9c9a-432e-ab5b-8bbf73737b2d","run":"run-ef3d11b4-3302-40d3-8653-a37c78d26bef","owner":"bc-57d78b4f-f75f-42da-927e-a8e87fa358e5","packetSha256":"a8f92d200841fff8b0cedbb450a2dfcc621bae6bc84d35eb282cb36a1978dc6c","planFingerprint":"sha256:bc082a1c9b4cfb913a444d84761e24f6ffe2c1ca9e17da558f4b3d136670e8e4","cases":53,"parts":[{"file":"transport-part-001.json","sha256":"8764e3fad7fcb28727ee7cc8fe538962026f3c38a2b03fa81aa9f4e5235418bd"},{"file":"transport-part-002.json","sha256":"2dd4faed2764a3c6570e62d771c01b3fd77544ff0077010dc37b736c7769ac0c"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/hanshu-098/independent-identity-report-part-001.json","blob":"6e0e6da6ce4143f3218211f33b61b820e0251aee","sha256":"deef84b62c78236243a7c44ce54154190bf252d3a4f149ae78c1bfd7fcca325d","cases":26,"approvals":26,"holds":[]},{"path":"research/people/checkpoints/campaign-nov24-split-transport/hanshu-098/independent-identity-report-part-002.json","blob":"57646e25d0f40b086fbcaf9935556c11bf100971","sha256":"a0bc2cf3d3c54858fc5ee4d457905268ce6703d59547aa98ea018a1f8ba7e9ca","cases":27,"approvals":27,"holds":[]}],"reviewHead":"980bc372906e6adfa3650b8434563b2b2bc1d56e"},{"key":"jiuwudaishi/006","shard":2,"actor":"bc-dcb9944a-2fae-4b27-bdb9-1d81a36c126b","run":"run-55ea5a31-8f33-4378-b532-b571defdc6bd","owner":"bc-3001456e-15de-4e26-b1ca-973d0009ec2d","packetSha256":"8a6baed3076f958fa84930049217a8b83e6164cf1086a44558f93596b289335a","planFingerprint":"sha256:c001161ae813addcc7b86ebaed0ce5f4bd8b799d5528f3d00cbe10c91166c607","cases":58,"parts":[{"file":"transport-part-001.json","sha256":"bc2447556db3d383c0c916a443dd45b4a27fefdeccb0b6461434fffd73b8e913"},{"file":"transport-part-002.json","sha256":"71e227b59609abd91bb219b0687a5a6b00784c02273cfb75d3347204347e1f5c"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/jiuwudaishi-006/independent-identity-report-part-001.json","blob":"f72c2ff3affb9d2ad471ea81645fbb24722f9f98","sha256":"416daff3cd489fd641ec5704ac92785ae4aac0928ebd929b501b6364045c9e4e","cases":29,"approvals":29,"holds":[]},{"path":"research/people/checkpoints/campaign-nov24-split-transport/jiuwudaishi-006/independent-identity-report-part-002.json","blob":"f5f9d6b34f33f1e696ff6bc14b92b3c8943f8862","sha256":"49e4712bf4d14ed49a93527a413a8258f2cd7312fc31793915f7ee140db76989","cases":29,"approvals":29,"holds":[]}],"reviewHead":"bfd69d3e6626bd8974000d6b3b19abb3762b11b5"}];
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {identityArtifactHash,recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          import {assembleChapterIdentityReviewParts,identityReviewTransportPolicy} from './scripts/lib/people-identity-review-transport.mjs';
          const tmp=process.env.RUNNER_TEMP, registry=path.join(tmp,'registry',process.env.SOURCE);
          const output=path.join(process.cwd(),'data/people/generated/nov24-partitioned-validation');
          fs.mkdirSync(output,{recursive:true});
          const readRemote=(file,revision)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+file+'?ref='+revision],{maxBuffer:3e6,timeout:20000});
          const results=[];
          for(const j of expected.filter(y=>y.shard===Number(process.env.SHARD))){
            try{
              const id=j.key.replace('/','-'), dir=path.join(tmp,'packets',id);
              const packet=path.join(dir,'source-review-packet.json'), p=fs.readFileSync(packet), data=JSON.parse(p);
              const hash=b=>identityArtifactHash(b).replace(/^sha256:/u,'');
              assert.equal(hash(p),j.packetSha256.replace(/^sha256:/u,''));
              assert.equal(data.plan.fingerprint,j.planFingerprint);
              assert.equal(data.registryReuse.sourceRevision,process.env.SOURCE);
              assert(!data.authorAgentIds.includes(j.actor)&&j.owner!==j.actor);
              const parts=[],transports=[],reports=[];
              for(const [i,part] of j.parts.entries()){
                const transportFile=path.join(dir,part.file),b=fs.readFileSync(transportFile);
                const report=j.reports[i], reportFile=path.join(dir,'actual-report-'+(i+1)+'.json'), d=readRemote(report.path,j.reviewHead);
                assert.equal(hash(b),part.sha256.replace(/^sha256:/u,''));
                assert.equal(hash(d),report.sha256);
                const rawReport=JSON.parse(d);
                assert.equal(rawReport.reviewer.agentId,j.actor);
                assert(rawReport.reviews.every(x=>x.verdict==='approve'));
                fs.writeFileSync(reportFile,d,{flag:'wx'});
                transports.push(JSON.parse(b));reports.push(rawReport);
                parts.push({schemaVersion:1,kind:'captured-independent-identity-review-part',phase:'report-recorded',agentId:j.actor,runId:j.run,sourcePacketSha256:identityArtifactHash(p),transportSha256:identityArtifactHash(b),reportSha256:identityArtifactHash(d),transportFile,reportFile});
              }
              const aggregated=assembleChapterIdentityReviewParts(data.plan,transports,reports,parts.map(x=>x.agentId),data.authorAgentIds,data.reviewCaseIds);
              assert.equal(aggregated.reviews.length,j.cases);
              const report=path.join(dir,'actual-aggregate.json'), job=path.join(dir,'actual-job.json');
              const aggregateBytes=Buffer.from(JSON.stringify(aggregated)+'\n');
              fs.writeFileSync(report,aggregateBytes,{flag:'wx'});
              fs.writeFileSync(job,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review-parts',phase:'report-recorded',scope:data.scope,agentId:j.actor,runId:j.run,authorAgentIds:[j.owner],sourcePacketSha256:identityArtifactHash(p),reportSha256:identityArtifactHash(aggregateBytes),transportPolicy:identityReviewTransportPolicy(384*1024),parts})+'\n',{flag:'wx'});
              const receipt=await recordChapterIdentityReview({packet,report,job,registry,out:path.join(output,id+'.json')});
              results.push({key:j.key,receipt});
            }catch(e){results.push({key:j.key,error:e.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results.map(x=>({key:x.key,native:x.receipt?.nativeIdentityProofAccepted,error:x.error}))));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-partitioned-tail-proof-${{ matrix.shard }}
          path: data/people/generated/nov24-partitioned-validation/
          if-no-files-found: error
          retention-days: 7
