name: Certify cross-corpus identity reports
run-name: recovered-native-certify-second
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: next-audited-glossary-evidence
          run-id: 45336188091
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify review bytes and apply the canonical recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          const expected=[{"key":"qingshigao/120","agentId":"bc-7d924c3e-6338-4a3e-ba11-52388f267617","runId":"run-f45dce8a-9d7d-4fd1-800f-d600e9cb7200","owner":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","packetSha256":"aab0d34fca60d6a34a5c1e5372a8cca38ca1e349bb05a6e6f054c27613d0e98e","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/qingshigao-120/independent-identity-report.json","evidenceHead":"05b285156dc12ab926e205f884e12a8897d35430","reportSha256":"7ef5dbd964d18f9e963806d0e789a4d164659873db7e9fe6da1f702c32af27ef","cases":3},{"key":"liangshu/008","agentId":"bc-5c1d9063-5a82-4be2-90d6-08cd90298ca8","runId":"run-aa7c9af4-44b2-4464-95de-7ef18f5a30c2","owner":"bc-5782b067-a4f3-49a7-936b-07d6064d1de5","packetSha256":"4beb3f72d592abc413ac5f405d85f66f504aeb063f90b10cae19123ed2b3110f","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liangshu-008/independent-identity-report.json","evidenceHead":"4e546d031f6784fbdd19d664648a080242df5676","reportSha256":"db39592a609c1abfe36dac3f475501f3a8e6aa2d2ac84dd85b2bef19ea1eea70","cases":26},{"key":"xinwudaishi/020","agentId":"bc-aa83281c-5ba5-4371-a97d-38e4ceb65a73","runId":"run-e870aaac-f79c-4764-885b-f3c823116cfa","owner":"bc-5782b067-a4f3-49a7-936b-07d6064d1de5","packetSha256":"ae6327e29bf6b9754489c997b600b8f51b60f6182d348200f7959c5f46e8e50d","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/xinwudaishi-020/independent-identity-report.json","evidenceHead":"83e73d5a05e6e8c8c0893ef5520bc4bfb36d0df4","reportSha256":"d30dcd554714095c804dc6ca3f04e00d38f09f3507ed6639d25951c29daad9f9","cases":31},{"key":"liangshu/023","agentId":"bc-9509a5c7-8ebf-43c2-9313-fc0594148d26","runId":"run-aff7c49c-1f0b-4243-b138-6beab4a0be7c","owner":"bc-0eb589e8-bd06-4e8c-bf58-1afc35d46126","packetSha256":"eff30ac4708033f7452ce9830420f9480631c256b2cbb6eb98834517015d12fb","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/liangshu-023/independent-identity-report.json","evidenceHead":"7faefea0e3b527904a905227ba0928b5cfbe0e7b","reportSha256":"d2e54179390957907c26856e8d44f8c9313e3015a06aa35be436130ac65c4b74","cases":35},{"key":"xintangshu/012","agentId":"bc-633e0883-fd3f-4215-b764-d30fea93e045","runId":"run-b6027a6a-8e58-487d-91e5-66458dd37938","owner":"bc-a1d9fb49-57cd-49f8-a504-e22bc5dcc56f","packetSha256":"ea3c2b851b5dc8f7ee8a5219ab02d85e502b77d8a65b0227e9d98856ef4ab4ff","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/xintangshu-012/independent-identity-report.json","evidenceHead":"a604e50c6a58f82e663f7200a4bd661399031228","reportSha256":"9ee70942386e57e2cb920f8c91a1797c68685dde57000277a2c5cc755fe7c8d7","cases":36},{"key":"songshu/096","agentId":"bc-e596112f-a8c7-44d7-ae09-074032992c58","runId":"run-2e3d7443-0ace-4941-8563-84ea19426053","owner":"bc-fe43ebdf-900b-4477-abde-dd6496d385a0","packetSha256":"b3c150e3fb5bd73fbdf9f493ef897e6eb56578a426ff6a833f67db173654af9a","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/songshu-096/independent-identity-report.json","evidenceHead":"4d5d285f1fb2f2d24762bd63418ec52d5bba0642","reportSha256":"3db22fda564fddbd6b54d5590b592056af2e7bffa261202c98ec35314b3efe05","cases":40},{"key":"houhanshu/126","agentId":"bc-5928d86b-2d31-4ab9-a836-f82ffd487442","runId":"run-5eb3735b-f1b1-4eb2-a8a0-c55e67f4ae4b","owner":"bc-5782b067-a4f3-49a7-936b-07d6064d1de5","packetSha256":"7a156518e7477cd6b49261f69a58fc718ba8f8aa15d00905e6a281ca72d955ae","reportPath":"research/people/checkpoints/campaign-audited-transport-20261124/houhanshu-126/independent-identity-report.json","evidenceHead":"f8994d75f75b338b5b77429e5f0a56cdd09cd91b","reportSha256":"d2fd00f9626552af84ca34471402f0fa35ad2fa0b6fbcefc25661274547b19c5","cases":41}];
          const tmp=process.env.RUNNER_TEMP;
          const output=path.join(process.cwd(),'data/people/generated/cross-corpus-certification');
          const results=[];
          fs.mkdirSync(output,{recursive:true});
          const hash=(bytes)=>createHash('sha256').update(bytes).digest('hex');
          for(const job of expected){
            try{
              const [book,chapter]=job.key.split('/');
              const id=book+'-'+chapter;
              const packet=path.join(tmp,'packets',id,'source-review-packet.json');
              const packetBytes=fs.readFileSync(packet);
              const review=path.join(tmp,id+'-report.json');
              const captured=path.join(tmp,id+'-captured.json');
              assert.equal(hash(packetBytes),job.packetSha256);
              const report=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+job.reportPath+'?ref='+job.evidenceHead]);
              assert.equal(hash(report),job.reportSha256);
              const data=JSON.parse(report);
              assert.equal(data.reviews.length,job.cases);
              assert(data.reviews.every(x=>x.verdict==='approve'));
              assert.equal(data.reviewer.agentId,job.agentId);
              const previous=JSON.parse(packetBytes).authorAgentIds;
              assert(Array.isArray(previous)&&!previous.includes(job.agentId)&&job.owner!==job.agentId);
              fs.writeFileSync(review,report,{flag:'wx'});
              fs.writeFileSync(captured,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review',phase:'report-recorded',scope:{book,chapter},agentId:job.agentId,runId:job.runId,authorAgentIds:[...new Set([...previous,job.owner])],sourcePacketSha256:job.packetSha256,reportSha256:job.reportSha256})+'\n',{flag:'wx'});
              const receipt=await recordChapterIdentityReview({packet,report:review,job:captured,registry:path.join(tmp,'registry',"110c2f92a0e7994af8d9218f76c80ccd72b98d5c"),out:path.join(output,id+'.json')});
              results.push({key:job.key,receipt});
            }catch(error){results.push({key:job.key,error:error.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-native-certify-second-evidence
          path: data/people/generated/cross-corpus-certification/
          if-no-files-found: error
          retention-days: 7
