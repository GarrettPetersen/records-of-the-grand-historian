name: Compose retained Jiuwudaishi 062 identity proofs
run-name: Validate 89 retained and 3 current independent identity witnesses
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 57bdc83bcd75958a6de1a0fab6774b6eb466e8d7
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: nov24-cross-chapter-context-delta-packets
          run-id: 45423972876
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/proof
      - name: Compose the exact retained and current native review
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$GITHUB_WORKSPACE/data/people/generated/jiuwudaishi062-native"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          mkdir -p "$OUT" "$(dirname "$REGISTRY")"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {identityArtifactHash,recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';
          import {assembleChapterIdentityReviewParts} from './scripts/lib/people-identity-review-transport.mjs';
          const x={"scope":{"book":"jiuwudaishi","chapter":"062"},"agentId":"bc-bf6eb42f-69fb-4ab4-ab8a-2636227d348c","ownerAgentId":"bc-977db51c-ec93-4d60-9d14-c6f7f3527c76","runId":"run-d3b06a04-ca3a-4698-876c-12b260604900","reportHead":"93707e82f9eaf56393cc2bc2cbf47b4ad90b1b44","reportPath":"research/people/checkpoints/campaign-nov24-cross-chapter-witness/jiuwudaishi-062/independent-changed-evidence.json","reportSha":"dc1d00ae79d5faf0207983aa877d798bfeb46aea6bfde06189ead8e943215dc8","transportSha":"0cead44a046029b1dcda1051385fd95374f20af150d4450ac540d9db77bfbe8c","packetSha":"3359420fde85131da68e686a68e7f0dff7c8e78e41a84014ef9e3e0db6684ce3","source":"57bdc83bcd75958a6de1a0fab6774b6eb466e8d7","priorCases":89,"caseIds":["sha256:7a1f2540742cad40d7dab2d55090925f3ea88454f057e339554c3d0c6de992fa","sha256:e0839ec3c9ca0beb75449657ffd8f702617a282bfbef5a81916de996ab611564","sha256:cd224ef1309980653e03564d11560121e84e47f019bd6a2dacd44290b56f449e"]};
          const dir=process.env.RUNNER_TEMP+'/proof/jiuwudaishi-062', packet=dir+'/source-review-packet.json', transportFile=dir+'/transport-part-001.json', reportFile=dir+'/independent-delta.json', aggregate=dir+'/aggregate-delta.json', job=dir+'/capture.json';
          const p=fs.readFileSync(packet), t=fs.readFileSync(transportFile), d=JSON.parse(p), transport=JSON.parse(t);
          const raw=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+x.reportPath+'?ref='+x.reportHead],{maxBuffer:2e6,timeout:25000});
          assert.equal(identityArtifactHash(p),x.packetSha); assert.equal(identityArtifactHash(t),x.transportSha); assert.equal(identityArtifactHash(raw),x.reportSha); assert.equal(d.registryReuse.sourceRevision,x.source);
          const {schemaVersion,planFingerprint,reviewer,reviews}=JSON.parse(raw), response={schemaVersion,planFingerprint,reviewer,reviews}, nativeRaw=Buffer.from(JSON.stringify(response)+'\n'); const normalized=assembleChapterIdentityReviewParts(d.plan,[transport],[response],[x.agentId],d.authorAgentIds,d.reviewCaseIds);
          const aggregateBytes=Buffer.from(JSON.stringify(normalized)+'\n');
          const common={schemaVersion:1,phase:'report-recorded',scope:x.scope,agentId:x.agentId,runId:x.runId,sourcePacketSha256:identityArtifactHash(p)};
          const part={...common,kind:'captured-independent-identity-review-part',transportFile,reportFile,transportSha256:identityArtifactHash(t),reportSha256:identityArtifactHash(nativeRaw)};
          fs.writeFileSync(reportFile,nativeRaw,{flag:'wx'}); fs.writeFileSync(aggregate,aggregateBytes,{flag:'wx'}); fs.writeFileSync(job,JSON.stringify({...common,kind:'captured-independent-identity-review-parts',authorAgentIds:[x.ownerAgentId],transportPolicy:JSON.parse(fs.readFileSync(dir+'/preparation-receipt.json')).transportPolicy,reportSha256:identityArtifactHash(aggregateBytes),parts:[part]}),{flag:'wx'});
          const result=await recordChapterIdentityReview({packet,report:aggregate,job,registry:process.env.REGISTRY,out:process.env.OUT+'/jiuwudaishi-062.json'});
          assert.equal(result.reviewedCases,x.priorCases+x.caseIds.length); assert.equal(result.nativeIdentityProofAccepted,true); fs.writeFileSync(process.env.OUT+'/summary.json',JSON.stringify({result,capture:x},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-jiuwudaishi062-native-composed-identity
          path: data/people/generated/jiuwudaishi062-native/
          if-no-files-found: error
          retention-days: 7
