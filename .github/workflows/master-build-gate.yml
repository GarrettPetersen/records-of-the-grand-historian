      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: nov24-four-part-audited-chapter-packets
          run-id: 45405684667
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
