name: Prepare only changed Jinshu 028 identity evidence
run-name: Reconcile 390 preserved independent identity decisions after the narrow source repair
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      GH_TOKEN: ${{ github.token }}
      SOURCE: f76083ba3743da9866c9c103468be6e076e3ab79
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: jinshu-028-native-identity-evidence
          run-id: 45336367838
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-jinshu028
      - name: Capture original independent results and revalidate unchanged proof
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          export OUT="$RUNNER_TEMP/jinshu028-reconciled-identity"
          mkdir -p data/people/generated/identity-dossiers
          npm run people:dates:verify -- --book jinshu --chapter 028 --out "$RUNNER_TEMP/current-jinshu028-date.json"
          jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$RUNNER_TEMP/current-jinshu028-date.json"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {captureIdentityProofComponent} from './scripts/lib/people-identity-proof-composition.mjs';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const pin={"sourcePacketSha256":"2c9283724bc14ada5a5f8eb27d8a5d878b4d93ba12d1659a0057c91e97874847","plan":"sha256:c8620da2879ac1eb1bd68844e8aaca8cdb363ab1669f250b35e51becc241da2a","parts":[{"file":"transport-part-001.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-001.result.json","evidence":"a8d928e8d35056a7535d7b1b66d191ebfa314a00","sha256":"f1194ba7cf9536ce5c7fd86e46bd36448f2d092a5a81f7387be87e269d96f5c9","cases":6,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-b44a742b-db94-4532-acd7-d68cac6b9999"},{"file":"transport-part-002.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-002.result.json","evidence":"a8d928e8d35056a7535d7b1b66d191ebfa314a00","sha256":"e8fbf2e8092796a790743e48364a7f6a01f2af563f8fc744f9235580510398f5","cases":6,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-b44a742b-db94-4532-acd7-d68cac6b9999"},{"file":"transport-part-003.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-003.result.json","evidence":"a8d928e8d35056a7535d7b1b66d191ebfa314a00","sha256":"f813b62cb318f0ecf7de652ad84be357428eca27bafd8b482dbdc22e1a3173b2","cases":12,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-b44a742b-db94-4532-acd7-d68cac6b9999"},{"file":"transport-part-004.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-004.result.json","evidence":"79b58f0c95314a14900bb322a1a237071f0ec9e2","sha256":"2a1e4d907c5f3211067d6134ad1c9923d76e7ee633570ac86042130a84b0b134","cases":12,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-2f8ad9f1-bf6a-4e9c-abbf-b8f098a06166"},{"file":"transport-part-005.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-005.result.json","evidence":"79b58f0c95314a14900bb322a1a237071f0ec9e2","sha256":"0964ebf27693faf2b23c86d3b5acafbb4619ec24767b9082a246ae1070ff1e00","cases":12,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-2f8ad9f1-bf6a-4e9c-abbf-b8f098a06166"},{"file":"transport-part-006.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-006.result.json","evidence":"79b58f0c95314a14900bb322a1a237071f0ec9e2","sha256":"087a7d9b51b4003a0d4d2b8502cca07afe91a63355154e64df7ce2f2b66d6fb2","cases":24,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-2f8ad9f1-bf6a-4e9c-abbf-b8f098a06166"},{"file":"transport-part-007.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-007.result.json","evidence":"79b58f0c95314a14900bb322a1a237071f0ec9e2","sha256":"d8ce9b3377ea4a08f8636ddf7a39627fdcdd6a505bd5c4eb9040af00142d41d9","cases":25,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-2f8ad9f1-bf6a-4e9c-abbf-b8f098a06166"},{"file":"transport-part-008.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-008.result.json","evidence":"79b58f0c95314a14900bb322a1a237071f0ec9e2","sha256":"11cceabd681c3cfd4b43bec0eccb2a907ae597fd7393a94008dd7484c0c5aecf","cases":24,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-2f8ad9f1-bf6a-4e9c-abbf-b8f098a06166"},{"file":"transport-part-009.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-009.result.json","evidence":"79b58f0c95314a14900bb322a1a237071f0ec9e2","sha256":"d7f230decbe541dfa11026da88e16df62e621cf706e5f20ae1720a8f1c537e94","cases":25,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-2f8ad9f1-bf6a-4e9c-abbf-b8f098a06166"},{"file":"transport-part-010.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-010.result.json","evidence":"9c8b3ee9a08b8382f448e07efccf19f28a6637ca","sha256":"d9d7e5a6dceee3279003b325dd36e3a7cb149f79ec8385b13567e2bfb8ef6a1d","cases":24,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-1fd304b2-f7e1-4cca-988c-d4864e6313dd"},{"file":"transport-part-011.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-011.result.json","evidence":"9c8b3ee9a08b8382f448e07efccf19f28a6637ca","sha256":"c9fd5b64dc57e7ca53b80e645e0d2a5fd23663a64fcc683f40e31a0309a0fce0","cases":25,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-1fd304b2-f7e1-4cca-988c-d4864e6313dd"},{"file":"transport-part-012.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-012.result.json","evidence":"9c8b3ee9a08b8382f448e07efccf19f28a6637ca","sha256":"bfe60fc879f362effdec84458220df11e0158340e1aa9e77427f7ecf1a0ba396","cases":24,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-1fd304b2-f7e1-4cca-988c-d4864e6313dd"},{"file":"transport-part-013.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-013.result.json","evidence":"9c8b3ee9a08b8382f448e07efccf19f28a6637ca","sha256":"affa52c6c842938148ab5c29da866485d5ead524b147cfc360053a2e074bc644","cases":24,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-1fd304b2-f7e1-4cca-988c-d4864e6313dd"},{"file":"transport-part-014.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-014.result.json","evidence":"9c8b3ee9a08b8382f448e07efccf19f28a6637ca","sha256":"f1bf55100cf78003f7934a5d25b224860caf31f56a1b4915f1ef973af7d3f0c7","cases":24,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-1fd304b2-f7e1-4cca-988c-d4864e6313dd"},{"file":"transport-part-015.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-015.result.json","evidence":"9c8b3ee9a08b8382f448e07efccf19f28a6637ca","sha256":"c8187e8edb3caef0c7684591f35627f574eddb17b7fb7ea34a4b731ee7c0060f","cases":25,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-1fd304b2-f7e1-4cca-988c-d4864e6313dd"},{"file":"transport-part-016.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-016.result.json","evidence":"e51b06305256e24ae3bd138e454668db663f0355","sha256":"3185cae79ebdb8af6d04bcf35b6e643d242188ab7784574906b0acbbde2a488d","cases":24,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-e2527263-79c6-41b6-be0f-b03458ca8e8c"},{"file":"transport-part-017.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-017.result.json","evidence":"e51b06305256e24ae3bd138e454668db663f0355","sha256":"3cd48cdf887861415de37ec49335d84d1ca33bbd0d3b08e05a56bbf64b9aa561","cases":25,"holds":["sha256:0c1bce807f648559c9926c540cb7d04ced4dde073dbdacc9e2852652d217042a"],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-e2527263-79c6-41b6-be0f-b03458ca8e8c"},{"file":"transport-part-018.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-018.result.json","evidence":"e51b06305256e24ae3bd138e454668db663f0355","sha256":"a4f02c6b9705d8acc9e03fb6b0a06a384e8d66eef7288f12ce3b9f2c8a59b682","cases":24,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-e2527263-79c6-41b6-be0f-b03458ca8e8c"},{"file":"transport-part-019.json","path":"research/people/checkpoints/jinshu028-split-native-identity-20261124/part-019.result.json","evidence":"e51b06305256e24ae3bd138e454668db663f0355","sha256":"d65c4691dbb187f6fb81f98202782eaadf0cf4e983f1fa87603852477b61e967","cases":25,"holds":[],"agentId":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","runId":"run-e2527263-79c6-41b6-be0f-b03458ca8e8c"}],"reviewer":"bc-0dff1b5a-cee1-497c-a682-50af5e1e208b","hold":"sha256:0c1bce807f648559c9926c540cb7d04ced4dde073dbdacc9e2852652d217042a"};
          const {SOURCE,OUT,REGISTRY,RUNNER_TEMP,GITHUB_REPOSITORY}=process.env;
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const old=path.join(RUNNER_TEMP,'original-jinshu028');
          const packetBytes=fs.readFileSync(path.join(old,'source-review-packet.json'));
          const packet=JSON.parse(packetBytes), receipt=JSON.parse(fs.readFileSync(path.join(old,'preparation-receipt.json')));
          assert.equal(hash(packetBytes),pin.sourcePacketSha256);
          assert.equal(packet.plan.fingerprint,pin.plan);
          assert.equal(packet.plan.cases.length,390);
          assert.equal(receipt.reviewParts.length,19);
          assert(!packet.authorAgentIds.includes(pin.reviewer));
          const scope={book:'jinshu',chapter:'028'}, retained=[], capturedRows=[];
          for(const j of pin.parts){
            const sealed=receipt.reviewParts.find(p=>p.file===j.file);
            const partBytes=fs.readFileSync(path.join(old,j.file));
            assert.equal(hash(partBytes),sealed.sha256);
            const result=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+j.path+'?ref='+j.evidence],{maxBuffer:5e6});
            assert.equal(hash(result),j.sha256);
            const before=JSON.parse(partBytes), wrapped=JSON.parse(result);
            const {requiredReport:report,...remaining}=wrapped;
            const {requiredReport:_template,...sealedTransport}=before;
            assert.equal(wrapped.kind,before.kind);
            assert.equal(wrapped.sourcePacketSha256,before.sourcePacketSha256);
            assert.equal(wrapped.planFingerprint,before.planFingerprint);
            assert.deepEqual(remaining.reviewCases,sealedTransport.reviewCases);
            assert.equal(report.reviewer.agentId,pin.reviewer);
            assert.deepEqual(report.reviews.map(x=>x.caseId).sort(),sealed.caseIds.slice().sort());
            const reportBytes=Buffer.from(JSON.stringify(report,null,2)+'\n');
            const row={schemaVersion:1,kind:'captured-independent-identity-review-part',phase:'report-recorded',scope,agentId:j.agentId,runId:j.runId,sourcePacketSha256:pin.sourcePacketSha256,reportSha256:hash(reportBytes),transportSha256:sealed.sha256,authorAgentIds:packet.authorAgentIds};
            retained.push({partBytes,reportBytes,row});
            capturedRows.push({part:j.file,cases:report.reviews.length,holds:report.reviews.filter(x=>x.verdict!=='approve').map(x=>x.caseId),originalWrapper:j.sha256,reportHash:row.reportSha256,runId:j.runId,evidenceCommit:j.evidence});
          }
          assert.equal(capturedRows.reduce((a,b)=>a+b.cases,0),390);
          assert.deepEqual(capturedRows.flatMap(x=>x.holds),[pin.hold]);
          const aggregate={schemaVersion:1,kind:'captured-independent-identity-review-parts',phase:'report-recorded',scope,sourcePacketSha256:pin.sourcePacketSha256,authorAgentIds:packet.authorAgentIds,parts:retained.map(x=>x.row)};
          const components=retained.map(x=>captureIdentityProofComponent(packetBytes,x.reportBytes,x.partBytes,x.row,receipt.transportPolicy,aggregate).component);
          const prior=path.join(RUNNER_TEMP,'jinshu028-independent-composition.json');
          fs.writeFileSync(prior,JSON.stringify({schemaVersion:1,kind:'chapter-identity-review-composition',scope,plan:packet.plan,sourcePlans:[],components,selections:[]})+'\n');
          const result=await prepareChapterIdentityReview({book:'jinshu',chapter:'028',registry:REGISTRY,sourceRevision:SOURCE,retainedComposition:prior,out:OUT,transportMaxBytes:384*1024});
          fs.writeFileSync(path.join(OUT,'captured-independent-parts.json'),JSON.stringify(capturedRows,null,2)+'\n');
          console.log(JSON.stringify(result));
          JS
          mkdir -p "$RUNNER_TEMP/reconciled-registry-export"
          cp "$REGISTRY/manifest.json" "$RUNNER_TEMP/reconciled-registry-export/manifest.json"
          tar -czf "$RUNNER_TEMP/reconciled-registry-export/registry.tar.gz" -C "$(dirname "$REGISTRY")" "$SOURCE"
          (cd "$RUNNER_TEMP/reconciled-registry-export" && sha256sum registry.tar.gz manifest.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-028-reconciled-identity-evidence
          path: ${{ runner.temp }}/jinshu028-reconciled-identity/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: people-registry-${{ env.SOURCE }}
          path: ${{ runner.temp }}/reconciled-registry-export/
          if-no-files-found: error
          retention-days: 7
