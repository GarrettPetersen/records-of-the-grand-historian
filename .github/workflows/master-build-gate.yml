name: Campaign scoped validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - chapter: '023'
            revision: 2ac477356f2c45918ec874f019b21baa2bef9bd9
          - chapter: '094'
            revision: 050a320209768c02a3a60ecc8ba8aef1ac96ffb2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run people:validate -- --book jinshu --chapter ${{ matrix.chapter }}
