name: Verify scoped people curation before a production build
run-name: Check the 30-chapter release candidate for scoped display evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SOURCE: e0ebb7eba5da723566110c1dbe06ce1ed7ef1a66
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Reconstruct qualified scopes and inspect exact display guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          export OUT="$RUNNER_TEMP/scoped-curation-preflight"
          mkdir -p "$OUT" data/people/generated/identity-dossiers
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE" > "$OUT/registry-receipt.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {readIdentityDossierRegistry} from './scripts/lib/people-identity-dossier-delta.mjs';
          import {loadProperNounMatcher} from './scripts/lib/people-candidates.mjs';
          import {loadValidatedPeopleChapter} from './scripts/lib/people-validated-chapter.mjs';
          import {loadCurrentIdentityEvidence} from './scripts/lib/people-identity-evidence.mjs';
          import {chapterIdentityInputs,validateChapterIdentityBundle} from './scripts/lib/people-chapter-identity.mjs';
          import {assertChapterGates} from './scripts/lib/people-qualified-scope.mjs';
          import {dateAuditStatus} from './scripts/lib/people-date-audit.mjs';
          import {editorialDecisionPath} from './scripts/lib/people-editorial-decisions.mjs';
          const mustPass=new Set(["beiqishu/046","chenshu/023","houhanshu/001","houhanshu/119","houhanshu/126","jinshi/023","jinshi/039","jinshi/043","jinshu/030","jinshu/031","jinshu/047","jinshu/063","jinshu/081","jinshu/083","jinshu/085","jinshu/094","jinshu/115","jinshu/123","jiuwudaishi/006","jiuwudaishi/024","jiuwudaishi/057","jiuwudaishi/064","jiuwudaishi/066","jiuwudaishi/073","jiuwudaishi/104","jiuwudaishi/105","jiuwudaishi/119","jiuwudaishi/144","jiuwudaishi/147","liangshu/007","liangshu/015","liangshu/016","liangshu/017","liangshu/023","liangshu/024","liangshu/037","liangshu/042","liangshu/043","liangshu/044","liangshu/052","liangshu/055","liaoshi/005","liaoshi/043","liaoshi/107","mingshi/034","nanqishu/008","nanqishu/060","qingshigao/027","qingshigao/047","shiji/051","shiji/098","shiji/115","songshu/090","weishu/019","xintangshu/045","xintangshu/064","xintangshu/066","xinwudaishi/003","xinwudaishi/016","xinwudaishi/019","xinwudaishi/041"]);
          const {SOURCE,REGISTRY,OUT}=process.env;
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const roots='data/people/identity-reviews';
          const match=loadProperNounMatcher();
          const registry=await readIdentityDossierRegistry(REGISTRY,new Map());
          const view={localPersonMap:registry.localPersonMap,canonicalByKnownId:registry.canonicalByKnownId};
          const current=read('data/people/config.json').promptVersion;
          const overrides=read('data/people/curation/overrides.json').people;
          const byCanonical=new Map();
          const ready=[],held=[],members=new Map(),findings=[];
          try{
            for(const [id,override] of Object.entries(overrides)){
              const canonical=view.canonicalByKnownId.get(id);
              if(!canonical)continue;
              const current=byCanonical.get(canonical)??[];
              current.push({id,override});
              byCanonical.set(canonical,current);
            }
            for(const book of fs.readdirSync(roots)){
              for(const file of fs.readdirSync(path.join(roots,book)).filter(x=>/^\d{3}\.json$/.test(x))){
                const chapter=file.slice(0,-5), scope={book,chapter}, key=book+'/'+chapter;
                try{
                  const own=loadValidatedPeopleChapter(book,chapter,{properNounMatcher:match});
                  const editorial=editorialDecisionPath(book,chapter);
                  assertChapterGates(own.extraction,current,dateAuditStatus(book,chapter),fs.existsSync(editorial)?read(editorial):null);
                  const bundle=read(path.join(roots,book,file));
                  const evidence=loadCurrentIdentityEvidence(bundle,own,match);
                  const certified=validateChapterIdentityBundle(view,evidence,scope,bundle,chapterIdentityInputs(book,chapter));
                  ready.push({key,cases:certified.retained.length});
                  for(const [id,person] of own.localPeople){
                    const canonical=view.localPersonMap.get(id);
                    if(!byCanonical.has(canonical))continue;
                    const value=members.get(canonical)??[];
                    value.push({id,key,person});
                    members.set(canonical,value);
                  }
                }catch(error){held.push({key,message:error.message.split('\n')[0]});}
              }
            }
            for(const [id,scoped] of members){
              const entries=byCanonical.get(id);
              if(entries.length>1){findings.push({id,field:'override',reason:'Multiple scoped curation overrides',entries:entries.map(x=>x.id)});continue;}
              const {override}=entries[0];
              if(override.preferredDescription&&!scoped.some(x=>x.person.descriptorSuggestion===override.preferredDescription))findings.push({id,field:'preferredDescription',requested:override.preferredDescription,scoped:scoped.map(x=>({localId:x.id,key:x.key,descriptor:x.person.descriptorSuggestion}))});
              if(override.preferredName&&!scoped.flatMap(x=>x.person.claims).some(x=>x.predicate==='name'&&['en','zh','pinyin'].every(k=>!override.preferredName[k]||x.value?.[k]===override.preferredName[k])))findings.push({id,field:'preferredName',requested:override.preferredName,scoped:scoped.map(x=>({localId:x.id,key:x.key}))});
            }
          }finally{registry.close();}
          const missing=[...mustPass].filter(x=>!ready.some(y=>y.key===x));
          const report={source:SOURCE,ready,held,findings,missing};
          fs.writeFileSync(path.join(OUT,'scoped-curation-report.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          assert.equal(missing.length,0,'One or more campaign chapters did not qualify');
          assert.equal(findings.length,0,'Unsupported preferred descriptions or names in the exact release scope');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-curation-release-preflight
          path: ${{ runner.temp }}/scoped-curation-preflight/
          if-no-files-found: error
          retention-days: 7
