name: Diagnose Jinshu 028 under the standard chronology runtime
run-name: Verify exact Jinshu 028 data using the unchanged master validator
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 78c96c158a7939e5c70f7dae4091d45c2a51c23d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Validate exact extraction data under the regular master rules
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/jinshu028-master-runtime"
          npm run people:validate -- --book jinshu --chapter 028 2>&1 | tee "$RUNNER_TEMP/jinshu028-master-runtime/validation.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jinshu-028-with-unchanged-master-validator
          path: ${{ runner.temp }}/jinshu028-master-runtime/
          if-no-files-found: error
          retention-days: 7
