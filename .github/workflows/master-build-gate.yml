name: Retain unchanged primary source chronology after reviewed English edits
run-name: Rebind the exact unaffected date proofs for Hou Hanshu 111 and Songshu 069
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Rebind ${{ matrix.key }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: houhanshu-111
            book: houhanshu
            chapter: "111"
            source: 91f9f2166eca4603e54220de0d4a8633daeceb26
            prior: 7b85821a54d6a2d234cfc844767496403199cb45
          - key: songshu-069
            book: songshu
            chapter: "069"
            source: 1cadb163a7bd731615cd88a77d4102fd122f37a0
            prior: b3a9b891fc0aa5a2f119d0f4edd35ece0cf34d6f
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ matrix.source }}
      PRIOR: ${{ matrix.prior }}
      BOOK: ${{ matrix.book }}
      CHAPTER: ${{ matrix.chapter }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Prove the full date evidence invariant and preserve the native approval
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$RUNNER_TEMP/unchanged-date"
          mkdir -p "$OUT/history"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {buildDateAuditPacket,validateDateAuditReport,dateAuditReferencesCurrent,recordDateAudit} from './scripts/lib/people-date-audit.mjs';
          const {BOOK,CHAPTER,SOURCE,PRIOR,OUT,RUNNER_TEMP,GITHUB_REPOSITORY}=process.env;
          const id=BOOK+'/'+CHAPTER, source='data/'+id+'.json', extraction='data/people/extractions/'+id+'.json', audit='data/people/date-audits/'+id+'.json';
          const read=(file,ref)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+file+'?ref='+ref],{maxBuffer:10e6});
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const previous=path.join(RUNNER_TEMP,'previous-source');
          fs.mkdirSync(path.join(previous,BOOK),{recursive:true});
          fs.writeFileSync(path.join(previous,BOOK,CHAPTER+'.json'),read(source,PRIOR));
          const before=buildDateAuditPacket(BOOK,CHAPTER,{dataDir:previous,extraction:JSON.parse(read(extraction,PRIOR))});
          const after=buildDateAuditPacket(BOOK,CHAPTER);
          const original=read(audit,PRIOR), old=JSON.parse(original);
          assert(fs.readFileSync(audit).equals(original));
          validateDateAuditReport(old,before);
          assert.equal(old.status,'audited');assert(dateAuditReferencesCurrent(old));
          const primary=({id,zh,blockIndex})=>({id,zh,blockIndex});
          assert.deepEqual(before.units.map(primary),after.units.map(primary));
          assert.deepEqual(before.people,after.people);
          const sorted=p=>Object.fromEntries(Object.entries(p).map(([k,v])=>[k,v.slice().sort()]));
          assert.deepEqual(sorted(before.unitPeople),sorted(after.unitPeople));
          const semantic=({id,claimIndex,...rest})=>rest;
          const index=(rows)=>{const by=new Map(rows.map(row=>[JSON.stringify(semantic(row)),row]));assert.equal(by.size,rows.length);return by;};
          const sourceItems=index(before.items),currentItems=index(after.items);
          assert.equal(sourceItems.size,currentItems.size);
          const checks=new Map(old.itemChecks.map(x=>[x.id,x]));
          const mapped=after.items.map(row=>{const previous=sourceItems.get(JSON.stringify(semantic(row)));assert(previous);return {...checks.get(previous.id),id:row.id};});
          const fresh={...old,sourceHash:after.sourceHash,extractionHash:after.extractionHash,summary:old.summary+' Independently reviewed English edits changed no Chinese primary units, chronology items, people, or unit attribution.',itemChecks:mapped};
          validateDateAuditReport(fresh,after);
          const status=recordDateAudit(fresh);
          assert.equal(status.status,'audited');assert.equal(status.findings,0);
          const name=hash(JSON.stringify(old))+'.json', history='data/people/date-audit-history/'+id+'/'+name;
          assert.deepEqual(JSON.parse(fs.readFileSync(history)),old);
          fs.copyFileSync(history,path.join(OUT,'history',name));
          fs.copyFileSync(audit,path.join(OUT,'date-audit.json'));
          fs.writeFileSync(path.join(OUT,'receipt.json'),JSON.stringify({scope:id,source:SOURCE,prior:PRIOR,originalAuditSha256:hash(original),newAuditSha256:hash(fs.readFileSync(audit)),retainedItemChecks:after.items.length,retainedPersonChecks:after.people.length,retainedPrimaryUnits:after.units.length,status})+'\n');
          JS
          npm run people:dates:verify -- --book "$BOOK" --chapter "$CHAPTER" --out "$OUT/verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: unchanged-date-${{ matrix.key }}
          path: ${{ runner.temp }}/unchanged-date/
          if-no-files-found: error
          retention-days: 7
