name: Certify partitioned glossary owner reviews
run-name: Certify exact independently reviewed partitioned glossary chapters
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      SHARD: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-110c2f92a0e7994af8d9218f76c80ccd72b98d5c
          run-id: 45331566653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: retained-split-glossary-shard-${{ matrix.shard }}
          run-id: 45356094482
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify captures and run the native identity recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/registry/registry.tar.gz" -C "$RUNNER_TEMP/registry"
          node --input-type=module <<'JS'
          const expected=[{"key":"xinwudaishi/019","shard":0,"actor":"bc-94f7dd1c-ea99-4e63-9afc-fd8be9d67344","run":"run-1f5a3ba4-3b43-40d7-bcb0-9b0b2db3df74","owner":"bc-23529211-836c-4588-b3ee-a1d4918b098f","packetSha256":"2130ad12ffbcaad5ec780381d4ef9b4aab5ceb4996407ceed06ca83f6e8ff17d","planFingerprint":"sha256:335c1a361a3e57b5b4616f69e3e16a86d751553646cbe19fc535a61072a63063","cases":31,"parts":[{"file":"transport-part-001.json","sha256":"f700acf875d78e7aa597f3090a63558ab45c4236aac8e754e59ebf2b5f5d7fd4"},{"file":"transport-part-002.json","sha256":"95f956bd6a85fb0ca66989515663616c97e6c8a1a0342aa70207002fc63de29b"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/xinwudaishi-019/independent-identity-report-part-001.json","blob":"576e526749abb173769690d6820ccffb533da668","sha256":"b87031c3fd9280c1bbff07399c5c17246174efb44234161b540da166380accfd","cases":15,"approvals":15,"holds":[]},{"path":"research/people/checkpoints/campaign-nov24-split-transport/xinwudaishi-019/independent-identity-report-part-002.json","blob":"08b78bc972fb4fb36167b13cf2707cdc8fffd4f2","sha256":"7e7cb4d13b7b156ed508ddfd8f27b627c52d17d573125a556753f845ffeb747f","cases":16,"approvals":16,"holds":[]}],"reviewHead":"2469c2eda6d784a35717455ff08a95945dc1bcf6"},{"key":"xintangshu/045","shard":3,"actor":"bc-76c20dfc-7ff0-4684-8c7d-ea8224a17d51","run":"run-94c87668-64b0-4c31-8511-769b76d51950","owner":"bc-978e1690-a3ab-48d2-ae68-23b6a36f76fe","packetSha256":"2764033ad16d7dc5bc2885320ace9c0311638f03a6faf2426ab1694b0ef9f45e","planFingerprint":"sha256:41a3c2971897f05bc816a7eeca981c92f64019914b374212d4054d3d5f974f10","cases":40,"parts":[{"file":"transport-part-001.json","sha256":"403429774e37f36308f2748b24635c3d0e816a12d63cb45fb16b45f6e8b03967"},{"file":"transport-part-002.json","sha256":"08d28904d29df2be3f7fd9e5d8e14956316fead75fe86906375e1f9ebfda2dfb"}],"reports":[{"path":"research/people/checkpoints/campaign-nov24-split-transport/xintangshu-045/independent-identity-report-