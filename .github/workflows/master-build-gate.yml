              assert.equal(aggregated.reviews.length,j.cases);
              const report=path.join(dir,'actual-aggregate.json'), job=path.join(dir,'actual-job.json');
              const aggregateBytes=Buffer.from(JSON.stringify(aggregated)+'\n');
              fs.writeFileSync(report,aggregateBytes,{flag:'wx'});
              fs.writeFileSync(job,JSON.stringify({schemaVersion:1,kind:'captured-independent-identity-review-parts',phase:'report-recorded',scope:data.scope,agentId:j.actor,runId:j.run,authorAgentIds:[j.owner],sourcePacketSha256:identityArtifactHash(p),reportSha256:identityArtifactHash(aggregateBytes),transportPolicy:identityReviewTransportPolicy(384*1024),parts})+'\n',{flag:'wx'});
              try{
               const receipt=await recordChapterIdentityReview({packet,report,job,registry,out:path.join(output,id+'.json')});
               results.push({key:j.key,receipt});
              }catch(validationError){
               try{
                const diagnostics=await diagnoseExactCases(j,data,aggregated,registry);
                results.push({key:j.key,error:validationError.message,diagnostics});
               }catch(diagnosticError){
                results.push({key:j.key,error:validationError.message,diagnosticError:diagnosticError.message});
               }
              }
            }catch(e){results.push({key:j.key,error:e.message});}
          }
          fs.writeFileSync(path.join(output,'summary.json'),JSON.stringify(results,null,2)+'\n');
          console.log(JSON.stringify(results.map(x=>({key:x.key,native:x.receipt?.nativeIdentityProofAccepted,error:x.error}))));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'All exact reports failed native certification');
          JS
