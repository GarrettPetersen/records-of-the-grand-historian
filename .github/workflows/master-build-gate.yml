name: Full-site Pages performance preflight
run-name: Measure full glossary build with 4.5 GiB compiler heap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef995d54824017254b05d032912999047ec6127d
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Measure the production command with the same gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ef995d54824017254b05d032912999047ec6127d
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path='package.json';
          const raw=fs.readFileSync(path,'utf8');
          const before='node --max-old-space-size=3072 scripts/compile-people-catalog.mjs';
          if(raw.split(before).length!==2)throw Error('Production catalog command changed');
          fs.writeFileSync(path,raw.replace(before,before.replace('3072','4608')));
          JS
          /usr/bin/time -v npm run build
      - name: Verify all five approved new chapter contributions
        run: |
          set -euo pipefail
          for chapter in 030 083 085 115 123; do
            node scripts/verify-people-chapter-release.mjs --book jinshu --chapter "$chapter" --out "$RUNNER_TEMP/qualify-$chapter"
          done
