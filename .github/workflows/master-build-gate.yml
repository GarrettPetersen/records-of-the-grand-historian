name: Qualify exact native identity for independently date-audited glossary chapters
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: d1b7335f006b5dc1b90d35abfe7c0ed6d1b5784a
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: nov24-first-native-date-identity-projection-1-0
          run-id: 45449543949
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
      - name: Record exact model-authored independent review certificates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$GITHUB_WORKSPACE/data/people/generated/nov24-native-certificates"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          mkdir -p "$OUT" "$(dirname "$REGISTRY")"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          const items=[{"key":"qingshigao/377","owner":"bc-2611d474-8cb0-4a36-9128-27ad94b55c2b","agentId":"bc-7b1203b1-440a-4311-b1cd-9e2bf6b62385","runId":"run-62dd7db9-591c-4b3d-a9e8-ee675a8c1dec","head":"87d7797e2cd9d1ceaf3035f4fd6733f6d4075a6a","preparedDir":"qingshigao-377","packetSha256":"57428e195cdbe920a4e9afffb4d17cb54091e73d614a81eaa77b92033079e87d","transportRevision":"841d893266082974e5ffb07d1347b1b67af6e016","parts":[{"path":"research/people/checkpoints/campaign-nov24-first-native-identity/qingshigao-377/transport-packet.json","sha256":"7b2a95e787774cd528905c7293cd57caf92e48139a194c4d65cc49ba0fa92787","cases":30,"output":"research/people/checkpoints/campaign-nov24-first-native-identity/qingshigao-377/native-identity-report.json","head":"87d7797e2cd9d1ceaf3035f4fd6733f6d4075a6a","reportSha256":"61f3a146e9ea39b8ecc59ea7c84a2af55b26bfc0c453a82943c8a1322ea3710d","holds":[]}],"cases":30,"held":[],"sourceRepairs":[]},{"key":"liaoshi/094","owner":"bc-269ec703-5133-4314-8050-fc299a953527","agentId":"bc-7b1203b1-440a-4311-b1cd-9e2bf6b62385","runId":"run-62dd7db9-591c-4b3d-a9e8-ee675a8c1dec","head":"87d7797e2cd9d1ceaf3035f4fd6733f6d4075a6a","preparedDir":"liaoshi-094","packetSha256":"a4d571c8c9da08df7e17118414c57357f06a2a749f0e34de6296cbd16f7327a6","transportRevision":"841d893266082974e5ffb07d1347b1b67af6e016","parts":[{"path":"research/people/checkpoints/campaign-nov24-first-native-identity/liaoshi-094/transport-packet.json","sha256":"50668d6e9c20fca134bc7f5fbae4fb3967e4b245a4948cd39d1dbab43e78a9b4","cases":33,"output":"research/people/checkpoints/campaign-nov24-first-native-identity/liaoshi-094/native-identity-report.json","head":"87d7797e2cd9d1ceaf3035f4fd6733f6d4075a6a","reportSha256":"707ee6bb2d07a1dca218eb67ee6798e3f980cd2ee6cb263187bfabc3d80a8830","holds":[]}],"cases":33,"held":[],"sourceRepairs":[]},{"key":"liaoshi/097","owner":"bc-4e183857-b0ba-4bce-baa6-eec0311d4e13","agentId":"bc-7b1203b1-440a-4311-b1cd-9e2bf6b62385","runId":"run-62dd7db9-591c-4b3d-a9e8-ee675a8c1dec","head":"87d7797e2cd9d1ceaf3035f4fd6733f6d4075a6a","preparedDir":"liaoshi-097","packetSha256":"41398e851cd6bef56699524d0a1113135a792f4c711bad001c7b4c8cbe3f538b","transportRevision":"841d893266082974e5ffb07d1347b1b67af6e016","parts":[{"path":"research/people/checkpoints/campaign-nov24-first-native-identity/liaoshi-097/transport-packet.json","sha256":"42c34bbfb204de253b371841d55bcb102dee136e1f361127154d887d95f71848","cases":35,"output":"research/people/checkpoints/campaign-nov24-first-native-identity/liaoshi-097/native-identity-report.json","head":"87d7797e2cd9d1ceaf3035f4fd6733f6d4075a6a","reportSha256":"b21525d52251a83c65c0d36ff1a124d1f9f8e2ad8a7c3199d5fd6b0b461ebc72","holds":[]}],"cases":35,"held":[],"sourceRepairs":[]}];
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {identityArtifactHash,recordChapterIdentityReview} from './scripts/lib/people-identity-review-record.mjs';

          const {RUNNER_TEMP,SOURCE,REGISTRY,OUT,GITHUB_REPOSITORY}=process.env;
          const output=[];
          const get=(p,ref)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+p+'?ref='+ref],{maxBuffer:4e6,timeout:25000});
          for(const x of items){
           const [book,chapter]=x.key.split('/');const scope={book,chapter}, dir=path.join(RUNNER_TEMP,'prepared',x.preparedDir);
           try {
           const packet=path.join(dir,'source-review-packet.json'), pb=fs.readFileSync(packet), src=JSON.parse(pb);
           assert.equal(src.registryReuse?.sourceRevision??src.registryProvenance.revision,SOURCE);assert.equal(identityArtifactHash(pb).replace(/^sha256:/,''),x.packetSha256);
           const files=x.parts.map((y,i)=>{const rb=get(y.output,y.head),tb=get(y.path,x.transportRevision),reportFile=path.join(dir,'captured-report-'+i+'.json'),transportFile=path.join(dir,'captured-transport-'+i+'.json');
            assert.equal(identityArtifactHash(rb).replace(/^sha256:/,''),y.reportSha256);assert.equal(identityArtifactHash(tb).replace(/^sha256:/,''),y.sha256);
            fs.writeFileSync(reportFile,rb,{flag:'wx'});fs.writeFileSync(transportFile,tb,{flag:'wx'});return {rb,tb,reportFile,transportFile};});
           const aggregate=files.length===1?files[0].rb:Buffer.from(JSON.stringify((await import('./scripts/lib/people-identity-review-transport.mjs')).assembleChapterIdentityReviewParts(src.plan,files.map(f=>JSON.parse(f.tb)),files.map(f=>JSON.parse(f.rb)),files.map(()=>x.agentId),src.authorAgentIds,src.reviewCaseIds))+'\n');
           const report=path.join(dir,'captured-native-review.json'),job=path.join(dir,'capture.json');
           const common={schemaVersion:1,phase:'report-recorded',scope,agentId:x.agentId,runId:x.runId,sourcePacketSha256:identityArtifactHash(pb)};
           const partition=files.length===1?{}:{transportPolicy:x.transportPolicy,parts:files.map(f=>({...common,kind:'captured-independent-identity-review-part',transportFile:f.transportFile,reportFile:f.reportFile,transportSha256:identityArtifactHash(f.tb),reportSha256:identityArtifactHash(f.rb)}))};
           fs.writeFileSync(report,aggregate,{flag:'wx'});fs.writeFileSync(job,JSON.stringify({...common,authorAgentIds:[x.owner],kind:files.length===1?'captured-independent-identity-review':'captured-independent-identity-review-parts',reportSha256:identityArtifactHash(aggregate),...partition}),{flag:'wx'});
           const qualified=await recordChapterIdentityReview({packet,report,job,registry:REGISTRY,out:path.join(OUT,x.preparedDir+'.json')});
           assert(qualified.nativeIdentityProofAccepted&&qualified.reviewedCases===x.cases);output.push({key:x.key,status:'qualified',cases:x.cases,certificate:identityArtifactHash(fs.readFileSync(path.join(OUT,x.preparedDir+'.json')))});
           } catch(e) {output.push({key:x.key,status:'held',reason:e.message});}
          }
          fs.writeFileSync(path.join(OUT,'summary.json'),JSON.stringify({source:SOURCE,output},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-first-native-identity-certificates-1-1
          path: data/people/generated/nov24-native-certificates/
          if-no-files-found: error
          retention-days: 7
