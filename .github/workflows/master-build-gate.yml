name: Prepare audited Jinshu identity evidence
run-name: Prepare shared Jinshu 047, 063 and 081 identity evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 97404c5ba0ba715c712fa1273a0ba4029679f75f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - run: node scripts/validate-people-extraction.mjs --self-test
      - uses: actions/download-artifact@v4
        with:
          name: jinshu-063-retained-identity-components
          run-id: 45314188704
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained-063
      - uses: actions/download-artifact@v4
        with:
          name: jinshu-081-retained-identity-components
          run-id: 45313489803
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retained-081
      - name: Prepare one source-pinned registry and three sealed dossiers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          root="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          export REGISTRY="$root/$SOURCE"
          mkdir -p "$root" "$RUNNER_TEMP/registry-export"
          for chapter in 047 063 081; do
            npm run people:dates:verify -- --book jinshu --chapter "$chapter" --out "$RUNNER_TEMP/date-$chapter.json"
            jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$RUNNER_TEMP/date-$chapter.json"
          done
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          (cd "$RUNNER_TEMP/retained-063" && sha256sum -c SHA256SUMS && jq -e '.sourceRevision=="4d27c47ad4e4bf2b33ac172ad8a3df10a5297fe9" and .scope.chapter=="063"' retained-identity-components.json && jq '{schemaVersion:1,kind:"chapter-identity-review-composition",scope,plan:.sourcePlan,sourcePlans:[],components,selections:[]}' retained-identity-components.json > "$RUNNER_TEMP/retained-063.json")
          (cd "$RUNNER_TEMP/retained-081" && sha256sum -c SHA256SUMS && jq -e '.sourceRevision=="af7a7acacfc3d7d8860f2c27a0bc1673d85e3df5" and .scope.chapter=="081"' retained-identity-components.json && jq '{schemaVersion:1,kind:"chapter-identity-review-composition",scope,plan:.sourcePlan,sourcePlans:[],components,selections:[]}' retained-identity-components.json > "$RUNNER_TEMP/retained-081.json")
          node --input-type=module <<'JS'
          import path from 'node:path';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          for (const chapter of ['047','063','081']) {
            const retainedComposition = chapter === '047' ? undefined : path.join(process.env.RUNNER_TEMP,'retained-'+chapter+'.json');
            const result=await prepareChapterIdentityReview({book:'jinshu',chapter,sourceRevision:process.env.SOURCE,registry:process.env.REGISTRY,out:path.join(process.env.RUNNER_TEMP,'identity-'+chapter),retainedComposition,transportMaxBytes:384*1024});
            console.log(JSON.stringify(result));
          }
          JS
          cp "$REGISTRY/manifest.json" "$RUNNER_TEMP/registry-export/manifest.json"
          tar -czf "$RUNNER_TEMP/registry-export/registry.tar.gz" -C "$root" "$SOURCE"
          (cd "$RUNNER_TEMP/registry-export" && sha256sum registry.tar.gz manifest.json > SHA256SUMS)
          test "$(stat -c %s "$RUNNER_TEMP/registry-export/registry.tar.gz")" -le 167772160
      - uses: actions/upload-artifact@v4
        with:
          name: people-registry-${{ env.SOURCE }}
          path: ${{ runner.temp }}/registry-export/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-047-native-identity-evidence
          path: ${{ runner.temp }}/identity-047/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-063-native-identity-evidence
          path: ${{ runner.temp }}/identity-063/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-081-native-identity-evidence
          path: ${{ runner.temp }}/identity-081/
          if-no-files-found: error
          retention-days: 7
