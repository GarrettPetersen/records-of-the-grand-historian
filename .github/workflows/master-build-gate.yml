        with:
          name: ${{ steps.pins.outputs.registry_name }}
          run-id: ${{ steps.pins.outputs.registry_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry-archive
      - name: Reuse only unaffected approved identity components
        env:
          REVISION: ${{ steps.pins.outputs.revision }}
          REGISTRY_REVISION: ${{ steps.pins.outputs.registry_revision }}
          OLD_REVISION: ${{ steps.pins.outputs.old_revision }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-parse HEAD^)" = "$REGISTRY_REVISION"
          mkdir "$RUNNER_TEMP/identity-registry" "$RUNNER_TEMP/recorded"
          (cd "$RUNNER_TEMP/retained" && sha256sum -c SHA256SUMS)
          (
            cd "$RUNNER_TEMP/registry-archive"
            sha256sum -c SHA256SUMS
            tar -xzf registry.tar.gz -C "$RUNNER_TEMP/identity-registry"
            cmp manifest.json "$RUNNER_TEMP/identity-registry/$REGISTRY_REVISION/manifest.json"
          )
          if [[ "$CHAPTER_INPUT" == 030-residual ]]; then
            jq '{schemaVersion:1,kind:"chapter-identity-review-composition",scope,plan:.sourcePlan,sourcePlans:[],components,selections:[]}' "$RUNNER_TEMP/retained/retained-identity-components.json" > "$RUNNER_TEMP/retained-030.json"
            node scripts/prepare-people-chapter-identity.mjs \
              --book jinshu --chapter 030 --source-revision "$REVISION" \
              --registry "$RUNNER_TEMP/identity-registry/$REGISTRY_REVISION" \
              --out "$RUNNER_TEMP/residual-identity" --retained-composition "$RUNNER_TEMP/retained-030.json"
            exit 0
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { REPO_ROOT } from './scripts/lib/people-content.mjs';
          import { loadProperNounMatcher } from './scripts/lib/people-candidates.mjs';
          import { planChapterIdentityReview } from './scripts/lib/people-identity-dossiers.mjs';
          import { readIdentityDossierRegistry } from './scripts/lib/people-identity-dossier-delta.mjs';
          import { pinnedIdentityChapterContext, provePinnedDossierReuse } from './scripts/lib/people-pinned-identity-source.mjs';
          import { reconcileIdentityProofComposition } from './scripts/lib/people-identity-proof-composition.mjs';
          const temp=process.env.RUNNER_TEMP;
          const original=JSON.parse(fs.readFileSync(temp+'/retained/retained-identity-components.json'));
          assert.equal(original.sourceRevision,process.env.OLD_REVISION);
          assert.deepEqual(original.scope,{book:'jinshu',chapter:'030'});
          assert.equal(original.components.length,42);
          const pinned=pinnedIdentityChapterContext(REPO_ROOT,process.env.REVISION);
          const index=await readIdentityDossierRegistry(temp+'/identity-registry/'+process.env.REGISTRY_REVISION,new Map());
          try {
            provePinnedDossierReuse(index.provenance,pinned.snapshot);
            assert.equal(pinned.dates('jinshu','030').status,'audited');
            const plan=planChapterIdentityReview(index,original.scope,pinned.inputs('jinshu','030'),original.sourcePlan.limits);
            const scopes=new Set(['jinshu:030']);
            for(const component of original.components)for(const person of component.receipt.sourcePeople)scopes.add(person.localId.split(':').slice(0,2).join(':'));
            const matcher=loadProperNounMatcher();
            const sources=new Map([...scopes].map(scope=>{
              const [book,chapter]=scope.split(':');
              return [scope,pinned.load(book,chapter,{properNounMatcher:matcher,strictAliasDispositions:scope==='jinshu:030'})];
            }));
            const view={localPersonMap:index.localPersonMap,canonicalByKnownId:index.canonicalByKnownId};
            const result=reconcileIdentityProofComposition(view,sources,plan,[original.sourcePlan],original.components);
            const receipt={scope:plan.scope,planFingerprint:plan.fingerprint,total:plan.cases.length,retained:result.eligible.size,invalidated:result.invalidated,held:result.held,remaining:result.remainingCaseIds};
            console.log(JSON.stringify(receipt));
            assert.equal(result.held.length,0,'A prior hold still applies');
            assert.deepEqual(result.remainingCaseIds,[],'Native composition requires a focused independent review of these remaining cases');
            assert(result.invalidated.some(row=>row.caseId===original.holdId),'The removed person hold must remain represented in provenance');
            const bundle={schemaVersion:1,kind:'chapter-identity-review-composition',scope:plan.scope,plan,sourcePlans:[original.sourcePlan],components:original.components,selections:result.selections};
            fs.writeFileSync(temp+'/composition.json',JSON.stringify(bundle)+'\n',{flag:'wx'});
            fs.writeFileSync(temp+'/recorded/reconciliation-receipt.json',JSON.stringify(receipt)+'\n',{flag:'wx'});
          } finally { index.close(); }
          JS
          node scripts/record-people-chapter-identity-worker.mjs \
            --composition "$RUNNER_TEMP/composition.json" \
            --source-revision "$REVISION" \
            --registry "$RUNNER_TEMP/identity-registry/$REGISTRY_REVISION" | tee "$RUNNER_TEMP/recorded/recording-receipt.json"
          jq -e --arg revision "$REVISION" '.nativeIdentityProofAccepted and .sourceRevision == $revision' "$RUNNER_TEMP/recorded/recording-receipt.json"
          npm run people:validate -- --book jinshu --chapter 030 | tee "$RUNNER_TEMP/recorded/scoped-validation.txt"
          cp data/people/identity-reviews/jinshu/030.json "$RUNNER_TEMP/recorded/identity-proof.json"
          (cd "$RUNNER_TEMP/recorded" && sha256sum identity-proof.json reconciliation-receipt.json recording-receipt.json scoped-validation.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: inputs.chapter == '030-compose'
        with:
          name: jinshu-030-recorded-canonical-identity
          path: ${{ runner.temp }}/recorded/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: inputs.chapter == '030-residual'
        with:
          name: jinshu-030-native-residual-identity-evidence
          path: ${{ runner.temp }}/residual-identity/
          if-no-files-found: error
          retention-days: 7
