name: Verify scoped people curation before a production build
run-name: Record exact Jinshu 031 and Songshu 004 proof compositions
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      SOURCE: d393da3f6981fbbc58a713b127a8462ef76314fe
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - run: node scripts/test-people-source-only-chronology.mjs
      - uses: actions/download-artifact@v4
        with:
          name: nov24-deferred-retained-identity-deltas
          run-id: 45380649693
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Reconstruct qualified scopes and inspect exact display guards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          export OUT="$RUNNER_TEMP/scoped-curation-preflight"
          mkdir -p "$OUT" data/people/generated/identity-dossiers
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE" > "$OUT/registry-receipt.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import {recordChapterIdentityReview,identityArtifactHash} from './scripts/lib/people-identity-review-record.mjs';
          import {assembleChapterIdentityReviewParts} from './scripts/lib/people-identity-review-transport.mjs';
          const pin={"capture":{"head":"a99b07c29b0922f41efdef8bc245c3c90e40936c","path":"research/people/checkpoints/campaign-nov24-release-deferred-deltas/jinshu-031/independent-identity-report-part-001.json","blob":"045133ca1c57fc4f641aad1847c0718bcb2195f2","sha256":"4343e46666e806c3cef1ffa54c6f4ee5c17c778a956dbe3cc71e705ba42aeac2","fields":["schemaVersion","planFingerprint","reviewer","reviews"],"holds":[]},"agent":"bc-c338e2c8-9d0c-4d07-a751-be3d40824e00","run":"run-cd035ab3-240c-42b8-87c4-0fd4c3ba2635","plan":"sha256:b89b01ce4d4017df2e467d130af55d918363049ed14115e99842b5bafc3a8965","part":"b6f6956c03b0aa278be6f6bc749942904c731f39ca497de218f6502b0fbd3a9d","song":"a712ec82f13287a63f156154c788419577cc30272f9f9759d4e3a86ea00b62f8"};
          const temp=process.env.RUNNER_TEMP, source=process.env.SOURCE, registry=process.env.REGISTRY;
          const prior=path.join(temp,'prior'), out=path.resolve('data/people/generated/nov24-deferred-native-composition');
          fs.mkdirSync(out,{recursive:true});
          const jp=path.join(prior,'jinshu-031'), packet=path.join(jp,'source-review-packet.json'), transport=path.join(jp,'transport-part-001.json');
          const load=p=>JSON.parse(fs.readFileSync(p,'utf8')), meta=load(path.join(jp,'preparation-receipt.json')), sourcePacket=load(packet), transportData=load(transport);
          const hash=x=>identityArtifactHash(x), bare=x=>x.replace(/^sha256:/,'');
          assert.equal(bare(hash(fs.readFileSync(transport))),pin.part);assert.equal(hash(fs.readFileSync(packet)),meta.sourcePacketSha256);
          assert.equal(sourcePacket.plan.fingerprint,pin.plan);assert.equal(sourcePacket.reviewCaseIds.length,6);
          const bytes=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+pin.capture.path+'?ref='+pin.capture.head],{maxBuffer:2e6});
          assert.equal(bare(hash(bytes)),pin.capture.sha256);
          const body=JSON.parse(bytes);assert(body.reviews.every(x=>x.verdict==='approve'));
          const assembled=assembleChapterIdentityReviewParts(sourcePacket.plan,[transportData],[body],[pin.agent],sourcePacket.authorAgentIds,sourcePacket.reviewCaseIds);
          const encoding=Buffer.from(JSON.stringify(assembled)+'\n'), report=path.join(temp,'recorded-aggregate.json'), part=path.join(temp,'review-part.json'), job=path.join(temp,'recorded-job.json');
          fs.writeFileSync(report,encoding);fs.writeFileSync(part,bytes);
          const joint={schemaVersion:1,kind:'captured-independent-identity-review-parts',phase:'report-recorded',scope:sourcePacket.scope,agentId:pin.agent,runId:pin.run,sourcePacketSha256:meta.sourcePacketSha256,reportSha256:hash(encoding),transportPolicy:meta.transportPolicy,parts:[{schemaVersion:1,kind:'captured-independent-identity-review-part',phase:'report-recorded',agentId:pin.agent,runId:pin.run,sourcePacketSha256:meta.sourcePacketSha256,transportSha256:hash(fs.readFileSync(transport)),reportSha256:hash(bytes),transportFile:transport,reportFile:part}]};
          fs.writeFileSync(job,JSON.stringify(joint)+'\n');
          const song=path.join(prior,'songshu-004','composition.json');assert.equal(bare(hash(fs.readFileSync(song))),pin.song);
          const results=[];
          for(const [key,args] of [['jinshu-031',{packet,report,job}],['songshu-004',{composition:song,sourceRevision:source}]]){
           try{const value=await recordChapterIdentityReview({...args,registry,out:path.join(out,key+'.json')});results.push({key,receipt:value});}catch(e){results.push({key,error:e.message});}
          }
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(results,null,2)+'\n');console.log(JSON.stringify(results));
          assert(results.some(x=>x.receipt?.nativeIdentityProofAccepted),'Both exact composition results remain held');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-exact-deferred-composition-certs
          path: data/people/generated/nov24-deferred-native-composition/
          if-no-files-found: error
          retention-days: 7
