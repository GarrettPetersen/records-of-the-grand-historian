name: Campaign scoped validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - chapter: '085'
            revision: d5be3605fe57a5330afd0b599f61e350b0d83250
          - chapter: '094'
            revision: a364503b0331bf51df304aa074d9f1c18a7d2d67
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run people:validate -- --book jinshu --chapter ${{ matrix.chapter }}
