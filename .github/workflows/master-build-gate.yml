name: Reconcile audited retrospective label migrations
run-name: Validate preserved Liao Shi 106 and Shi Ji 064 chronology
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      BEFORE: 6cd0e34f5ce98f28e2862473b64f17b7f04b0423
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Verify the exact supported label-only difference before re-recording
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$RUNNER_TEMP/retrospective-reconciled-chronology"
          mkdir "$OUT"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {reconcileRetrospectiveExtraction} from './scripts/lib/people-reception-reconciliation.mjs';
          import {buildDateAuditPacket,dateAuditReferencesCurrent,recordDateAudit,validateDateAuditReport} from './scripts/lib/people-date-audit.mjs';
          const {SOURCE,BEFORE,OUT,GITHUB_REPOSITORY}=process.env;
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          const rows=[];
          for(const [book,chapter,expected] of [['liaoshi','106',['claim-135']],['shiji','064',['claim-112','claim-113','claim-114']]]){
            const target=book+'/'+chapter;
            const file='data/people/extractions/'+target+'.json';
            const audit='data/people/date-audits/'+target+'.json';
            const previous=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+file+'?ref='+BEFORE],{maxBuffer:5e6});
            const old=JSON.parse(previous), current=JSON.parse(fs.readFileSync(file));
            const originalBytes=fs.readFileSync(audit), original=JSON.parse(originalBytes);
            const {candidate,changes}=reconcileRetrospectiveExtraction(old);
            assert.deepEqual(changes.map(x=>x.id),expected);
            assert.deepEqual(candidate,current);
            assert.equal(original.extractionHash,'sha256:'+hash(JSON.stringify(old)));
            const packet=buildDateAuditPacket(book,chapter);
            assert.equal(original.sourceHash,packet.sourceHash);
            assert(dateAuditReferencesCurrent(original));
            assert.equal(original.status,'audited');
            assert.equal(original.findings.length,0);
            const next={...original,extractionHash:packet.extractionHash,summary:original.summary+' Retained existing independent chronology after exact retrospective label normalization. Dated claims, witnesses, actors and endpoints otherwise stayed identical.'};
            validateDateAuditReport(next,packet);
            const receipt=recordDateAudit(next);
            assert.equal(receipt.status,'audited');
            assert.equal(receipt.findings,0);
            const dest=path.join(OUT,book+'-'+chapter);
            fs.mkdirSync(dest);
            fs.writeFileSync(path.join(dest,'recorded-date-audit.json'),fs.readFileSync(audit));
            fs.writeFileSync(path.join(dest,'prior-date-audit.json'),originalBytes);
            fs.writeFileSync(path.join(dest,'composition.json'),JSON.stringify({schemaVersion:1,book,chapter,sourceRevision:SOURCE,historicalExtractionRevision:BEFORE,sourceHash:packet.sourceHash,previousExtractionHash:original.extractionHash,currentExtractionHash:packet.extractionHash,priorReportSha256:hash(originalBytes),recordedReportSha256:hash(fs.readFileSync(audit)),exactLabelOnlyChangedItems:expected,unchangedItemProofs:original.itemChecks.length,status:receipt},null,2)+'\n');
            rows.push({book,chapter,changed:expected.length,checks:original.itemChecks.length});
          }
          console.log(JSON.stringify(rows));
          JS
          npm run people:validate -- --book liaoshi --chapter 106 | tee "$OUT/liaoshi-106/validation.txt"
          npm run people:validate -- --book shiji --chapter 064 | tee "$OUT/shiji-064/validation.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: retrospective-normalization-chronology-two
          path: ${{ runner.temp }}/retrospective-reconciled-chronology/
          if-no-files-found: error
          retention-days: 7
