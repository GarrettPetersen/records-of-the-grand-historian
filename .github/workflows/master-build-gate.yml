name: Certify partitioned glossary owner reviews
run-name: Certify exact independently reviewed partitioned glossary chapters
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
      SHARD: ${{ matrix.shard }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: people-registry-a8b5bf79f39c400f8adb2360f03d6aa6fa2f20d9
          run-id: 45362321360
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/registry
      - uses: actions/download-artifact@v4
        with:
          name: nov24-current-master-followup-shard-${{ matrix.shard }}
          run-id: 45368520868
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/packets
      - name: Verify captures and run the native identity recorder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          (cd "$RUNNER_TEMP/registry" && sha256sum -c SHA256SUMS)
