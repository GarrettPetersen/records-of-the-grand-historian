name: Discover next unclaimed date-audited chapters after publication
run-name: Validate exact reviewed chronology and prepare bounded canonical identity review
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    env:
      SHARD: ${{ matrix.shard }}
      SOURCE: 992c7d6e13470e7c0c83e3de2e8e46917800feb4
      STAGING: 992c7d6e13470e7c0c83e3de2e8e46917800feb4
      NODE_OPTIONS: --max-old-space-size=3072
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Rank already-audited scopes and prepare the shard
        timeout-minutes: 32
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export REGISTRY="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers/$SOURCE"
          mkdir -p "$(dirname "$REGISTRY")"
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"

          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          const {SOURCE,STAGING,RUNNER_TEMP,GITHUB_REPOSITORY}=process.env;
          const queue=JSON.parse(execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/people-work-queue.json?ref=codex/people-work-queue'],{encoding:'utf8',maxBuffer:12e6}));
          const excluded=new Set();
          const allowed={"jinshi/038":"bc-159f19bf-4834-45ac-9043-8f3fc66a8383"};
          const openPR=JSON.parse(execFileSync("gh",["pr","list","--state","open","--limit","300","--json","headRefName,title"],{encoding:"utf8",maxBuffer:5e6,timeout:45000})).map(p=>(p.headRefName+" "+p.title).toLowerCase());
          for(const [key,record] of Object.entries(queue.chapterOwners??{}))if(['active','ready','resume-required'].includes(record.status)&&record.agentId!==allowed[key])excluded.add(key);
          for(const lane of ['identityReviews','dateAudits','claims'])for(const [key,record] of Object.entries(queue[lane]??{}))if(['claimed','active','ready','resume-required'].includes(record.status))excluded.add(key);
          const git=(args)=>execFileSync('git',args,{encoding:'utf8',maxBuffer:24e6}).trim();

          const dir='data/people/date-audits';
          const roots=['data','data/people/extractions','data/people/date-audits','data/people/editorial-decisions'];
          const candidates=[];
          const skipped={};
          const skip=k=>{skipped[k]=(skipped[k]??0)+1;};
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          for(const book of fs.readdirSync(dir)){
            if(!fs.statSync(path.join(dir,book)).isDirectory())continue;
            for(const name of fs.readdirSync(path.join(dir,book))){
              if(!/^\d{3}\.json$/.test(name))continue;
              const chapter=name.slice(0,-5),key=book+'/'+chapter;
              if(!allowed[key]||excluded.has(key)||fs.existsSync('data/people/identity-reviews/'+key+'.json')){skip('reserved_or_certified');continue;}
              const files=roots.map(root=>root+'/'+key+'.json');
              if(files.some(f=>!fs.existsSync(f))){skip('missing_or_staging_changed');continue;}
              const audit=read(files[2]);
              if(audit.status!=='audited'||audit.findings?.length!==0){skip('recorded_status');continue;}
              const extraction=read(files[1]);
              const people=extraction.people?.length;
              if(!Number.isInteger(people)||people===0){skip('empty');continue;}
              candidates.push({key,book,chapter,people,files});
            }
          }
          candidates.sort((a,b)=>a.people-b.people||a.key.localeCompare(b.key));
          const receipts=[];
          const out=path.join(RUNNER_TEMP,'cohort');
          fs.mkdirSync(out,{recursive:true});
          const registry=process.env.REGISTRY;
          let prepared=0;
          const shard=Number(process.env.SHARD);
          if(!Number.isInteger(shard)||shard<0||shard>3)throw Error("Invalid preparation shard");
          const ranked=candidates;
          const [owner,name]=GITHUB_REPOSITORY.split("/");
          const currentStageBlobs=new Map();
          for(let i=0;i<ranked.length;i+=7){
            const group=ranked.slice(i,i+7).flatMap(c=>c.files);
            const lines=group.map((file,j)=>"p"+j+":object(expression:"+JSON.stringify(STAGING+":"+file)+"){oid}");
            const query="query{repository(owner:"+JSON.stringify(owner)+",name:"+JSON.stringify(name)+"){"+lines.join("\n")+"}}";
            const response=JSON.parse(execFileSync("gh",["api","graphql","--input","-"],{input:JSON.stringify({query}),encoding:"utf8",maxBuffer:3e6,timeout:30000}));
            if(response.errors?.length||!response.data?.repository)throw Error("GitHub exact-stage blob query failed");
            group.forEach((path,j)=>currentStageBlobs.set(path,response.data.repository["p"+j]?.oid??null));
          }
          const sameStage=ranked.filter(c=>{const exact=c.files.every(p=>currentStageBlobs.get(p)===git(["rev-parse",SOURCE+":"+p])); if(!exact)skip("staging_blob_changed");return exact;});
          const progress=()=>{
            const file=path.join(out,"cohort-receipts.json");
            fs.writeFileSync(file+".tmp",JSON.stringify({source:SOURCE,staging:STAGING,shard,eligibleBeforeStageCheck:ranked.length,sameStage:sameStage.length,skipped,prepared,receipts},null,2)+"\n");
            fs.renameSync(file+".tmp",file);
          };
          progress();
          for(const c of sameStage){
            if(prepared>=Object.keys(allowed).length)break;
            const target=path.join(out,c.key.replace('/','-'));
            try{
              const expected=[{"key":"jinshi/038","owner":"bc-159f19bf-4834-45ac-9043-8f3fc66a8383","agentId":"bc-4c6a7f05-b1eb-42bb-9e1e-170a6ae23c1f","report":{"path":"research/people/checkpoints/campaign-nov24-retained-owner-native-date/jinshi-038/independent-date-report.json","revision":"0e1afcd88409cf85df9c49f90a52a819e8d26be3","sha256":"ab16137017254e3bab7d0e7068192a103d9472f7af06e53414202113cceb254d","status":"audited","findings":[]},"packet":{"path":"research/people/checkpoints/campaign-nov24-retained-owner-native-date/jinshi-038/date-packet.json","sha256":"03de65e25923133138c94cfa5afbdc8ea2946158574a89cc19b93b5d34a33aaf","revision":"3bad15bd0d9ae874ac1fb73ffe04ec5b93536ef3"},"candidate":{"sha256":"6c33b548185971cee8f76465a3b875fd73c1b3a3e8095c031a12bd37909dc720"},"production":[{"path":"data/people/extractions/jinshi/038.json","mode":"100644","type":"blob","sha":"ff0cd27445017d470bd1a19ca042dfd52e6bc71b"},{"path":"data/people/date-audits/jinshi/038.json","mode":"100644","type":"blob","sha":"ce7e976f4328df6bc6fd641934e03dce42d4ceeb"},{"path":"data/people/date-audit-history/jinshi/038/f9c783df995c4978f370184ba9a3e802f9dec3f918bd96ed04b09cf68f2603f0.json","mode":"100644","type":"blob","sha":"6d1181ae6266a46db79b014b4640e2a3d328db4b"}]}];
              const sealed=expected.find(x=>x.key===c.key);
              const packetBytes=execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+GITHUB_REPOSITORY+'/contents/'+sealed.packet.path+'?ref='+sealed.packet.revision],{maxBuffer:6e6,timeout:20000});
              const hash=(await import('node:crypto')).createHash('sha256').update(packetBytes).digest('hex');
              if(hash!==sealed.packet.sha256)throw Error('Exact native date packet changed');
              const audit=(await import('./scripts/lib/people-date-audit.mjs'));
              audit.validateDateAuditReport(read('data/people/date-audits/'+c.key+'.json'),JSON.parse(packetBytes));
              if(audit.dateAuditStatus(c.book,c.chapter).status!=='audited')throw Error('Exact live chronology did not validate');
              const result=await prepareChapterIdentityReview({book:c.book,chapter:c.chapter,sourceRevision:SOURCE,registry,out:target,transportMaxBytes:384*1024});
              const pin=read(path.join(target,'preparation-receipt.json'));
              if(!result.metrics?.cases){
                receipts.push({key:c.key,people:c.people,status:'requires_separate_review_transport',cases:result.metrics?.cases??0,parts:result.reviewParts?.length??0});
                fs.rmSync(target,{recursive:true,force:true});progress();continue;
              }
              const files=c.files.map(p=>({path:p,blob:git(['rev-parse',SOURCE+':'+p])}));
              receipts.push({key:c.key,people:c.people,status:'ready',cases:result.metrics.cases,planFingerprint:result.planFingerprint,sourcePacketSha256:result.sourcePacketSha256,transportSha256:pin.transportSha256,transportBytes:pin.transportBytes,reviewParts:pin.reviewParts??[],files});
              prepared+=1;
            }catch(e){receipts.push({key:c.key,people:c.people,status:'held',reason:e.message.split('\n')[0]});}
            progress();
          }

          progress();
          console.log(JSON.stringify({eligibleBeforeNativeGate:candidates.length,skipped,prepared,held:receipts.filter(x=>x.status==='held').length}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov24-native-identity-after-replayed-chronology-${{ matrix.shard }}
          path: ${{ runner.temp }}/cohort/
          if-no-files-found: error
          retention-days: 7
