name: Publish bounded glossary transports for cloud chapter owners
run-name: Prepare Git-only handoffs for 24 already-audited chapter scopes
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_RUN: "45356094482"
      SOURCE: 110c2f92a0e7994af8d9218f76c80ccd72b98d5c
      STAGING: 9d69584e20b46fa995f676198d3d4af96ee229b1
      OUTPUT_REF: codex/cursor-glossary-nov24-2026-partitioned-owner-transports
    steps:
      - name: Observe the existing packet preparation run
        timeout-minutes: 19
        run: gh run watch "$INPUT_RUN" --repo "$GITHUB_REPOSITORY" --interval 20 --exit-status
      - uses: actions/download-artifact@v4
        with:
          pattern: retained-split-glossary-shard-*
          run-id: 45356094482
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/split-prepared
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact packet bytes and publish only bounded evidence files
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const {INPUT_RUN,SOURCE,STAGING,OUTPUT_REF,RUNNER_TEMP,GITHUB_REPOSITORY,GH_TOKEN}=process.env;
          const workspace=path.join(RUNNER_TEMP,'split-prepared');
          const selections=["xinwudaishi/019","liangshu/042","shiji/114","xintangshu/045","houhanshu/119","nanqishu/008","jiuwudaishi/147","beiqishu/036","chenshu/023","jiuwudaishi/144","liaoshi/005","xinwudaishi/041","liangshu/037","hanshu/098","jiuwudaishi/066","jiuwudaishi/073","liangshu/019","liangshu/052","xinwudaishi/003","jinshi/039","jinshi/046","liangshu/055","jiuwudaishi/006","liangshu/044"];
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const call=async(method,endpoint,body)=>{
            const response=await fetch('https://api.github.com/repos/'+GITHUB_REPOSITORY+'/'+endpoint,{method,headers:{Authorization:'Bearer '+GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json','User-Agent':'known-glossary-packet-export'},...body&&{body:JSON.stringify(body)},signal:AbortSignal.timeout(30000),redirect:'error'});
            if(!response.ok)throw Error(method+' '+endpoint+' returned HTTP '+response.status);
            return response.json();
          };
          const tracked=[], manifest=[];
          for(const shard of [0,1,2,3]){
            const directory=path.join(workspace,'retained-split-glossary-shard-'+shard);
            const receipts=JSON.parse(fs.readFileSync(path.join(directory,'cohort-receipts.json')));
            assert.equal(receipts.shard,shard);
            assert.equal(receipts.source,SOURCE);
            assert.equal(receipts.staging,STAGING);
            for(const entry of receipts.receipts.filter(x=>x.status==='ready')){
              assert(selections.includes(entry.key)&&/^[a-z][a-z0-9_-]*\/\d{3}$/.test(entry.key));
              const id=entry.key.replace('/','-');
              const src=path.join(directory,id), prefix='research/people/checkpoints/campaign-nov24-split-transport/'+id+'/';
              const prep=fs.readFileSync(path.join(src,'preparation-receipt.json')), p=JSON.parse(prep);
              assert.equal(p.sourceRevision,SOURCE);
              assert.equal(hash(fs.readFileSync(path.join(src,'source-review-packet.json'))),entry.sourcePacketSha256);
              assert.equal(p.sourcePacketSha256,entry.sourcePacketSha256);
              assert.equal(p.planFingerprint,entry.planFingerprint);
              assert.equal(p.reviewParts.length,2);
              assert.deepEqual(p.reviewParts,entry.reviewParts);
              const preparedReport=JSON.parse(fs.readFileSync(path.join(src,'source-review-packet.json')));
              const parts=p.reviewParts.map(part=>{
                assert(/^transport-part-00[12]\.json$/.test(part.file));
                const b=fs.readFileSync(path.join(src,part.file)), decoded=JSON.parse(b), f=prefix+part.file;
                assert.equal(hash(b),part.sha256);
                assert.equal(b.length,part.bytes);
                assert.equal(decoded.planFingerprint,p.planFingerprint);
                assert.deepEqual(decoded.reviewCases.map(x=>x.caseId).sort(),part.caseIds.slice().sort());
                tracked.push({path:f,content:b});
                return {...part,path:f};
              });
              assert.equal(parts.reduce((sum,x)=>sum+x.caseIds.length,0),entry.cases);
              tracked.push({path:prefix+'preparation-receipt.json',content:prep});
              manifest.push({key:entry.key,shard,cases:entry.cases,source:SOURCE,stage:STAGING,sourcePacketSha256:p.sourcePacketSha256,preparationReceipt:prefix+'preparation-receipt.json',preparationReceiptSha256:hash(prep),planFingerprint:p.planFingerprint,parts,files:entry.files,authorAgentIds:preparedReport.authorAgentIds});
            }
          }
          assert.equal(manifest.length,selections.length);
          assert.equal(new Set(manifest.map(x=>x.key)).size,manifest.length);
          manifest.sort((a,b)=>selections.indexOf(a.key)-selections.indexOf(b.key));
          const tree=[];
          for(let i=0;i<tracked.length;i+=4){
            const result=await Promise.all(tracked.slice(i,i+4).map(async x=>{
              const r=await call('POST','git/blobs',{encoding:'base64',content:x.content.toString('base64')});
              return {path:x.path,mode:'100644',type:'blob',sha:r.sha};
            }));
            tree.push(...result);
          }
          const original=await call('GET','git/commits/'+STAGING);
          const data=await call('POST','git/trees',{base_tree:original.tree.sha,tree});
          const commit=await call('POST','git/commits',{tree:data.sha,parents:[STAGING],message:'[CF-Pages-Skip] Publish exact bounded 24-scope chapter owner handoffs'});
          const ref=await call('POST','git/refs',{ref:'refs/heads/'+OUTPUT_REF,sha:commit.sha});
          assert.equal(ref.object.sha,commit.sha);
          const dir=path.join(RUNNER_TEMP,'transport-export-receipt');fs.mkdirSync(dir);
          fs.writeFileSync(path.join(dir,'index.json'),JSON.stringify({status:'verified',inputRun:Number(INPUT_RUN),source:SOURCE,staging:STAGING,ref:OUTPUT_REF,revision:commit.sha,scopes:manifest,blobs:tree},null,2)+'\n');
          console.log(JSON.stringify({ref:OUTPUT_REF,revision:commit.sha,scopes:manifest.length,parts:manifest.reduce((a,b)=>a+b.parts.length,0)}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-cloud-owner-transport-index
          path: ${{ runner.temp }}/transport-export-receipt/
          if-no-files-found: error
          retention-days: 7
