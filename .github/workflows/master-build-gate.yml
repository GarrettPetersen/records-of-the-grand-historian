name: Record independently audited Jinshu 020 chronology
run-name: Validate and record Jinshu 020 current chronology
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE: 1106dc44ba8ce3bbd8d76ff9c3a3db7cbdd138c0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Verify exact evidence and record the current native audit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          export OUT="$RUNNER_TEMP/jinshu020-record"
          mkdir "$OUT"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {buildDateAuditPacket,validateDateAuditReport,dateAuditReferencesCurrent,recordDateAudit} from './scripts/lib/people-date-audit.mjs';
          const pin={"file":"research/people/checkpoints/jinshu020-native-date-coverage-20261124/jinshu020-native-date-audit-candidate-replayed-20261124.json","evidence":"6b68e348b6a729761036de74fc0be00aa806c259","sha256":"130f51ceac0abe7ab1d89866343132d895763130bd28ea158dc88bc7b75e4a81","bindings":"research/people/checkpoints/jinshu020-native-date-coverage-20261124/jinshu020-native-date-audit-row-mappings-20261124.json","bindingsSha256":"9df6d9de119732020b6191825dcc2eca1405758c9d914f4580c29127487bd473","previousFile":"research/people/checkpoints/jinshu020-native-date-coverage-20261124/jinshu020-native-date-audit-candidate-20261124.json","previousEvidence":"c7eaa75e1acc7f74e9cb9bb6e384a57ed512ef21","previousSha256":"ff1da51faf332f2adb20b9f57355c7f567d2a61cc419a2708ebeada14e8ede47","agentId":"bc-ca56fb16-d4fd-4ced-a2fb-3640376ab1df","runId":"run-2a7d2a22-c4f3-4233-b8cb-e008dbb65527","owner":"bc-628852eb-7d2a-4e84-8196-b422ab4a68e8"};
          const out=process.env.OUT;
          const get=(file,ref)=>execFileSync('gh',['api','-H','Accept: application/vnd.github.raw+json','repos/'+process.env.GITHUB_REPOSITORY+'/contents/'+file+'?ref='+ref],{maxBuffer:8e6});
          const digest=b=>createHash('sha256').update(b).digest('hex');
          const candidate=get(pin.file,pin.evidence), previous=get(pin.previousFile,pin.previousEvidence), bindings=get(pin.bindings,pin.evidence);
          assert.equal(digest(candidate),pin.sha256);
          assert.equal(digest(bindings),pin.bindingsSha256);
          assert.equal(digest(previous),pin.previousSha256);
          const report=JSON.parse(candidate), before=JSON.parse(previous), mapping=JSON.parse(bindings);
          assert.equal(report.reviewer.agentId,pin.agentId);
          assert.equal(report.reviewer.ownerExtractionHead,process.env.SOURCE);
          assert.equal(report.reviewer.independentOfExtractor,true);
          assert.notEqual(pin.owner,pin.agentId);
          assert.equal(mapping.ownerRevision,process.env.SOURCE);
          assert.equal(mapping.blockers.length,0);
          assert.equal(mapping.rowMappings.length,650);
          assert.deepEqual(before.reviewedUnits,report.reviewedUnits);
          assert.deepEqual(before.personChecks,report.personChecks);
          assert.deepEqual(before.references,report.references);
          const byId=new Map(report.itemChecks.map(x=>[x.id,x]));
          const stable=before.itemChecks.filter(x=>x.verdict==='supported');
          assert.equal(stable.length,273);
          for(const x of stable)assert.deepEqual(byId.get(x.id),x,'Previously supported item changed '+x.id);
          assert.equal(report.reviewedUnits.length,756);
          assert.equal(report.personChecks.length,325);
          assert.equal(report.itemChecks.length,650);
          assert.equal(report.findings.length,0);
          assert.equal(report.status,'audited');
          const packet=buildDateAuditPacket('jinshu','020');
          validateDateAuditReport(report,packet);
          assert(dateAuditReferencesCurrent(report));
          const canonical='data/people/date-audits/jinshu/020.json';
          const old=fs.existsSync(canonical)?fs.readFileSync(canonical):null;
          const result=recordDateAudit(report);
          assert.equal(result.status,'audited');
          assert.equal(result.findings,0);
          fs.copyFileSync(canonical,path.join(out,'recorded-date-audit.json'));
          if(old){
            const archive=digest(JSON.stringify(JSON.parse(old)))+'.json';
            fs.mkdirSync(path.join(out,'history'));
            fs.copyFileSync('data/people/date-audit-history/jinshu/020/'+archive,path.join(out,'history',archive));
          }
          fs.writeFileSync(path.join(out,'date-status.json'),JSON.stringify({chapters:[{book:'jinshu',chapter:'020',...result}]})+'\n');
          fs.writeFileSync(path.join(out,'recording-receipt.json'),JSON.stringify({source:process.env.SOURCE,reviewer:pin.agentId,runId:pin.runId,candidateSha256:pin.sha256,mappingSha256:pin.bindingsSha256,reportSha256:digest(fs.readFileSync(canonical)),items:650,people:325,units:756},null,2)+'\n');
          JS
          npm run people:validate -- --book jinshu --chapter 020 | tee "$OUT/scoped-validation.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-020-native-date-recording
          path: ${{ runner.temp }}/jinshu020-record/
          if-no-files-found: error
          retention-days: 7
