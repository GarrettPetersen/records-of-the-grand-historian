name: Prepare audited Jinshu identity evidence
run-name: Prepare native Jinshu 053 proof on the seven-chapter release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      SOURCE: 4d20674c33128bb9431c8d1ae657a0622aac102d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - run: node scripts/validate-people-extraction.mjs --self-test
      - name: Verify and seal exact historical independent proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import {identityArtifactHash as hash} from './scripts/lib/people-identity-artifacts.mjs';
          import {captureIdentityProofComponent} from './scripts/lib/people-identity-proof-composition.mjs';
          import {identityReviewTransportPolicy} from './scripts/lib/people-identity-review-transport.mjs';
          const root='repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs/';
          const read=id=>Buffer.from(JSON.parse(execFileSync('gh',['api',root+id],{encoding:'utf8',maxBuffer:6e6})).content,'base64');
          const packet=read('b7089fd0a24f6638992921160a799e96d2869120');
          const report=read('fc411fa406382e5de51c71040e4372adb0c2615e');
          const envelope=read('e413743d4ccc01e98e686221898178e37a3bbf2d');
          const adopted=JSON.parse(read('e1140dac4b40bc04c868ab5d3760efd68c9d842f'));
          const job=JSON.parse(read('0e68d96fce006fa9652f07a04513b3a2cc622247'));
          assert.equal(job.origin.actualDecisionSha256,'sha256:'+hash(JSON.stringify(adopted)));
          assert.equal(adopted.verdict,'approve'); assert.equal(adopted.reviewerAgentId,job.agentId);
          assert.equal(job.origin.reviewPacketSha256,'sha256:'+hash(envelope));
          assert.equal(job.sourcePacketSha256,hash(packet)); assert.equal(job.reportSha256,hash(report));
          const transport=Buffer.from(JSON.stringify(JSON.parse(envelope).source)+'\n');
          job.transportSha256=hash(transport);
          const {sourcePlan,component}=captureIdentityProofComponent(packet,report,transport,job,identityReviewTransportPolicy(768*1024));
          assert.equal(component.id,'sha256:56521780bcf6790f0e90fc1525b630558c3dfdd280da3aee312913e29150a570');
          assert.equal(component.receipt.reviewedCaseIds.length,72);
          const retained={schemaVersion:1,kind:'chapter-identity-review-composition',scope:sourcePlan.scope,plan:sourcePlan,sourcePlans:[],components:[component],selections:[]};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/retained-053.json',JSON.stringify(retained)+'\n',{flag:'wx'});
          JS
      - name: Prepare one source-pinned registry and the protected chapter dossier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          root="$GITHUB_WORKSPACE/data/people/generated/identity-dossiers"
          export REGISTRY="$root/$SOURCE"
          mkdir -p "$root" "$RUNNER_TEMP/registry-export"
          for chapter in 053; do
            npm run people:dates:verify -- --book jinshu --chapter "$chapter" --out "$RUNNER_TEMP/date-$chapter.json"
            jq -e '.chapters[0].status=="audited" and .chapters[0].findings==0' "$RUNNER_TEMP/date-$chapter.json"
          done
          node scripts/people-identity-registry-worker.mjs --out "$REGISTRY" --revision "$SOURCE"
          node --input-type=module <<'JS'
          import path from 'node:path';
          import {prepareChapterIdentityReview} from './scripts/prepare-people-chapter-identity.mjs';
          for (const chapter of ['053']) {
            const result=await prepareChapterIdentityReview({book:'jinshu',chapter,sourceRevision:process.env.SOURCE,registry:process.env.REGISTRY,out:path.join(process.env.RUNNER_TEMP,'identity-'+chapter),retainedComposition:path.join(process.env.RUNNER_TEMP,'retained-053.json'),transportMaxBytes:384*1024});
            console.log(JSON.stringify(result));
          }
          JS
          cp "$REGISTRY/manifest.json" "$RUNNER_TEMP/registry-export/manifest.json"
          tar -czf "$RUNNER_TEMP/registry-export/registry.tar.gz" -C "$root" "$SOURCE"
          (cd "$RUNNER_TEMP/registry-export" && sha256sum registry.tar.gz manifest.json > SHA256SUMS)
          test "$(stat -c %s "$RUNNER_TEMP/registry-export/registry.tar.gz")" -le 167772160
      - uses: actions/upload-artifact@v4
        with:
          name: people-registry-${{ env.SOURCE }}
          path: ${{ runner.temp }}/registry-export/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jinshu-053-native-identity-evidence
          path: ${{ runner.temp }}/identity-053/
          if-no-files-found: error
          retention-days: 7
