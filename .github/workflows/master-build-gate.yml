name: Verify the independent Jinshu 028 chronology correction
run-name: Verify exact Jinshu 028 data with the independently reviewed chronology rule
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae354c200c30cd147193ed1e2a76582a25e04f04
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - name: Verify production source-only chronology regressions
        run: node --test scripts/test-people-source-only-chronology.mjs
      - name: Validate exact extraction and chronology data
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/jinshu028-master-runtime"
          npm run people:validate -- --book jinshu --chapter 028 2>&1 | tee "$RUNNER_TEMP/jinshu028-master-runtime/validation.txt"
          npm run people:dates:verify -- --book jinshu --chapter 028 2>&1 | tee "$RUNNER_TEMP/jinshu028-master-runtime/dates.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jinshu-028-with-reviewed-source-only-rule
          path: ${{ runner.temp }}/jinshu028-master-runtime/
          if-no-files-found: error
          retention-days: 7
