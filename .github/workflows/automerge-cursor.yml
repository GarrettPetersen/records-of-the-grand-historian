name: Label translation PRs (batch staging)

# Chapter translation PRs must NOT auto-merge to master (each merge triggers a ~10m Cloudflare build).
# Absorb them with scripts/merge-translation-prs-to-staging.mjs or workflow "Merge translation PRs to staging",
# then squash-merge translation-staging → master once.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  label-translation-pr:
    name: Label SDK translation PR
    runs-on: ubuntu-latest
    steps:
      - name: Label cursor/* translation PRs (no auto-merge to master)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          author="$(gh pr view "$PR_URL" --json author --jq '.author.login')"
          is_draft="$(gh pr view "$PR_URL" --json isDraft --jq '.isDraft')"
          head_ref="$(gh pr view "$PR_URL" --json headRefName --jq '.headRefName')"
          echo "PR author: $author"
          echo "PR is draft: $is_draft"
          echo "PR head ref: $head_ref"

          label=0
          case "$author" in
            app/cursor|cursor|"cursor[bot]"|GarrettPetersen)
              label=1
              ;;
          esac

          if [ "$label" -eq 0 ] && [[ "$head_ref" == cursor/* ]]; then
            echo "Head branch matches cursor/*"
            label=1
          fi

          if [ "$label" -eq 0 ]; then
            echo "Not an SDK/Cursor translation PR; skipping."
            exit 0
          fi

          if [ "$is_draft" = "true" ]; then
            echo "Marking draft PR ready for review"
            gh pr ready "$PR_URL"
          fi

          gh pr edit "$PR_URL" --add-label "translation-batch" 2>/dev/null || \
            gh label create "translation-batch" --description "Chapter translation; merge via translation-staging batch" --color "1d76db" && \
            gh pr edit "$PR_URL" --add-label "translation-batch"

          gh pr comment "$PR_URL" --body "This chapter PR is queued for **translation-staging** batch merge (not merged to \`master\` individually, to avoid one Cloudflare build per PR). Run workflow **Merge translation PRs to staging** or \`npm run merge-translation:staging\`, then squash-merge \`translation-staging\` → \`master\` once."
