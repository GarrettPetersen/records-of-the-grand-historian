<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img" aria-labelledby="title desc">
  <title id="title">Book of Chen</title>
  <desc id="desc">Cover design for Book of Chen, using 陳書 as the central cover art.</desc>
  <rect width="1600" height="2560" fill="#ffffff"/>
  <rect width="1600" height="530" fill="#4f5f99"/>
  <rect y="2030" width="1600" height="530" fill="#4f5f99"/>
  <rect x="96" y="96" width="1408" height="2368" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="10"/>
  <text x="800" y="290" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif CJK SC', serif" font-size="84" letter-spacing="3">Chénshū</text>
  <text x="800" y="405" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="54" letter-spacing="1">Chen</text>
  <text x="800" y="1275" text-anchor="middle" dominant-baseline="middle" fill="#111111" font-family="'Songti SC', 'Noto Serif CJK SC', 'STSong', serif" font-size="440" letter-spacing="18">陳書</text>
  <line x1="420" y1="1648" x2="1180" y2="1648" stroke="#4f5f99" stroke-width="8"/>
