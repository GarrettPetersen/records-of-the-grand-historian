  <text x="800" y="1918" text-anchor="middle" fill="#55514a" font-family="Georgia, serif" font-size="48">Chénshū</text>
  <text x="800" y="2208" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="60">Yao Silian</text>
  <text x="800" y="2305" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="43">Translated by Garrett M. Petersen</text>
