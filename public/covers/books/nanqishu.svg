  <rect x="96" y="96" width="1408" height="2368" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="10"/>
  <text x="800" y="290" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif CJK SC', serif" font-size="84" letter-spacing="3">Nán Qíshū</text>
  <text x="800" y="405" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="54" letter-spacing="1">Southern Qi</text>
  <text x="800" y="1275" text-anchor="middle" dominant-baseline="middle" fill="#111111" font-family="'Songti SC', 'Noto Serif CJK SC', 'STSong', serif" font-size="360" letter-spacing="18">南齊書</text>
