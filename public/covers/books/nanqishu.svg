<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img" aria-labelledby="title desc">
  <title id="title">Book of Southern Qi</title>
  <desc id="desc">Cover design for Book of Southern Qi, using 南齊書 as the central cover art.</desc>
  <rect width="1600" height="2560" fill="#ffffff"/>
  <rect width="1600" height="530" fill="#26758c"/>
