<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img" aria-labelledby="title desc">
  <title id="title">Draft History of Qing</title>
  <desc id="desc">Cover design for Draft History of Qing, using 清史稿 as the central cover art.</desc>
  <rect width="1600" height="2560" fill="#ffffff"/>
  <rect width="1600" height="530" fill="#5f6670"/>
  <rect y="2030" width="1600" height="530" fill="#5f6670"/>
  <rect x="96" y="96" width="1408" height="2368" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="10"/>
  <text x="800" y="290" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Songti SC', 'Noto Serif CJK SC', serif" font-size="84" letter-spacing="3">Qīngshǐgǎo</text>
  <text x="800" y="405" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="54" letter-spacing="1">Qing</text>
  <text x="800" y="1275" text-anchor="middle" dominant-baseline="middle" fill="#111111" font-family="'Songti SC', 'Noto Serif CJK SC', 'STSong', serif" font-size="360" letter-spacing="18">清史稿</text>
  <line x1="420" y1="1648" x2="1180" y2="1648" stroke="#5f6670" stroke-width="8"/>
  <text text-anchor="middle" fill="#1c1b18" font-family="Georgia, serif" font-size="72" font-weight="700"><tspan x="800" y="1760">Draft History of Qing</tspan></text>
  <text x="800" y="1918" text-anchor="middle" fill="#55514a" font-family="Georgia, serif" font-size="48">Qīngshǐgǎo</text>
  <text x="800" y="2208" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="60">Zhao Erxun et al.</text>
  <text x="800" y="2305" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="43">Translated by Garrett M. Petersen</text>
